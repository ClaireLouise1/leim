<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function nz(a,b){var v;do{v=ri(a,b);}while(v===0);return v;}
  function r2(v){return Math.round(v*100)/100;}
  var M="−";
  function n_(x){x=Math.round(x*1e6)/1e6;return x<0?M+(-x):String(x);}
  function br(x){return x<0?"("+n_(x)+")":n_(x);}
  function nb(s){return s.replace(/ ([=+−×]) /g," $1 ");}
  /* one term k·v; first term or following term */
  function tm(k,v,first){if(k===0)return "";var a=Math.abs(k),s=(a===1&&v?"":String(a))+v;
    if(first)return (k<0?M:"")+s;return (k<0?" "+M+" ":" + ")+s;}
  /* ax² + bx + c (zero terms dropped) */
  function poly(a,b,c){var T=[[a,"x²"],[b,"x"],[c,""]].filter(function(t){return t[0]!==0;});if(!T.length)return "0";
    return T.map(function(t,i){return tm(t[0],t[1],i===0);}).join("");}
  function pt(x,y){return "("+n_(x)+", "+n_(y)+")";}
  /* bracket (x − r) for root r */
  function fb(r){return r===0?"x":"(x"+(r>0?" "+M+" "+r:" + "+(-r))+")";}
  function facF(r,s){var A=fb(r),B=fb(s);if(A==="x")return "x"+B;if(B==="x")return "x"+A;return A+B;}
  /* x values as an answer: "x = −5 or x = 3" (smallest first) */
  function rs(L){var seen={},V=[];L.forEach(function(v){var k=String(v);if(!seen[k]){seen[k]=1;V.push(v);}});
    V.sort(function(a,b){return a-b;});return V.map(function(v){return "x = "+n_(v);}).join(" or ");}
  function EQ(s){return '<div class="eqs"><p class="e" data-e="1">'+s+'</p></div>';}
  function expS(a,b){return (a===1?"":a+" × ")+b+"ˣ";}
  /* numeric answer (whole numbers), unit u optional */
  function QI(en,ans,slips,why,html,data,u){var seen={},w=[],f=function(x){return n_(x)+(u||"");};seen[f(ans)]=1;
    slips.concat([ans+1,ans-1,-ans,ans+2,ans-2]).forEach(function(x){if(x==null||!isFinite(x)||x!==Math.round(x))return;var s=f(x);if(seen[s]||w.length>=3)return;seen[s]=1;w.push(s);});
    return {en:en,frame:"",html:html||"",answer:f(ans),wrong:w,why:why,review:en+(data&&data.rv?" ("+data.rv+")":"")+" → "+f(ans),data:data||{}};}
  /* choice question: pool must hold only definitely-wrong options */
  function C(en,ans,pool,why,html,data){var seen={},w=[];seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(/NaN|undefined|Infinity/.test(x))return;if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,review:en+(data&&data.rv?" ("+data.rv+")":"")+" → "+ans,data:data||{}};}
  /* x-values answer; slips are lists; any list giving the same answer is dropped */
  function QX(en,xs,slips,why,html,data){var A=rs(xs),a=xs[0],b=xs[xs.length-1];
    var pads=[[a+1,b],[a,b-1],[-a,b],[a,-b],[-a,-b],[a],[b]];
    var pool=slips.concat(pads).filter(function(L){return L&&L.length;}).map(rs).filter(function(s){return s!==A;});
    return C(en,A,pool,why,html,data);}

  /* ---------- graph kit: G({x:[x0,x1],y:[y0,y1],tx,ty,lx,ly,sx,sy,xl,yl,curves:[{f,n,k,lo,hi,side}],pts:[{p,n}]}) ---------- */
  var GID=0;
  function G(o){
    var x0=o.x[0],x1=o.x[1],y0=o.y[0],y1=o.y[1],tx=o.tx||1,ty=o.ty||1,lx=o.lx||tx,ly=o.ly||ty,sx=o.sx||26,sy=o.sy||16,pl=o.pl||30,pr=16,ptp=20,pb=o.y[0]===0?30:24;
    var W=r2((x1-x0)*sx+pl+pr),HH=r2((y1-y0)*sy+ptp+pb),id="gc"+(++GID)+"_"+ri(100,999),h,v;
    var X=function(x){return r2(pl+(x-x0)*sx);},Y=function(y){return r2(ptp+(y1-y)*sy);};
    var mul=function(v,s){return Math.abs(v/s-Math.round(v/s))<1e-9;};
    h='<svg class="tg" viewBox="0 0 '+W+' '+HH+'" style="max-width:'+Math.round(W*1.4)+'px" data-x0="'+x0+'" data-x1="'+x1+'" data-y0="'+y0+'" data-y1="'+y1+'" data-sx="'+sx+'" data-sy="'+sy+'" data-pl="'+pl+'" data-pt="'+ptp+'" role="img" aria-label="'+(o.aria||"A graph on a grid")+'">';
    h+='<defs><clipPath id="'+id+'"><rect x="'+X(x0)+'" y="'+Y(y1)+'" width="'+r2((x1-x0)*sx)+'" height="'+r2((y1-y0)*sy)+'"/></clipPath></defs>';
    for(v=Math.ceil(x0/tx-1e-9)*tx;v<=x1+1e-9;v+=tx)h+='<line class="gl" x1="'+X(v)+'" y1="'+Y(y0)+'" x2="'+X(v)+'" y2="'+Y(y1)+'"/>';
    for(v=Math.ceil(y0/ty-1e-9)*ty;v<=y1+1e-9;v+=ty)h+='<line class="gl" x1="'+X(x0)+'" y1="'+Y(v)+'" x2="'+X(x1)+'" y2="'+Y(v)+'"/>';
    h+='<line class="ax" x1="'+X(x0)+'" y1="'+Y(0)+'" x2="'+X(x1)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(y0)+'" x2="'+X(0)+'" y2="'+Y(y1)+'"/>';
    for(v=Math.ceil(x0/lx-1e-9)*lx;v<=x1+1e-9;v+=lx){v=Math.round(v*1e6)/1e6;if(v===0)continue;h+='<text class="tk" data-v="'+v+'" x="'+X(v)+'" y="'+r2(Y(0)+12)+'" text-anchor="middle">'+n_(v)+'</text>';}
    for(v=Math.ceil(y0/ly-1e-9)*ly;v<=y1+1e-9;v+=ly){v=Math.round(v*1e6)/1e6;if(v===0)continue;h+='<text class="tk" data-w="'+v+'" x="'+r2(X(0)-4)+'" y="'+r2(Y(v)+3.5)+'" text-anchor="end">'+n_(v)+'</text>';}
    h+='<text class="tk" x="'+r2(X(0)-4)+'" y="'+r2(Y(0)+12)+'" text-anchor="end">0</text>';
    h+='<text class="axl" x="'+r2(X(x1)-2)+'" y="'+r2(y0===0?Y(0)+23:Y(0)-5)+'" text-anchor="end">'+(o.xl||"x")+'</text><text class="axl" x="'+r2(X(0)+5)+'" y="'+r2(Y(y1)+12)+'" text-anchor="start">'+(o.yl||"y")+'</text>';
    (o.curves||[]).forEach(function(c,j){var k=c.k||["a","b","c"][j],lo=c.lo==null?x0:c.lo,hi=c.hi==null?x1:c.hi,N=Math.max(40,Math.round((hi-lo)/(x1-x0)*160)),P=[],i,x,y,span=y1-y0;
      for(i=0;i<=N;i++){x=lo+(hi-lo)*i/N;y=c.f(x);if(!isFinite(y)||y<y0-span||y>y1+span)continue;P.push(X(x)+","+Y(y));}
      h+='<polyline class="cv '+k+'" data-n="'+(c.n||"")+'" clip-path="url(#'+id+')" points="'+P.join(" ")+'"/>';
      if(c.n){var at=null,steps=80,m=0.1*span;
        for(i=0;i<=steps;i++){x=c.side==="lo"?lo+(hi-lo)*i/steps:hi-(hi-lo)*i/steps;y=c.f(x);if(y>y0+m&&y<y1-m){at=x;break;}}
        if(at==null)at=(lo+hi)/2;var px=X(at)+(c.side==="lo"?12:-12),py=Y(c.f(at))-6;
        h+='<text class="lnl '+k+'" x="'+r2(Math.min(W-8,Math.max(10,px)))+'" y="'+r2(Math.min(HH-6,Math.max(14,py)))+'" text-anchor="middle">'+c.n+'</text>';}});
    (o.pts||[]).forEach(function(p){h+='<circle class="pt" data-x="'+p.p[0]+'" data-y="'+p.p[1]+'" cx="'+X(p.p[0])+'" cy="'+Y(p.p[1])+'" r="3.6"/>';});
    return h+'</svg>';
  }
  var GR={x:[-5,5],y:[-9,9],sx:26,sy:16,ly:2};
  function grid(curves,aria){return G({x:GR.x,y:GR.y,sx:GR.sx,sy:GR.sy,ly:GR.ly,curves:curves,aria:aria});}

  /* ---------- mapping diagrams ---------- */
  function mapSVG(ins,outs,pairs,letter){var n=Math.max(ins.length,outs.length),Hh=34+n*24,h,cy=function(i,len){return r2(22+(Hh-28)/2-(len-1)*12+i*24);};
    h='<svg class="mp" viewBox="0 0 150 '+Hh+'" data-l="'+(letter||"")+'" role="img" aria-label="Mapping diagram'+(letter?" "+letter:"")+'">';
    if(letter)h+='<text class="ml" x="6" y="15">'+letter+'</text>';
    h+='<ellipse class="ov" cx="38" cy="'+r2(Hh/2+6)+'" rx="22" ry="'+r2(n*12+6)+'"/><ellipse class="ov" cx="112" cy="'+r2(Hh/2+6)+'" rx="22" ry="'+r2(n*12+6)+'"/>';
    ins.forEach(function(v,i){h+='<text class="mi" x="38" y="'+r2(cy(i,ins.length)+5)+'" text-anchor="middle">'+n_(v)+'</text>';});
    outs.forEach(function(v,i){h+='<text class="mo" x="112" y="'+r2(cy(i,outs.length)+5)+'" text-anchor="middle">'+n_(v)+'</text>';});
    pairs.forEach(function(p){var a=cy(ins.indexOf(p[0]),ins.length),b=cy(outs.indexOf(p[1]),outs.length),dx=46,dy=b-a,l=Math.sqrt(dx*dx+dy*dy),ux=dx/l,uy=dy/l,ex=98,ey=b;
      h+='<line class="ar" x1="52" y1="'+a+'" x2="'+ex+'" y2="'+ey+'"/><polygon class="ah" points="'+ex+','+ey+' '+r2(ex-7*ux+3.5*uy)+','+r2(ey-7*uy-3.5*ux)+' '+r2(ex-7*ux-3.5*uy)+','+r2(ey-7*uy+3.5*ux)+'"/>';});
    return h+'</svg>';}

  /* ---------- story sketches ---------- */
  var SHAPE={up:function(u){return .1+.8*u;},down:function(u){return .9-.8*u;},flat:function(u){return .5;},
    hill:function(u){return .1+3.2*u*(1-u);},valley:function(u){return .9-3.2*u*(1-u);},exp:function(u){return .05+.85*(Math.pow(2,5*u)-1)/31;}};
  var STORY=[["up","🚕 Taxi fare as you go further"],["up","🛁 Water in a bath as it fills"],
    ["down","🔋 Phone battery as you play"],["down","🕯️ Height of a burning candle"],["down","⛽ Petrol in the tank on a drive"],
    ["flat","🅿️ Parking: one price all day"],["flat","🚗 Cruise control: same speed"],
    ["hill","⚽ Height of a kicked ball"],["hill","🐬 Height of a dolphin's jump"],
    ["valley","🤿 A diver goes down, then back up"],["valley","🛩️ A plane dips, then climbs back"],
    ["exp","🦠 Bacteria doubling every hour"],["exp","📲 Shares of a video doubling every day"]];
  function sk(shape,letter){var f=SHAPE[shape],P=[],i,u;for(i=0;i<=40;i++){u=i/40;P.push(r2(20+116*u)+","+r2(92-80*f(u)));}
    return '<svg class="sk" viewBox="0 0 150 116" data-l="'+(letter||"")+'" role="img" aria-label="Graph'+(letter?" "+letter:"")+'">'+(letter?'<text class="ml" x="4" y="14">'+letter+'</text>':"")+
      '<line class="ax" x1="16" y1="96" x2="142" y2="96"/><line class="ax" x1="16" y1="96" x2="16" y2="6"/><text class="skl" x="140" y="110" text-anchor="end">time</text>'+
      '<polyline class="cv a" points="'+P.join(" ")+'"/></svg>';}

  /* ================= INPUTS & OUTPUTS ================= */
  function fname(){return rnd(["f","f","g","h"]);}
  function qEval(){var L=fname(),k=nz(-4,5),kind=ri(0,2),a,b,c,e,v,sl,why;
    if(kind===0){a=nz(-5,6);b=nz(-9,9);e=poly(0,a,b);v=a*k+b;sl=[a*(-k)+b,a+k+b,a*k-b,k+b];why=n_(a)+" × "+br(k)+tm(b,"",false)+" = "+n_(v)+".";}
    else if(kind===1){a=rnd([1,1,2,3,-1]);c=nz(-9,9);e=poly(a,0,c);v=a*k*k+c;sl=[a*2*k+c,-a*k*k+c,a*k+c,(a*k)*(a*k)+c];why=(a===1?"":n_(a)+" × ")+br(k)+"² "+tm(c,"",false).trim()+" = "+n_(a*k*k)+tm(c,"",false)+" = "+n_(v)+". A square is never negative.";}
    else{b=nz(-6,6);c=nz(-9,9);e=poly(1,b,c);v=k*k+b*k+c;sl=[-k*k+b*k+c,k*k-b*k+c,2*k+b*k+c,k*k+b+c];why=br(k)+"² = "+n_(k*k)+", "+n_(b)+" × "+br(k)+" = "+n_(b*k)+". "+n_(k*k)+tm(b*k,"",false)+tm(c,"",false)+" = "+n_(v)+".";}
    return QI("Find "+L+"("+n_(k)+").",v,sl,"Put x = "+n_(k)+" in: "+why,EQ(L+"(x) = "+e),{t:"eval",rv:L+"(x) = "+e});}
  function qSolveF(){var a=nz(-5,6),b=nz(-9,9),x=nz(-6,8),k=a*x+b,e=poly(0,a,b);if(a===1&&b===0)return qEval();
    var sl=[a*k+b,k-b,k+b,(k+b)/a,k/a-b];
    return QI("f(x) = "+n_(k)+". Find x.",x,sl,e+" = "+n_(k)+" → "+tm(a,"x",true)+" = "+n_(k-b)+" → x = "+n_(x)+".",EQ("f(x) = "+e),{t:"solvef",k:k,rv:"f(x) = "+e});}
  function qOnGraph(){var kind=ri(0,1),a,b,c,e,f;
    if(kind===0){a=nz(-4,4);b=nz(-6,6);e=poly(0,a,b);f=function(x){return a*x+b;};}else{b=ri(-4,4);c=nz(-6,6);e=poly(1,b,c);f=function(x){return x*x+b*x+c;};}
    var x,y,t=0;do{x=nz(-4,4);y=f(x);t++;}while((Math.abs(y)>20||y===x)&&t<100);
    var cands=[[y,x],[x,y+1],[x,-y],[-x,y],[x,y-1],[x+1,y],[x,f(-x)]].filter(function(p){return f(p[0])!==p[1];}).map(function(p){return pt(p[0],p[1]);});
    return C("Which point is on the graph of f?",pt(x,y),cands,"x = "+n_(x)+": f("+n_(x)+") = "+n_(y)+", so "+pt(x,y)+" is on the graph. A point is (x, y): x first.",EQ("f(x) = "+e),{t:"ongraph",rv:"f(x) = "+e});}
  function qNotFn(){var L=["A","B","C","D"],bad=ri(0,3),ins=rnd([[1,2,3],[0,1,2],[1,2,3,4],[2,3,4]]),svgs=[],badIn=null,two=null;
    for(var i=0;i<4;i++){var outs=shuffle([2,3,4,5,6,7,8,9,10]).slice(0,ri(3,4)).sort(function(a,b){return a-b;}),pairs=ins.map(function(v){return [v,rnd(outs)];});
      if(i===bad){var j=ri(0,ins.length-1),o2;do{o2=rnd(outs);}while(o2===pairs[j][1]);pairs.push([ins[j],o2]);badIn=ins[j];two=[pairs[j][1],o2];}
      svgs.push(mapSVG(ins,outs,pairs,L[i]));}
    return C("Which one is NOT a function?",L[bad],L.filter(function(z,i){return i!==bad;}),L[bad]+": "+badIn+" has two outputs ("+two.join(" and ")+"). A function gives each input exactly one output.",'<div class="maps">'+svgs.join("")+'</div>',{t:"notfn"});}
  function qMapRule(){var a=rnd([2,3,4,5,-1,-2,-3]),b=nz(-5,6),ins=rnd([[1,2,3],[0,1,2],[2,3,4]]),pairs=ins.map(function(v){return [v,a*v+b];});
    var outs=pairs.map(function(p){return p[1];}).slice().sort(function(p,q){return p-q;}),x1=ins[0],y1=a*x1+b,ans="f(x) = "+poly(0,a,b),pool=[];
    [a+1,a-1,a+2,-a,1].forEach(function(a2){if(a2===a||a2===0)return;pool.push("f(x) = "+poly(0,a2,y1-a2*x1));});
    pool.push("f(x) = "+poly(1,0,y1-x1*x1));pool.push("f(x) = "+poly(0,b,a));
    pool=pool.filter(function(s){return s!==ans&&!ins.every(function(v){return EV(s,v)===a*v+b;});});
    return C("Which rule?",ans,pool,"Check every arrow: "+pairs.map(function(p){return "f("+n_(p[0])+") = "+n_(p[1]);}).join(", ")+".",mapSVG(ins,outs,pairs),{t:"maprule"});}
  /* tiny evaluator for the option strings this game writes: f(x) = poly or a × bˣ */
  function EV(s,x){var r=s.replace(/^\w\(x\) = /,"").replace(/−/g,"-").replace(/ /g,"");var m=r.match(/^(?:(\d+)×)?(\d)ˣ$/);if(m)return (m[1]?+m[1]:1)*Math.pow(+m[2],x);
    var tot=0;r.replace(/([+-]?)(\d*)(x²|x|)/g,function(all,sg,d,v){if(!all)return "";var k=(d===""?1:+d)*(sg==="-"?-1:1);tot+=k*(v==="x²"?x*x:v==="x"?x:1);return "";});return tot;}
  function qExpHL(){var b=rnd([2,2,3]),a=rnd([1,2,3,5]),k=ri(0,b===2?4:3),v=a*Math.pow(b,k),e=expS(a,b);
    return QI("Higher Level: Find f("+k+").",v,[a*b*k,Math.pow(a*b,k),a*k*k,a*b+k,a],(k===0?b+"⁰ = 1":b+"ˣ with x = "+k+": "+Array(k+1).join(b+" × ").slice(0,-3)+" = "+Math.pow(b,k))+(a===1?".":". Then × "+a+" = "+v+"."),EQ("f(x) = "+e),{t:"evalexp",hl:1,rv:"f(x) = "+e});}
  function qFindKHL(){for(var t=0;t<200;t++){var p=nz(-3,3),k=nz(-6,6),c=nz(-9,9),v=p*p+k*p+c;if(Math.abs(v)>30)continue;
      var e="f(x) = x² + kx"+tm(c,"",false);
      return QI("Higher Level: f("+n_(p)+") = "+n_(v)+". Find k.",k,[-k,(v+p*p-c)/p,(v-c)/p,v-c],"Put x = "+n_(p)+": "+n_(p*p)+" + "+br(p)+"k"+tm(c,"",false)+" = "+n_(v)+", so "+tm(p,"k",true)+" = "+n_(v-p*p-c)+" and k = "+n_(k)+".",EQ(e),{t:"findk",hl:1,p:p,v:v,rv:e});}
    return qEval();}

  /* ================= READ THE GRAPH ================= */
  function rootsQuad(){var r,d,a=rnd([1,-1]);do{r=ri(-4,3);d=ri(2,5);}while(r+d>4||r+d<-3);return {r:r,s:r+d,a:a,f:function(x){return a*(x-r)*(x-r-d);}};}
  function qRoots(){var Q=rootsQuad(),r=Q.r,s=Q.s,a=Q.a,f=Q.f,en=Math.random()<.5?"Where does f cut the x-axis?":"Use the graph: solve f(x) = 0.";
    return QX(en,[r,s],[[-r,-s],[f(0)],[r,s+1],[(r+s)/2===Math.round((r+s)/2)?(r+s)/2:r-1,s]],"f(x) = 0 where the curve crosses the x-axis: "+rs([r,s])+".",grid([{f:f,n:"f"}],"Graph of the quadratic function f"),{t:"roots",rv:"roots "+n_(r)+", "+n_(s)});}
  function vertQuad(){var h,k,a=rnd([1,-1]);do{h=ri(-3,3);k=ri(-7,7);}while(a>0?k>5:k<-5);return {h:h,k:k,a:a,f:function(x){return a*(x-h)*(x-h)+k;}};}
  function qTurn(){var Q=vertQuad(),h=Q.h,k=Q.k,f=Q.f,mx=Q.a<0,ans=pt(h,k);
    var pool=[pt(k,h),pt(-h,k),pt(h,-k),pt(0,f(0)),pt(h+1,k),pt(h,k+1),pt(h-1,k),pt(h,k-1)].filter(function(s){return s!==ans;});
    return C(mx?"Find the maximum point.":"Find the minimum point.",ans,pool,"The turning point is the "+(mx?"top":"bottom")+" of the curve: x = "+n_(h)+", y = "+n_(k)+". Write x first: "+ans+".",grid([{f:f,n:"f"}],"Graph of the quadratic function f"),{t:"turn",mx:mx?1:0,rv:"turning point"});}
  function qReadVal(){var Q=Math.random()<.5?vertQuad():rootsQuad(),f=Q.f,x,t=0;do{x=nz(-4,4);t++;}while((Math.abs(f(x))>8||f(x)===0||f(x)===x)&&t<100);if(t>=100)return qRoots();
    return QI("Use the graph: find f("+n_(x)+").",f(x),[f(-x),-f(x),x,f(x+1),f(x-1)],"Go to x = "+n_(x)+", then up or down to the curve: f("+n_(x)+") = "+n_(f(x))+".",grid([{f:f,n:"f"}],"Graph of the quadratic function f"),{t:"readval",x:x,rv:"f("+n_(x)+")"});}
  function qSolveK(){for(var t=0;t<200;t++){var a=rnd([1,-1]),h=ri(-2,2),k=ri(-6,6),e=ri(1,3),f=(function(a,h,k){return function(x){return a*(x-h)*(x-h)+k;};})(a,h,k),c=f(h+e);
      if(Math.abs(c)>8||c===0||Math.abs(k)>8||Math.abs(h-e)>4||Math.abs(h+e)>4)continue;
      return QX("Use the graph: solve f(x) = "+n_(c)+".",[h-e,h+e],[[h],[c],[h-e+1,h+e+1],[k,c]],"Go across from y = "+n_(c)+" to the curve, then down to the x-axis: "+rs([h-e,h+e])+".",grid([{f:f,n:"f"}],"Graph of the quadratic function f"),{t:"solvek",c:c,rv:"f(x) = "+n_(c)});}
    return qRoots();}
  function qWhichF(){var Q=rootsQuad(),r=Q.r,s=Q.s,f=function(x){return (x-r)*(x-s);},ans="f(x) = "+facF(r,s),key=rs([r,s]);
    var pool=[[-r,-s],[r,-s],[-r,s],[r,s+1],[r-1,s],[r+1,s+1],[r-1,s-1],[r,s+2]].filter(function(L){return L[0]!==L[1]&&rs(L)!==key;}).map(function(L){return "f(x) = "+facF(L[0],L[1]);});
    return C("Which function is this?",ans,pool,"It cuts the x-axis at "+n_(r)+" and "+n_(s)+", so the brackets are "+fb(r)+" and "+fb(s)+": the sign is the opposite of the root.",grid([{f:f,n:"f"}],"Graph of the quadratic function f"),{t:"whichf",rv:"roots "+n_(r)+", "+n_(s)});}
  function qMeetHL(){for(var t=0;t<500;t++){var Q=rootsQuad(),f=function(x){return (x-Q.r)*(x-Q.s);},p=ri(-4,3),q=ri(p+1,4),fp=f(p),fq=f(q);
      if(Math.abs(fp)>8||Math.abs(fq)>8)continue;var m=(fq-fp)/(q-p),c=fp-m*p;if(m===0||Math.abs(m)>3||Math.abs(c)>7)continue;
      var g=function(x){return m*x+c;},sl=[[Q.r,Q.s],[fp,fq],[p],[q]];if(-c%m===0)sl.push([Q.r,-c/m]);
      return QX("Higher Level: solve f(x) = g(x).",[p,q],sl,"f(x) = g(x) where the two graphs meet: at "+pt(p,fp)+" and "+pt(q,fq)+". Give the x values: "+rs([p,q])+".",grid([{f:f,n:"f"},{f:g,n:"g",k:"b",side:"lo"}],"Graph of the quadratic f and the line g"),{t:"meet",hl:1,rv:"f and g"});}
    return qRoots();}

  /* ================= STORY GRAPHS ================= */
  var SH=["up","down","flat","hill","valley","exp"];
  function storyOf(shape){return rnd(STORY.filter(function(s){return s[0]===shape;}))[1];}
  function qStoryG(){var shapes=shuffle(SH.slice()).slice(0,4),L=["A","B","C","D"],ai=ri(0,3),story=storyOf(shapes[ai]);
    return C("Which graph fits?",L[ai],L.filter(function(z,i){return i!==ai;}),WHY[shapes[ai]],'<div class="eqs story"><p class="e">'+story+'</p></div><div class="maps">'+shapes.map(function(s,i){return sk(s,L[i]);}).join("")+'</div>',{t:"storyg",rv:story});}
  function qGStory(){var shapes=shuffle(SH.slice()).slice(0,4),ans=storyOf(shapes[0]);
    return C("Which story fits the graph?",ans,shapes.slice(1).map(storyOf),WHY[shapes[0]],'<div class="sk1">'+sk(shapes[0])+'</div>',{t:"gstory",rv:"graph"});}
  var WHY={up:"A straight line going up: it grows by the same amount each step.",down:"A straight line going down: it falls by the same amount each step.",flat:"A flat line: it stays the same.",
    hill:"Up, then down: a maximum at the top (a ∩ curve).",valley:"Down, then back up: a minimum at the bottom (a ∪ curve).",exp:"It doubles: slow at first, then faster and faster (exponential)."};
  function qBall(){var o=rnd([[4,5],[4,10],[6,2],[6,4],[6,5],[8,1],[8,2],[8,5]]),T=o[0],a=o[1],H=a*T*T/4,ty=[2,4,5,10,20].filter(function(s){return H%s===0&&H/s<=9;})[0],y1=H+ty;
    var f=function(t){return a*t*(T-t);},pic=G({x:[0,T],y:[0,y1],ty:ty,sx:Math.round(250/T),sy:r2(190/y1),xl:"t (s)",yl:"h (m)",curves:[{f:f,lo:0,hi:T}],aria:"Graph of the height of a ball against time"});
    var kind=ri(0,3),opts,t1,h1;
    if(kind===3){var C1=[];for(t1=1;t1<T/2;t1++)if(f(t1)%ty===0)C1.push(t1);if(!C1.length)kind=0;else{t1=rnd(C1);h1=f(t1);}}
    if(kind===0)return C("⚽ How high does the ball go?",H+" m",[(H-ty)+" m",(H+ty)+" m",(T/2)+" m",T+" m",(H/2)+" m"].filter(function(s){return s!==H+" m";}),"The top of the curve is at h = "+H+" m.",pic,{t:"ballmax",rv:"max height"});
    if(kind===1)return C("⚽ When is the ball highest?",(T/2)+" s",[T+" s",(T/2+1)+" s",(T/2-1)+" s",H+" s"].filter(function(s){return s!==(T/2)+" s";}),"The top of the curve is at t = "+(T/2)+" s, halfway through the flight.",pic,{t:"balltop",rv:"time at top"});
    if(kind===2)return C("⚽ When does the ball land?",T+" s",[(T/2)+" s",(T-1)+" s",(T+1)+" s",H+" s"].filter(function(s){return s!==T+" s";}),"It lands when h = 0 again: t = "+T+" s.",pic,{t:"balland",rv:"lands"});
    var ans=t1+" s and "+(T-t1)+" s",pool=[t1+" s",(T-t1)+" s",(t1+1)+" s and "+(T-t1-1)+" s",(t1-1>0?(t1-1)+" s and "+(T-t1+1)+" s":(T/2)+" s")].filter(function(s){return s!==ans;});
    return C("⚽ When is the ball "+h1+" m high?",ans,pool,"Go across at h = "+h1+" m: it meets the curve twice, on the way up ("+t1+" s) and on the way down ("+(T-t1)+" s).",pic,{t:"ballh",h:h1,rv:h1+" m"});}
  function qTaxi(){var fx=rnd([2,4,6]),r=rnd([1,2,3]),y1=fx+8*r,ly=y1>16?4:2;y1=Math.ceil(y1/2)*2;
    var f=function(d){return fx+r*d;},pic=G({x:[0,8],y:[0,y1],ty:2,ly:ly,sx:30,sy:r2(200/y1),xl:"km",yl:"€",curves:[{f:f,lo:0,hi:8}],aria:"Graph of a taxi fare against distance"});
    var kind=ri(0,3),D=[];for(var d=1;d<=8;d++)if(f(d)%2===0)D.push(d);var d0=rnd(D);
    if(kind===0)return C("🚕 What is the fixed charge?","€"+fx,["€0","€"+r,"€"+(fx+r),"€"+(fx+2),"€"+(fx+8*r),"€"+(fx+1)].filter(function(s){return s!=="€"+fx;}),"At 0 km the fare is already €"+fx+": that's where the line starts on the € axis.",pic,{t:"taxifix",rv:"fixed charge"});
    if(kind===1)return C("🚕 How much is it per km?","€"+r,["€"+fx,"€"+(r+1),"€"+(fx+r),"€"+(r+2),"€"+(fx+8*r),"€"+(r+3)].filter(function(s){return s!=="€"+r;}),"Each km adds €"+r+": the line goes up "+r+" for every 1 across.",pic,{t:"taxirate",rv:"per km"});
    if(kind===2)return C("🚕 What does "+d0+" km cost?","€"+f(d0),["€"+(f(d0)-2),"€"+(f(d0)+2),"€"+(r*d0),"€"+d0,"€"+(f(d0)+4),"€"+(f(d0)-4)].filter(function(s){return s!=="€"+f(d0);}),"Go up from "+d0+" km to the line, then across: €"+f(d0)+".",pic,{t:"taxicost",d:d0,rv:d0+" km"});
    var c=f(d0);return C("🚕 How far can you go for €"+c+"?",d0+" km",[(d0-1)+" km",(d0+1)+" km",c+" km",(c-fx)+" km",(d0+2)+" km"].filter(function(s){return s!==d0+" km"&&!/^(−|0 )/.test(s);}),"Go across from €"+c+" to the line, then down: "+d0+" km.",pic,{t:"taxidist",c:c,rv:"€"+c});}

  /* ================= LINEAR, QUADRATIC OR EXPONENTIAL? ================= */
  var TYPES=["Linear","Quadratic","Exponential"];
  function q3(en,ans,why,html,data){data.n3=1;return C(en,ans,TYPES.filter(function(s){return s!==ans;}),why,html,data);}
  function makeF(kind){var a,b,c;
    if(kind===0){a=nz(-4,5);b=ri(-5,9);return {f:function(x){return a*x+b;},s:poly(0,a,b),j:"+"+a};}
    if(kind===1){if(Math.random()<.5){a=rnd([1,2,3,-1]);c=ri(-4,6);return {f:function(x){return a*x*x+c;},s:poly(a,0,c)};}
      b=ri(-4,3);c=ri(-3,5);return {f:function(x){return x*x+b*x+c;},s:poly(1,b,c)};}
    a=rnd([1,1,2,3,5]);b=rnd([2,2,3]);return {f:function(x){return a*Math.pow(b,x);},s:expS(a,b),b:b};}
  function tbl(f,xs){return '<table class="ft"><tr><th>x</th>'+xs.map(function(x){return "<td>"+n_(x)+"</td>";}).join("")+'</tr><tr><th>f(x)</th>'+xs.map(function(x){return "<td>"+n_(f(x))+"</td>";}).join("")+'</tr></table>';}
  function qClassTab(){var k=ri(0,2),F=makeF(k),xs=[0,1,2,3,4],d=xs.map(function(x){return F.f(x+1)-F.f(x);}).slice(0,4);
    var why=k===0?"Same jump every time ("+(d[0]<0?n_(d[0]):"+"+d[0])+"): linear.":k===1?"The jumps ("+d.map(n_).join(", ")+") change by the same amount each time: quadratic.":"Multiply by "+F.b+" each time: exponential.";
    return q3("Linear, quadratic or exponential?",TYPES[k],why,tbl(F.f,xs),{t:"classtab"});}
  function qClassF(){var k=ri(0,2),F=makeF(k),s=F.s;
    if(k===0&&Math.random()<.4){var a=nz(-4,-1),b=ri(1,9);s=b+" "+M+" "+(a===-1?"":-a)+"x";}
    if(k===1&&Math.random()<.3){var r=nz(-4,4);s="x"+fb(r);}
    var why=k===0?"Highest power x¹: linear (a straight line).":k===1?"An x² term (highest power 2): quadratic.":"x is the power (the index): exponential.";
    return q3("Linear, quadratic or exponential?",TYPES[k],why,EQ("f(x) = "+s),{t:"classf",rv:"f(x) = "+s});}
  function qClassG(){var k=ri(0,2),f;
    if(k===0){var m=nz(-3,3),c=ri(-4,4);f=function(x){return m*x+c;};}
    else if(k===1){var Q=vertQuad();f=Q.f;}
    else{var b=rnd([2,3]),a=rnd([1,1,2]);f=function(x){return a*Math.pow(b,x);};}
    var why=k===0?"A straight line: linear.":k===1?"A ∪ or ∩ curve with a turning point: quadratic.":"Flat on one side, then shooting up faster and faster: exponential.";
    return q3("Linear, quadratic or exponential?",TYPES[k],why,grid([{f:f,n:"f"}],"Graph of the function f"),{t:"classg"});}
  function qTableRule(){var k=ri(0,2),F=makeF(k),xs=[1,2,3,4],y1=F.f(1),ans="f(x) = "+F.s,pool=[];
    [1,2,3,4,-1].forEach(function(a){pool.push("f(x) = "+poly(0,a,y1-a));});pool.push("f(x) = "+poly(1,0,y1-1));
    if(y1>0&&y1%2===0)pool.push("f(x) = "+expS(y1/2,2));if(y1>0&&y1%3===0)pool.push("f(x) = "+expS(y1/3,3));
    pool=pool.filter(function(s){return s!==ans&&!xs.every(function(x){return EV(s,x)===F.f(x);});});
    return C("Which rule fits the table?",ans,pool,"Check every column, not just the first: "+xs.map(function(x){return "f("+x+") = "+n_(F.f(x));}).join(", ")+".",tbl(F.f,xs),{t:"tablerule"});}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    io:[qEval,qEval,qSolveF,qOnGraph,qNotFn,qMapRule,qExpHL,qFindKHL],
    read:[qRoots,qTurn,qReadVal,qSolveK,qWhichF,qMeetHL],
    story:[qStoryG,qGStory,qBall,qBall,qTaxi],
    type:[qClassTab,qClassF,qClassG,qTableRule],
    mixed:[]
  };
  ["io","read","story","type"].forEach(function(m){MAKERS[m].forEach(function(f){if(MAKERS.mixed.indexOf(f)<0)MAKERS.mixed.push(f);});});

  /* fixed diagrams in the rules and the Exam corner */
  var fq=function(x){return x*x-2*x-3;};
  var FIX={
    slin:function(){return G({x:[-3,3],y:[-5,9],ly:4,sx:22,sy:10,pl:24,curves:[{f:function(x){return 3*x+1;}}],aria:"A straight-line graph"});},
    squad:function(){return G({x:[-3,3],y:[-5,9],ly:4,sx:22,sy:10,pl:24,curves:[{f:function(x){return x*x-4;}}],aria:"A U-shaped curve"});},
    sexp:function(){return G({x:[-3,3],y:[-5,9],ly:4,sx:22,sy:10,pl:24,curves:[{f:function(x){return Math.pow(2,x);}}],aria:"An exponential curve"});},
    map:function(){return mapSVG([1,2,3],[5,8,11],[[1,5],[2,8],[3,11]]);},
    ex2:function(){return G({x:[-2,4],y:[-4,5],sx:40,sy:24,curves:[{f:fq,n:"f",lo:-2,hi:4}],aria:"Graph of f(x) = x² − 2x − 3"});},
    ex3:function(){return G({x:[0,4],y:[0,25],ty:5,sx:62,sy:8,xl:"t (s)",yl:"h (m)",curves:[{f:function(t){return 5*t*(4-t);},lo:0,hi:4}],aria:"Graph of a ball's height against time"});},
    ex4:function(){return G({x:[-2,5],y:[-4,12],ly:2,sx:36,sy:16,curves:[{f:fq,n:"f",lo:-2,hi:5},{f:function(x){return x+1;},n:"g",k:"b",lo:-2,hi:5,side:"lo"}],aria:"Graphs of f(x) = x² − 2x − 3 and g(x) = x + 1"});}
  };
  [].forEach.call(document.querySelectorAll("[data-fig]"),function(el){try{el.innerHTML=FIX[el.getAttribute("data-fig")]();}catch(e){}});

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="io"?75:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.data.n3?2:3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=nb(q.en);
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="io"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="io"&&streak%5===0?700:350):3600);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready speed.":score>=11?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,kit:{G:G,mapSVG:mapSVG,sk:sk,EV:EV,FIX:FIX}};
})();
</script>
