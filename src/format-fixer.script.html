  var FI={f:"📨 Formal",i:"😊 Informal"};

  function next(){
    locked=false;var q,tries=0;

  function choose(btn,t){

    setTimeout(function(){if(left>0)next();},ok?(mode==="sort"&&streak%5===0?800:500):3200);
  }

    clearInterval(timer);locked=true;
