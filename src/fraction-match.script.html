<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t;}return a;}
  function lcm(a,b){return a/gcd(a,b)*b;}
  /* fractions are [top, bottom], bottom > 0 */
  function F(n,d){if(d<0){n=-n;d=-d;}var g=gcd(n,d)||1;return [n/g,d/g];}
  function add(a,b){return F(a[0]*b[1]+b[0]*a[1],a[1]*b[1]);}
  function sub(a,b){return F(a[0]*b[1]-b[0]*a[1],a[1]*b[1]);}
  function mul(a,b){return F(a[0]*b[0],a[1]*b[1]);}
  function dvd(a,b){return F(a[0]*b[1],a[1]*b[0]);}
  function eq(a,b){return a[0]*b[1]===b[0]*a[1];}
  function raw(f){return f[1]===1?String(f[0]):f[0]+"/"+f[1];}            // as written, e.g. 6/8
  function fs(f){return raw(F(f[0],f[1]));}                                  // simplest, improper allowed
  function mx(f){f=F(f[0],f[1]);if(f[1]===1)return String(f[0]);var w=Math.floor(f[0]/f[1]),r=f[0]-w*f[1];return (w?w+" ":"")+r+"/"+f[1];} // mixed number
  function M(w,n,d){return [w*d+n,d];}                                       // mixed → improper (not reduced)
  // 3 distinct wrong options whose VALUE is different from the answer (so an equivalent fraction can never be marked wrong)
  function fwrongs(ans,slips,fmt){
    var seen={},out=[];seen[fmt(ans)]=1;
    var pads=[[ans[0]+1,ans[1]],[ans[0]-1,ans[1]],[ans[0],ans[1]+1],[ans[0]+ans[1],ans[1]],[ans[0]*2,ans[1]],[ans[0]+2,ans[1]],[ans[0],ans[1]+2],[1,3],[2,3],[1,4],[3,4],[2,5],[1,6]];
    slips.concat(pads).forEach(function(x){
      if(!x||!isFinite(x[0])||!isFinite(x[1])||x[1]<=0||x[0]<=0||Math.round(x[0])!==x[0]||Math.round(x[1])!==x[1])return;
      if(eq(x,ans))return;if(fmt===raw&&ans[0]<ans[1]&&x[0]>=x[1])return;var s=fmt(x);if(!seen[s]&&out.length<3){seen[s]=1;out.push(s);}});
    return out;}
  function QF(en,frame,ans,slips,why,fmt,html){fmt=fmt||mx;
    return {en:en,frame:frame,html:html||"",answer:fmt(ans),wrong:fwrongs(ans,slips,fmt),why:why,review:(frame?en+" "+frame:en)+" → "+fmt(ans),val:ans};}
  // whole-number answers
  function wrongs(ans,c){var seen={},out=[];seen[ans]=1;
    c.concat([ans+1,ans-1,ans+2,ans-2,ans+10,ans*2]).forEach(function(x){if(typeof x!=="number"||!isFinite(x)||Math.round(x)!==x||x<2)return;if(!seen[x]&&out.length<3){seen[x]=1;out.push(String(x));}});return out;}
  function Q(en,frame,ans,c,why,html,unit){unit=unit||"";var o={en:en,frame:frame,html:html||"",answer:ans+unit,wrong:wrongs(ans,c).map(function(x){return x+unit;}),why:why,review:(frame?en+" "+frame:en)+" → "+ans+unit,num:ans};return o;}
  function C(en,frame,ans,pool,why,review,html){
    var seen={},w=[];seen[ans]=1;shuffle(pool.slice()).forEach(function(x){x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:review||((frame?en+" "+frame:en)+" → "+ans)};}

  /* ---------- pictures ---------- */
  var GREEN="#2E7D57",SOFT="#E7F3EC",INK="#1B2430",YEL="#F6CF5A";
  function cells(d,k){var a=[];for(var i=0;i<d;i++)a.push(i<k);return Math.random()<.5?a:shuffle(a);}
  function barSVG(d,k){var w=300/d,s=cells(d,k),o='<svg viewBox="-4 -4 308 68" width="100%" style="max-width:320px" role="img" aria-label="A bar split into '+d+' equal parts">';
    for(var i=0;i<d;i++)o+='<rect class="pc" data-on="'+(s[i]?1:0)+'" x="'+(i*w).toFixed(2)+'" y="0" width="'+w.toFixed(2)+'" height="60" fill="'+(s[i]?GREEN:"#fff")+'" stroke="'+INK+'" stroke-width="2"/>';
    return o+'</svg>';}
  function pieSVG(d,k){var s=cells(d,k),o='<svg viewBox="-4 -4 168 168" width="100%" style="max-width:170px" role="img" aria-label="A circle split into '+d+' equal slices">';
    for(var i=0;i<d;i++){var a1=2*Math.PI*i/d-Math.PI/2,a2=2*Math.PI*(i+1)/d-Math.PI/2;
      var x1=80+80*Math.cos(a1),y1=80+80*Math.sin(a1),x2=80+80*Math.cos(a2),y2=80+80*Math.sin(a2);
      o+='<path class="pc" data-on="'+(s[i]?1:0)+'" d="M80 80 L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A80 80 0 0 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+(s[i]?GREEN:"#fff")+'" stroke="'+INK+'" stroke-width="2"/>';}
    return o+'</svg>';}
  function gridSVG(r,c,k){var s=cells(r*c,k),w=40,o='<svg viewBox="-4 -4 '+(c*w+8)+' '+(r*w+8)+'" width="100%" style="max-width:'+Math.min(300,c*w+8)+'px" role="img" aria-label="A grid of '+(r*c)+' equal squares">';
    for(var i=0;i<r*c;i++)o+='<rect class="pc" data-on="'+(s[i]?1:0)+'" x="'+(i%c)*w+'" y="'+Math.floor(i/c)*w+'" width="'+w+'" height="'+w+'" fill="'+(s[i]?GREEN:"#fff")+'" stroke="'+INK+'" stroke-width="2"/>';
    return o+'</svg>';}
  function lineSVG(d,k,units){var L=300/units,o='<svg viewBox="-20 -34 340 84" width="100%" style="max-width:340px" role="img" aria-label="A number line from 0 to '+units+'" data-d="'+d+'" data-k="'+k+'">';
    o+='<line x1="0" y1="20" x2="300" y2="20" stroke="'+INK+'" stroke-width="2.5"/>';
    for(var i=0;i<=d*units;i++){var x=(i*L/d).toFixed(2),big=i%d===0;o+='<line x1="'+x+'" y1="'+(big?6:12)+'" x2="'+x+'" y2="'+(big?34:28)+'" stroke="'+INK+'" stroke-width="'+(big?2.5:1.5)+'"/>';
      if(big)o+='<text x="'+x+'" y="50" font-size="16" font-weight="800" text-anchor="middle" fill="'+INK+'" font-family="Inter,sans-serif">'+(i/d)+'</text>';}
    var ax=(k*L/d).toFixed(2);o+='<path d="M'+ax+' 4 l-9 -16 h18 z" fill="'+YEL+'" stroke="'+INK+'" stroke-width="2"/>';
    return o+'</svg>';}
  function pic(d,k){
    if(d===12&&Math.random()<.5)return gridSVG(3,4,k);
    if((d===6||d===8||d===10)&&Math.random()<.35)return gridSVG(2,d/2,k);
    return Math.random()<.5?barSVG(d,k):pieSVG(d,k);}

  /* ---------- Picture match ---------- */
  function qShaded(){
    var d=rnd([3,4,5,6,7,8,9,10,12]),k=ri(1,d-1),a=[k,d];
    return QF("What fraction of the shape is shaded?","",a,[[d-k,d],[k,d-k],[d,k],[k,d+1],[k+1,d]],k+" of the "+d+" equal parts "+(k===1?"is":"are")+" shaded, so "+k+"/"+d+" (the bottom number is how many parts in total).",raw,pic(d,k));
  }
  function qShadedSimplest(){
    var b=rnd([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5],[1,6],[5,6]]),m=rnd([2,3,4].filter(function(x){return b[1]*x<=12;})),d=b[1]*m,k=b[0]*m;
    var o=QF("What fraction is shaded? Give it in its simplest form.","",b,[[d-k,d],[k,d-k],[b[0],b[1]+1],[b[0]+1,b[1]],[d-k,d].map(function(x,i){return i?x/gcd(d-k,d):x/gcd(d-k,d);})],k+"/"+d+" shaded. Divide top and bottom by "+m+": "+k+"/"+d+" = "+raw(b)+".",raw,pic(d,k));
    o.raw=[k,d];return o;
  }
  function qLine(){
    var d=rnd([2,3,4,5,6,8,10]),units=rnd([1,1,2]),k;do{k=ri(1,d*units-1);}while(k%d===0);
    var a=F(k,d),fmt=units===2&&Math.random()<.5?mx:fs;
    return QF("What number is the yellow arrow pointing to?","",a,[[k,d*units],[k+1,d],[k-1,d],[k,d+1],[d,k]],"Each whole is cut into "+d+" equal jumps. The arrow is "+k+" jumps from 0, so "+k+"/"+d+(gcd(k,d)>1||k>d?" = "+mx(a):"")+".",fmt,lineSVG(d,k,units));
  }
  function qPicEquiv(){
    var b=rnd([[1,2],[1,3],[2,3],[1,4],[3,4],[2,5],[3,5]]),m=rnd([2,3].filter(function(x){return b[1]*x<=12;})),d=b[1]*m,k=b[0]*m;
    var pool=[];[[b[0],b[1]+1],[b[0]+1,b[1]],[b[1]-b[0],b[1]],[b[0]+1,b[1]+1],[k,d+2],[k+1,d+1]].forEach(function(x){if(x[0]>0&&x[0]<x[1]&&!eq(x,b))pool.push(raw(x));});
    var e=[b[0]*rnd([2,3,4,5].filter(function(x){return x!==m;})),0];e[1]=e[0]/b[0]*b[1];
    var o=C("Which fraction is the same size as the shaded part?","",raw(e),pool,"Shaded: "+k+"/"+d+" = "+raw(b)+" = "+raw(e)+". Equivalent fractions: multiply or divide top and bottom by the same number.","Shaded "+k+"/"+d+" = "+raw(e),pic(d,k));
    o.raw=[k,d];o.val=e;return o;
  }

  /* ---------- Equivalent & simplify ---------- */
  function qSimplify(){
    var b=rnd([[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[3,7],[2,7],[3,8],[5,8],[7,8],[4,9],[7,10],[5,12]]),m=rnd([2,3,4,5,6,8]),n=b[0]*m,d=b[1]*m;
    var g=gcd(n,d),hf=[n/2,d/2];
    return QF("Write in its simplest form:",n+"/"+d,b,[(g>2&&n%2===0&&d%2===0)?hf:null,[b[0],b[1]+1],[b[0]+1,b[1]],[n-m,d-m],[b[1],b[0]]],"The HCF of "+n+" and "+d+" is "+g+": "+n+" ÷ "+g+" = "+b[0]+" and "+d+" ÷ "+g+" = "+b[1]+". Divide by the HCF to finish in one step.",raw);
  }
  function qMissing(){
    var b=rnd([[1,2],[2,3],[3,4],[2,5],[3,5],[4,5],[5,6],[3,8],[5,8],[7,10],[1,3],[1,4]]),m=ri(2,9),top=Math.random()<.6;
    var fr=top?b[0]+"/"+b[1]+" = ?/"+(b[1]*m):b[0]+"/"+b[1]+" = "+(b[0]*m)+"/?",ans=top?b[0]*m:b[1]*m;
    return Q("Fill in the missing number.",fr,ans,top?[b[0]+m,b[1]*m-b[1]+b[0],b[0]*(m+1)]:[b[1]+m,b[1]*m+b[0],b[1]*(m-1)],"× "+m+" on the bottom means × "+m+" on the top: "+b[0]+"/"+b[1]+" = "+(b[0]*m)+"/"+(b[1]*m)+".");
  }
  function qWhichEquiv(){
    var b=rnd([[1,2],[2,3],[3,4],[2,5],[3,5],[1,3],[1,4],[5,6]]),m=ri(2,6),e=[b[0]*m,b[1]*m];
    var pool=[[b[0]+m,b[1]+m],[b[0]*m,b[1]+m],[b[0]+1,b[1]+1],[b[0]*m+1,b[1]*m],[b[1],b[0]*m+1],[b[0]*m,b[1]*m+1]].filter(function(x){return x[0]>0&&!eq(x,b);}).map(raw);
    var o=C("Which fraction is equal to "+raw(b)+"?","",raw(e),pool,raw(b)+" = "+raw(e)+" (× "+m+" top and bottom). Adding the same number to the top and bottom does NOT give an equal fraction.","Equal to "+raw(b)+": "+raw(e));
    o.val=b;return o;
  }
  function qBiggest(){
    var L=rnd([[[1,2],[2,5],[3,8],[4,9]],[[3,4],[2,3],[5,8],[7,12]],[[2,3],[3,5],[5,9],[7,12]],[[5,6],[4,5],[3,4],[7,10]],[[3,5],[4,7],[5,9],[1,2]],[[7,8],[5,6],[4,5],[3,4]],[[2,3],[5,8],[3,5],[7,12]],[[3,10],[1,4],[2,9],[1,5]]]);
    var big=Math.random()<.6,s=L.slice().sort(function(a,b){return a[0]*b[1]-b[0]*a[1];}),ans=big?s[3]:s[0],d=L.reduce(function(x,f){return lcm(x,f[1]);},1);
    var o=C("Which fraction is the "+(big?"biggest":"smallest")+"?","",raw(ans),L.filter(function(f){return f!==ans;}).map(raw),"Change them all to "+d+"ths: "+L.map(function(f){return raw(f)+" = "+(f[0]*d/f[1])+"/"+d;}).join(", ")+".",(big?"Biggest":"Smallest")+": "+raw(ans)+" (from "+L.map(raw).join(", ")+")");
    o.list=L;o.big=big;return o;
  }
  function qToMixed(){
    var d=rnd([2,3,4,5,6,8]),w=ri(1,5),r=ri(1,d-1);while(gcd(r,d)>1)r=ri(1,d-1);var n=w*d+r;
    return QF("Write as a mixed number:",n+"/"+d,[n,d],[[w*d,d+r],[M(w+1,r,d)[0],d],[M(w,r+1,d)[0],d],[M(r,w,d)[0],d],[M(w-1,r,d)[0],d]],n+" ÷ "+d+" = "+w+" remainder "+r+", so "+w+" "+r+"/"+d+".",mx);
  }
  function qToImproper(){
    var d=rnd([2,3,4,5,6,8]),w=ri(1,5),r=ri(1,d-1);while(gcd(r,d)>1)r=ri(1,d-1);var n=w*d+r;
    return QF("Write as an improper fraction:",w+" "+r+"/"+d,[n,d],[[w+r,d],[w*r+d,d],[w*d,d],[n,w*d],[n+d,d]],w+" × "+d+" = "+(w*d)+", plus "+r+" = "+n+". So "+n+"/"+d+".",raw);
  }

  /* ---------- Add & subtract ---------- */
  var PR=[[2,3],[3,4],[2,5],[3,8],[4,6],[2,6],[3,5],[4,5],[6,8],[3,9],[4,10],[5,6],[6,9],[4,12],[3,12],[2,4],[5,10],[2,8]];
  function nonZero(){return rnd(PR);}
  function frac(d){var n;do{n=ri(1,d-1);}while(gcd(n,d)>1&&Math.random()<.85);return [n,d];}
  function cop(d){var n;do{n=ri(1,d-1);}while(gcd(n,d)>1);return n;}
  function qAddSame(){
    var d=rnd([5,7,8,9,10,11,12]),a=ri(1,d-2),b=ri(1,d-a-1),s=F(a+b,d);
    return QF("Work out:",a+"/"+d+" + "+b+"/"+d,s,[[a+b,2*d],[a*b,d],[a+b+1,d]],"Same bottom number: add the tops, keep the bottom. "+(a+b)+"/"+d+(gcd(a+b,d)>1?" = "+fs(s):"")+".",fs);
  }
  function qAdd(){
    var p=nonZero(),x=frac(p[0]),y=frac(p[1]),s=add(x,y),D=lcm(x[1],y[1]);
    return QF("Work out (simplest form):",raw(x)+" + "+raw(y),s,[[x[0]+y[0],x[1]+y[1]],[x[0]+y[0],D],[x[0]*y[0],x[1]*y[1]],[x[0]+y[0],x[1]*y[1]]],"Common denominator "+D+": "+(x[0]*D/x[1])+"/"+D+" + "+(y[0]*D/y[1])+"/"+D+" = "+(x[0]*D/x[1]+y[0]*D/y[1])+"/"+D+((x[0]*D/x[1]+y[0]*D/y[1])+"/"+D!==mx(s)?" = "+mx(s):"")+". Never add the bottoms!",mx);
  }
  function qSub(){
    var p=nonZero(),x=frac(p[0]),y=frac(p[1]);if(x[0]*y[1]<y[0]*x[1]){var t=x;x=y;y=t;}if(eq(x,y))x=[x[1]-1,x[1]];if(eq(x,y)||x[0]*y[1]<=y[0]*x[1])return qAdd();
    var s=sub(x,y),D=lcm(x[1],y[1]),top=x[0]*D/x[1]-y[0]*D/y[1];
    return QF("Work out (simplest form):",raw(x)+" − "+raw(y),s,[[Math.abs(x[0]-y[0])||1,Math.abs(x[1]-y[1])||1],[Math.abs(x[0]-y[0])||1,D],[x[0]*D/x[1]+y[0]*D/y[1],D]],"Common denominator "+D+": "+(x[0]*D/x[1])+"/"+D+" − "+(y[0]*D/y[1])+"/"+D+" = "+top+"/"+D+(gcd(top,D)>1?" = "+fs(s):"")+".",mx);
  }
  function qMixedAdd(){
    var d1=rnd([2,3,4,5,6]),d2=rnd([2,3,4,6,8].filter(function(x){return x!==d1;})),w1=ri(1,4),w2=ri(1,3),n1=cop(d1),n2=cop(d2);
    var a=M(w1,n1,d1),b=M(w2,n2,d2),s=add(a,b);
    return QF("Work out:",mx(a)+" + "+mx(b),s,[[(w1+w2)*(d1+d2)+n1+n2,d1+d2],M(w1+w2,(n1*d2+n2*d1)%(d1*d2),d1*d2),add(s,[-1,1]),add(s,[1,1]),add([w1+w2,1],[n1+n2,d1*d2])],"Wholes: "+w1+" + "+w2+" = "+(w1+w2)+". Fractions: "+n1+"/"+d1+" + "+n2+"/"+d2+" = "+mx(add([n1,d1],[n2,d2]))+". Total "+mx(s)+".",mx);
  }
  function qMixedSub(){
    var d=rnd([3,4,5,6,8]),w1=ri(3,6),w2=ri(1,w1-1),n1=cop(d),n2=cop(d),a=M(w1,n1,d),b=M(w2,n2,d),s=sub(a,b);if(s[0]<=0)return qMixedAdd();
    var slip=n1<n2?M(w1-w2,n2-n1,d):M(w1-w2-1,n1-n2,d);
    return QF("Work out:",mx(a)+" − "+mx(b),s,[slip,add(s,[1,1]),sub(s,[1,1]),add(s,[1,d])],n1<n2?"You can't take "+n2+"/"+d+" from "+n1+"/"+d+": change to improper fractions. "+a[0]+"/"+d+" − "+b[0]+"/"+d+" = "+s[0]*(d/s[1])+"/"+d+" = "+mx(s)+".":"Wholes: "+w1+" − "+w2+" = "+(w1-w2)+". Fractions: "+n1+"/"+d+" − "+n2+"/"+d+". Answer "+mx(s)+".",mx);
  }

  /* ---------- Multiply & divide ---------- */
  function qMul(){
    var x=frac(rnd([2,3,4,5,6,7,8,9])),y=frac(rnd([2,3,4,5,6,8,10])),p=mul(x,y);
    return QF("Work out (simplest form):",raw(x)+" × "+raw(y),p,[[x[0]*y[1],x[1]*y[0]],[x[0]+y[0],x[1]+y[1]],[x[0]*y[0],x[1]+y[1]],[x[0]*y[0],x[1]*y[1]+1]],"Multiply the tops and multiply the bottoms: "+(x[0]*y[0])+"/"+(x[1]*y[1])+(gcd(x[0]*y[0],x[1]*y[1])>1?" = "+fs(p):"")+". No common denominator needed.",mx);
  }
  function qDiv(){
    var x=frac(rnd([2,3,4,5,6,8])),y=frac(rnd([2,3,4,5,6,9])),q=dvd(x,y);
    return QF("Work out:",raw(x)+" ÷ "+raw(y),q,[mul(x,y),dvd(y,x),[x[0]*y[0],x[1]*y[1]],F(x[1]*y[0],x[0]*y[1])],"Keep, change, flip: "+raw(x)+" × "+y[1]+"/"+y[0]+" = "+(x[0]*y[1])+"/"+(x[1]*y[0])+(F(x[0]*y[1],x[1]*y[0])[1]!==x[1]*y[0]||q[0]>q[1]?" = "+mx(q):"")+".",mx);
  }
  function qOf(){
    var d=rnd([3,4,5,6,8,10]),n=cop(d),m=ri(2,12),Q0=d*m,a=n*m;
    var things=rnd([["€",""],["","students"],["","km"],["","g of flour"],["","minutes"]]);
    var o=Q("Work out:",n+"/"+d+" of "+(things[0]?things[0]+Q0:Q0+" "+things[1]),a,[m,Q0/n|0,Q0-a,n*d],Q0+" ÷ "+d+" = "+m+" (that's 1/"+d+"), then × "+n+" = "+a+". Divide by the bottom, times by the top.");
    if(things[0]){o.answer=things[0]+a;o.wrong=o.wrong.map(function(x){return things[0]+x;});o.review=o.en+" "+o.frame+" → "+o.answer;}
    else{o.answer=a+" "+things[1];o.wrong=o.wrong.map(function(x){return x+" "+things[1];});o.review=o.en+" "+o.frame+" → "+o.answer;}
    o.of=[n,d,Q0];return o;
  }
  function qMixedMul(){
    var w=ri(1,3),d=rnd([2,3,4,5]),n=cop(d),a=M(w,n,d),b=[ri(2,6),1];if(Math.random()<.5)b=frac(rnd([2,3,4,5]));
    var p=mul(a,b);
    return QF("Work out:",mx(a)+" × "+mx(b),p,[F(w*b[0],b[1]).map(function(v,i){return i?v:v;}),add(mul([w,1],b),[n,d]),mul([w*d+n,d+1],b),add(p,[1,1])],"Change to improper first: "+raw(a)+" × "+raw(b)+" = "+(a[0]*b[0])+"/"+(a[1]*b[1])+" = "+mx(p)+". (Don't just multiply the wholes.)",mx);
  }
  function qMixedDiv(){
    var d=rnd([2,3,4,5]),w=ri(1,3),n=cop(d),a=M(w,n,d),y=frac(rnd([2,3,4,5,6])),q=dvd(a,y);
    return QF("Work out:",mx(a)+" ÷ "+raw(y),q,[mul(a,y),dvd(y,a),add(dvd([w,1],y),[n,d]),add(q,[1,1])],"Improper first: "+raw(a)+" ÷ "+raw(y)+" = "+raw(a)+" × "+y[1]+"/"+y[0]+" = "+(a[0]*y[1])+"/"+(a[1]*y[0])+" = "+mx(q)+".",mx);
  }

  /* ---------- Real life ---------- */
  function qPieces(){
    var u=rnd([[1,2],[1,3],[1,4],[3,4],[2,3],[2,5],[1,5]]),k=ri(3,12),tot=F(u[0]*k,u[1]);if(tot[1]!==1)return qPieces();
    var t=rnd([["A ribbon "+tot[0]+" m long is cut into pieces "+raw(u)+" m long. How many pieces?"," pieces"],["A jug holds "+tot[0]+" litres. How many "+raw(u)+"-litre glasses can it fill?"," glasses"]]);
    var o=Q(t[0],"",k,[Math.round(tot[0]*u[0]/u[1])||2,tot[0]*u[1],tot[0]+u[1]],tot[0]+" ÷ "+raw(u)+" = "+tot[0]+" × "+u[1]+"/"+u[0]+" = "+k+".","",t[1]);
    o.pieces=[tot[0],u];return o;
  }
  function qRest(){
    var a=rnd([[1,3],[1,4],[2,5],[1,2],[3,8],[1,6]]),b=rnd([[1,2],[1,3],[1,4],[2,3],[3,4]]),D=a[1]*b[1]*ri(2,6),left1=D-D*a[0]/a[1],ans=left1*b[0]/b[1];
    if(ans!==Math.round(ans)||left1!==Math.round(left1))return qRest();
    var o=Q("Aoife has €"+D+". She spends "+raw(a)+" of it on a phone case, then "+raw(b)+" of what is left on a game. How much does the game cost?","",ans,[D*b[0]/b[1],left1,D-D*a[0]/a[1]-ans,D*a[0]/a[1]],raw(a)+" of €"+D+" = €"+(D*a[0]/a[1])+", so €"+left1+" is left. "+raw(b)+" of €"+left1+" = €"+ans+". \"Of what is left\" means use €"+left1+", not €"+D+".");
    o.answer="€"+ans;o.wrong=o.wrong.map(function(x){return "€"+x;});o.review="€"+D+", spends "+raw(a)+", then "+raw(b)+" of the rest → €"+ans;o.rest=[D,a,b];return o;
  }
  function qWhole(){
    var d=rnd([3,4,5,8,10]),n=cop(d),m=ri(2,9),part=n*m,whole=d*m;
    var o=Q(n+"/"+d+" of the class walk to school. That's "+part+" students. How many are in the class?","",whole,[part*n,part+d,Math.round(part*n/d)||3,part*d],(n===1?"If 1/"+d+" = "+part+", then ":"If "+n+"/"+d+" = "+part+", then 1/"+d+" = "+part+" ÷ "+n+" = "+m+", so ")+d+"/"+d+" = "+m+" × "+d+" = "+whole+".","", " students");
    o.whole=[n,d,part];return o;
  }

  var MAKERS={
    picture:[qShaded,qShaded,qShadedSimplest,qLine,qLine,qPicEquiv],
    equiv:[qSimplify,qSimplify,qMissing,qWhichEquiv,qBiggest,qToMixed,qToImproper],
    addsub:[qAddSame,qAdd,qAdd,qSub,qSub,qMixedAdd,qMixedSub],
    muldiv:[qMul,qMul,qDiv,qDiv,qOf,qMixedMul,qMixedDiv,qPieces,qRest,qWhole],
    mixed:[qShaded,qLine,qPicEquiv,qSimplify,qMissing,qBiggest,qToMixed,qToImproper,qAdd,qSub,qMixedAdd,qMixedSub,qMul,qDiv,qOf,qMixedMul,qPieces,qRest,qWhole]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked,last="",LEN=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;LEN=(m==="addsub"||m==="muldiv"||m==="mixed")?75:60;score=0;streak=0;best=0;left=LEN;mistakes=[];asked=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=LEN+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/LEN*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){pick(b,t);};box.appendChild(b);
    });
  }
  function pick(btn,t){
    if(locked||left<=0)return;locked=true;asked++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="picture"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="picture"&&streak%5===0?700:350):2600);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=22?"Brilliant! That's exam-ready speed.":score>=14?"Great work!":score>=7?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS};
})();
</script>
