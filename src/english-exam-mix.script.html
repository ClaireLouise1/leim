<script>
(function(){
  /* ---------- helpers ---------- */
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  /* choice question: wrong options are unique, never the answer; nw = how many wrong options it needs */
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];ans=String(ans);seen[ans]=1;nw=nw||3;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(/NaN|undefined|Infinity|^-|^0 /.test(x))return;if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,html:html||"",answer:ans,wrong:w,nw:nw,why:why,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  /* ---------- data (src/test_english_exam_mix.py and the PDFs read this block: keep it valid JSON; one item per line) ----------
     paper: the facts every timing question uses (one 2-hour paper, 180 marks at each level)
     cmd: [exam-style question that STARTS with its command word(s), key] — keys in CMD below; no other command word anywhere in it
     task: [writing task, form key, reader as written in the task (or null)] — exactly one form word in the task
     src/test_english_exam_mix.py works out every answer itself from the question text (command words, form words, the numbers on the card). */
  var D=/*DATA*/{
 "paper": {"min": 120, "marks": 180},
 "cmd": [
  ["Identify two facts about the festival from the leaflet.", "find"],
  ["Name the technique used in the first line of the poem.", "find"],
  ["List three things the narrator sees on the beach.", "find"],
  ["Write down the phrase that shows the boy is nervous.", "find"],
  ["Pick out one word that suggests the house is old.", "find"],
  ["Find two details that tell us the match is nearly over.", "find"],
  ["Describe the setting at the start of the story.", "desc"],
  ["Describe the main character's reaction to the news.", "desc"],
  ["Describe the mood of the final scene.", "desc"],
  ["Describe the layout of the poster.", "desc"],
  ["Describe Gran as she appears in the first paragraph.", "desc"],
  ["Explain why the girl hides the letter.", "expl"],
  ["Explain how the writer builds tension in the second paragraph.", "expl"],
  ["Explain what the poet means by the phrase \"a grey blanket of sky\".", "expl"],
  ["Explain why the advert uses a famous footballer.", "expl"],
  ["Explain how the photograph adds to the article.", "expl"],
  ["Compare the two main characters in a novel you have studied.", "comp"],
  ["Compare the openings of the two stories.", "comp"],
  ["Compare the way the two poems present winter.", "comp"],
  ["Contrast the mood at the start of the play with the mood at the end.", "comp"],
  ["Compare a key scene in your film with a key scene in your novel.", "comp"],
  ["Do you agree that the ending is a happy one? Give reasons.", "opin"],
  ["Would you like to visit the island in the text? Give reasons.", "opin"],
  ["Which of the two adverts do you think works better? Give reasons.", "opin"],
  ["In your opinion, is the main character a good friend?", "opin"],
  ["Do you think the headline is a good one? Give reasons.", "opin"],
  ["Summarise the main points of the article in your own words.", "sum"],
  ["Summarise what happens in the first scene.", "sum"],
  ["Sum up the writer's argument in three sentences.", "sum"],
  ["Summarise the advice the leaflet gives to parents.", "sum"],
  ["Sum up the plot of the story in five sentences.", "sum"]
 ],
 "task": [
  ["Write an article for your local newspaper about a place young people in your town love.", "article", "your local newspaper"],
  ["Write the text of a speech for your school assembly on why phones should stay in lockers at lunch.", "speech", "your school assembly"],
  ["Write a letter to the county council asking for a new skate park.", "letter", "the county council"],
  ["Write an email to your principal asking for a school garden.", "email", "your principal"],
  ["Write a diary entry about your first day at a new school.", "diary", null],
  ["Write a short story that begins with a knock at the door.", "story", null],
  ["Write a review of a film you have seen recently for a website for teenagers.", "review", "a website for teenagers"],
  ["Write a report for your Student Council on the state of the school yard.", "report", "your Student Council"],
  ["Write a talk for your classmates about a hobby you love.", "speech", "your classmates"],
  ["Write a letter to your cousin in Australia telling her all your news.", "letter", "your cousin in Australia"],
  ["Write an email to a local radio station about a charity walk your class is running.", "email", "a local radio station"],
  ["Write a review of a book you enjoyed for your school library's newsletter.", "review", "your school library's newsletter"],
  ["Write a report for the Parents' Association on how pupils travel to school.", "report", "the Parents' Association"],
  ["Write a story called \"The Last Train\".", "story", null],
  ["Write a diary entry about the day your team won a final.", "diary", null],
  ["Write an article for a teen magazine giving advice on getting ready for exams.", "article", "a teen magazine"],
  ["Write the text of a speech for first years on how to settle in at secondary school.", "speech", "first years"],
  ["Write a letter to the editor of a newspaper about litter in your town.", "letter", "the editor of a newspaper"],
  ["Write an email to your coach explaining why you missed training.", "email", "your coach"],
  ["Write a report for your Transition Year coordinator on a school trip.", "report", "your Transition Year coordinator"]
 ]
}/*END*/;
  var CMD={find:"🔎 Find it in the text",desc:"📝 Say what it is like",expl:"💡 Say why or how",comp:"⚖️ Alike and different",opin:"🙋 Your view + reasons",sum:"✂️ Main points, short"};
  var FORM={article:"📰 Article",speech:"🎤 Speech or talk",letter:"✉️ Letter",email:"📧 Email",diary:"📔 Diary entry",story:"📖 Story",review:"⭐ Review",report:"📋 Report"};
  var CMDK=Object.keys(CMD),FORMK=Object.keys(FORM);
  var FIXED=CMDK.map(function(k){return CMD[k];}).concat(FORMK.map(function(k){return FORM[k];}));
  var CMDW={find:"Find it in the text: a short answer with the exact detail or words. No long explaining.",
    desc:"Describe: say what it is like, with details from the text.",
    expl:"Explain: say why or how. Use \"because\" and back it up with the text.",
    comp:"Compare: show how the two are alike AND how they are different. Mention both every time.",
    opin:"Your view: say what you think clearly, then give reasons from the text.",
    sum:"Summarise: the main points only, short, in your own words."};
  var CMDRX=/^(Identify|Name|List|Write down|Pick out|Find|Describe|Explain|Compare|Contrast|Do you agree|Do you think|Would you|Which|In your opinion|Summarise|Sum up)/;
  function qCard(s){var m=s.match(CMDRX),h=esc(s);if(m)h='<mark class="hl">'+esc(m[0])+'</mark>'+esc(s.slice(m[0].length));return '<div class="xm-q">'+h+'</div>';}
  function taskCard(s){return '<div class="xm-q xm-task"><span class="xm-k">✍️ WRITING TASK</span>'+esc(s)+'</div>';}
  function facts(lines){return '<div class="facts">'+lines.map(function(l){return "<p>"+l+"</p>";}).join("")+"</div>";}

  /* ================= EXAM TECHNIQUE ================= */
  /* 1 minutes from marks: 120 minutes ÷ 180 marks = ⅔ minute (40 seconds) a mark */
  function qTime(){var P=D.paper,M=rnd([6,9,12,15,18,21,24,27,30,36,45,60]),ans=M*P.min/P.marks;
    if(ans!==Math.round(ans))return qTime();
    var pool=[M,M/2,M*2,M/3,ans+5,ans-5,ans+10].filter(function(x){return x>0&&x===Math.round(x);}).map(function(x){return x+" min";});
    return C("⏱️ Minutes for this question?",ans+" min",pool,
      P.min+" minutes ÷ "+P.marks+" marks = ⅔ of a minute (40 seconds) a mark. "+M+" marks × ⅔ = "+ans+" minutes.",
      facts(["⏱️ Paper: 2 hours · "+P.marks+" marks","📝 This question: "+M+" marks"]),{t:"time",marks:M,rv:M+" marks: minutes?"});}
  /* 2 marks from minutes (the same rule backwards) */
  function qMarks(){var P=D.paper,T=rnd([4,6,8,10,12,14,16,20,24,30,40]),ans=T*P.marks/P.min;
    if(ans!==Math.round(ans))return qMarks();
    var pool=[T,T*2,Math.round(T/2),Math.round(T*2/3),ans+5,ans-5,ans+10,T*3].filter(function(x){return x>0&&x===Math.round(x);}).map(function(x){return x+" marks";});
    return C("📝 About how many marks is it worth?",ans+" marks",pool,
      P.marks+" marks ÷ "+P.min+" minutes = 1½ marks a minute. "+T+" minutes × 1½ = "+ans+" marks. If it's worth less, move on!",
      facts(["⏱️ Paper: 2 hours · "+P.marks+" marks","⌛ You've spent "+T+" minutes on one question"]),{t:"marks",mins:T,rv:T+" minutes: marks?"});}
  /* 3 command words */
  function qCmd(){var it=rnd(D.cmd),k=it[1],ans=CMD[k];
    return C("🎯 What does this question want?",ans,CMDK.filter(function(x){return x!==k;}).map(function(x){return CMD[x];}),CMDW[k],qCard(it[0]),{t:"cmd",q:it[0],rv:it[0]});}
  /* 4 the form a writing task asks for */
  function qForm(){var it=rnd(D.task),k=it[1],ans=FORM[k];
    return C("✍️ What must you write?",ans,FORMK.filter(function(x){return x!==k;}).map(function(x){return FORM[x];}),
      "The task names the form: "+ans.replace(/^\S+ /,"").toLowerCase()+". Use its layout (a letter needs a greeting and a sign-off; a speech talks to an audience).",
      taskCard(it[0]),{t:"form",q:it[0],rv:it[0]});}
  /* 5 who the reader is */
  function qReader(){var ts=D.task.filter(function(x){return x[2];}),it=rnd(ts),ans=it[2];
    var pool=ts.map(function(x){return x[2];}).filter(function(r){return it[0].indexOf(r)<0;});
    return C("👥 Who is it for?",ans,pool,"The reader is in the task: \""+ans+"\". Write the way that reader expects (formal for a principal or a council, chatty for a cousin).",
      taskCard(it[0]),{t:"reader",q:it[0],rv:it[0]});}
  var TECH=[qTime,qMarks,qCmd,qForm,qReader];

  /* ---------- question bundles from the other English games (loaded when needed) ---------- */
  var loading={},SECLOAD={};
  function need(list,cb){var left=list.filter(function(s){return !SECLOAD[s];});
    if(!left.length)return cb();var n=left.length,failed=false;
    function done(err){if(err)failed=true;if(--n===0)cb(failed);}
    left.forEach(function(s){if(loading[s]){loading[s].push(done);return;}loading[s]=[done];
      var sc=document.createElement("script");sc.src="english-exam-mix-"+s+".js?v=1";
      sc.onload=function(){SECLOAD[s]=1;var q=loading[s];loading[s]=null;q.forEach(function(f){f();});};
      sc.onerror=function(){var q=loading[s];loading[s]=null;q.forEach(function(f){f(true);});};
      document.body.appendChild(sc);});}
  var SLUGS={reading:["clue-hunt","fact-or-opinion","ad-breaker","pqe-builder"],
    writing:["paragraph-builder","show-dont-tell","story-spine","format-fixer","register-switch","persuasion-power","format-sort","talk-tips"],
    texts:["character-clues","technique-spotter","twist-detector","plot-line","stage-it","mood-match","shot-spotter","who-said-it","compare-cards"],
    language:["word-sort","sentence-surgeon","comma-catch","spell-strike","word-ladder","tense-trap","speech-marks-sprint","proofread-patrol"]};
  /* one maker per game: picks one of that game's Exam mix questions and tags it with the game */
  function fromGame(slug){var f=function(){var G=window.LEIM_EN[slug],q=rnd(G.M.mixed)();q.src=slug;return q;};f.realName="g_"+slug;return f;}
  function techTag(f){var g=function(){var q=f();q.src="tech";return q;};g.realName=f.name;return g;}
  var MAKERS={tech:TECH.map(techTag),reading:[],writing:[],texts:[],language:[],mixed:[]};
  Object.keys(SLUGS).forEach(function(k){SLUGS[k].forEach(function(s){MAKERS[k].push(fromGame(s));});});
  /* full paper mix: a section first, then a game */
  var MIXW=[["tech",2],["reading",3],["writing",3],["texts",3],["language",2]];
  MAKERS.mixed=[function mixPick(){var tot=0,i;MIXW.forEach(function(w){tot+=w[1];});var r=Math.random()*tot;
    for(i=0;i<MIXW.length;i++){r-=MIXW[i][1];if(r<0)break;}return rnd(MAKERS[MIXW[Math.min(i,MIXW.length-1)][0]])();}];
  var NEEDS={tech:[],reading:["reading"],writing:["writing"],texts:["texts"],language:["language"],mixed:["reading","writing","texts","language"]};

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function game(src){return src&&src!=="tech"&&window.LEIM_EN?LEIM_EN[src]:null;}
  function start(m){
    mode=m;$("en").textContent="Loading…";$("frame").innerHTML="";$("choices").innerHTML="";
    show("play");$("play").scrollIntoView({behavior:"smooth",block:"start"});
    need(NEEDS[m],function(err){
      if(err){$("en").textContent="Couldn't load the questions. Check your connection and try again.";return;}
      DUR=m==="tech"?60:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
      $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
      $("bar").style.width="100%";$("bar").className="";
      next();
      clearInterval(timer);
      timer=setInterval(function(){
        left--;$("time").textContent=left+"s";
        $("bar").style.width=Math.min(100,left/DUR*100)+"%";
        $("bar").className=left<=10?"low":"";
        if(left<=0)finish();
      },1000);
    });
  }
  function name(src){return src==="tech"?"Exam technique":(window.LEIM_EN_GAMES&&LEIM_EN_GAMES[src])||"";}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").innerHTML='<span class="src">'+esc(name(q.src))+'</span>'+esc(q.en);
    $("frame").innerHTML=q.html||"";$("frame").className="frame";
    $("play").className="panel gx-"+q.src;   /* the game's own styles (scoped to .gx-<slug>) apply to its card and buttons */
    var G=game(q.src),box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORDS=q.fixed?[q.fixed]:(G?G.orders:[FIXED]);
    for(var i=0;i<ORDS.length;i++){var O=ORDS[i];if(opts.every(function(o){return O.indexOf(o)>=0;})){opts.sort(function(a,b){return O.indexOf(a)-O.indexOf(b);});break;}}   /* label buttons stay in the game's order */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";
      if(G&&G.pu)b.innerHTML=G.pu(t);else b.textContent=t;
      b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="tech"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||"",src:current.src});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="tech"&&streak%5===0?700:450):3600);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready.":score>=10?"Great work!":score>=5?"Good! Keep going.":"Good start. Try again!";
    $("summary").textContent=msg+" Best streak: "+best+". ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>",games={};
      mistakes.forEach(function(m){var key=m.review+"|"+m.said;if(seen[key])return;seen[key]=1;if(m.src&&m.src!=="tech")games[m.src]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      html+="</ul>";
      var g=Object.keys(games);
      if(g.length)html+="<p style='font-size:15px'><b>Practise:</b> "+g.map(function(s){return "<a href='"+s+".html'>"+esc(name(s))+"</a>";}).join(" · ")+"</p>";
      r.innerHTML=html;
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=5){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,TECH:TECH,load:need,NEEDS:NEEDS,kit:{D:D,CMD:CMD,FORM:FORM}};
})();
</script>
