<script>
(function(){
  /* ---------- helpers ---------- */
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function uf(a,b){return a+Math.random()*(b-a);}
  function r2(x){return Math.round(x*100)/100;}
  /* ---------- data (the PDFs and src/test_shot_spotter.py read this block: keep it valid JSON; one item per line) ----------
     why:   [what the director wants, est / cu / lo / hi / pov]   (the shot or angle that does it)
     sound: [a sound in a scene, di / nd]                         (diegetic: the characters can hear it; non-diegetic: added for us)
     music: [a scene, te / jo / sa / ca]                          (the music that fits its mood)
     edit:  [what we see on screen, cut / slow / flash / fade / mont]
     Shot sizes and camera angles are DRAWN (shotSVG / angleSVG): the checker measures the drawing. */
  var D=/*DATA*/{
 "why": [
  ["The film opens. We need to show the whole fishing village where the story is set.", "est"],
  ["Before the chase begins, show the whole city at night.", "est"],
  ["A new part of the story starts on a farm. Show us where we are.", "est"],
  ["Show the island and the sea all around it before we meet anyone.", "est"],
  ["Set the scene: the school and its car park on the first morning.", "est"],
  ["The audience should see the tears in Mia's eyes as she reads the letter.", "cu"],
  ["Show how nervous Liam's face looks before the penalty.", "cu"],
  ["We need to see her reaction when she opens the door.", "cu"],
  ["Catch the little smile on Gran's face when the band plays her song.", "cu"],
  ["Show the worried expression on Dad's face as he waits by the phone.", "cu"],
  ["Make the headmaster look powerful and frightening.", "lo"],
  ["The new captain should look strong and in charge as she lifts the cup.", "lo"],
  ["Show the security guard towering over the boys at the gate.", "lo"],
  ["The hero should look brave and powerful on top of the wall.", "lo"],
  ["Make the bull look like a threat as it charges.", "lo"],
  ["Make the lost boy look tiny and helpless in the empty station.", "hi"],
  ["Show how small and weak the injured fox looks in the snow.", "hi"],
  ["The bullied girl should look powerless as the others crowd round her.", "hi"],
  ["Make the puppy look small and helpless at the bottom of the stairs.", "hi"],
  ["The beaten team should look tiny on the huge pitch after the final whistle.", "hi"],
  ["We should see the road exactly as the driver sees it.", "pov"],
  ["Let the audience see the exam paper through Aoife's eyes.", "pov"],
  ["Show the dark corridor as if we are the boy walking down it.", "pov"],
  ["Show what the dog sees: legs, shoes and a dropped sandwich.", "pov"],
  ["Show the letter as Seán sees it, from where he is sitting.", "pov"]
 ],
 "sound": [
  ["Mam's car radio plays an old song as they drive.", "di"],
  ["A phone rings in the empty kitchen.", "di"],
  ["The referee's whistle blows for full time.", "di"],
  ["Footsteps creak on the stairs above the boy.", "di"],
  ["A dog barks somewhere outside the window.", "di"],
  ["The band at the wedding plays a slow waltz and the couple dance.", "di"],
  ["Thunder rumbles over the hills as the girls run home.", "di"],
  ["The kettle whistles and Gran gets up to make tea.", "di"],
  ["Two friends argue on the bus, and we hear every word they say.", "di"],
  ["The school bell rings and the corridor fills with noise.", "di"],
  ["A car horn blasts as the boy steps onto the road.", "di"],
  ["The crowd chants the captain's name.", "di"],
  ["Scary violin music builds as the girl opens the attic, but she can't hear it.", "nd"],
  ["An older Liam's voice-over explains what happened that summer.", "nd"],
  ["Soft piano music plays over the scene as the family hug.", "nd"],
  ["A narrator tells us it is the last day of the war.", "nd"],
  ["Drums thump on the soundtrack as the hero runs for the train.", "nd"],
  ["Happy fiddle music is added over the shots of the summer.", "nd"],
  ["An orchestra swells as the boat finally reaches the island.", "nd"],
  ["A pop song plays on the soundtrack while the friends cycle to the beach.", "nd"],
  ["Low music hums under the scene, though nobody in the room can hear it.", "nd"],
  ["The opening titles roll over a lively theme tune.", "nd"],
  ["A narrator reads the girl's diary over pictures of the town.", "nd"],
  ["A heartbeat is added to the soundtrack as the penalty taker steps up.", "nd"]
 ],
 "music": [
  ["A girl hides under the stairs as a stranger searches the house.", "te"],
  ["Two boys run from a guard dog across a dark field.", "te"],
  ["The clock is ticking as Seán tries to open the safe before the guard returns.", "te"],
  ["A shadow creeps along the corridor behind the night nurse.", "te"],
  ["The team wins the county final and the fans pour onto the pitch.", "jo"],
  ["The whole village is dancing at the summer festival.", "jo"],
  ["Friends celebrate the end of the exams with a water fight.", "jo"],
  ["Everyone sings and hugs Gran at her surprise birthday party.", "jo"],
  ["A boy waves goodbye as his best friend's car drives away for good.", "sa"],
  ["The family stand at the grave in the rain.", "sa"],
  ["An old man sits alone in his kitchen at Christmas.", "sa"],
  ["Mam cries as she packs away the baby clothes.", "sa"],
  ["A fishing boat drifts on a flat sea at sunrise.", "ca"],
  ["A baby sleeps in a pram under an apple tree.", "ca"],
  ["Snow falls on a still, silent farmyard.", "ca"],
  ["Two old friends sit on the pier in the calm evening.", "ca"]
 ],
 "edit": [
  ["The film flicks between the clock, the runner's feet and the finish line.", "cut"],
  ["The camera jumps quickly between the two players before the penalty.", "cut"],
  ["A new shot every second: the door, the stairs, the shadow, the door again.", "cut"],
  ["Shots of half a second each flash past as the car skids.", "cut"],
  ["Rapid shots of the crowd, the ball and the keeper build to the goal.", "cut"],
  ["The ball floats through the air towards the goal.", "slow"],
  ["Every drop of rain hangs in the air as she turns.", "slow"],
  ["The jump seems to take forever as the horse clears the wall.", "slow"],
  ["The glass falls slower than real life and smashes on the floor.", "slow"],
  ["The milk spills drop by drop as the boy stares in horror.", "slow"],
  ["We see Grandad as a boy on the same beach, years earlier.", "flash"],
  ["As Niamh holds the medal, the film goes back to the day she first learned to swim.", "flash"],
  ["The old woman looks at a photo, and we see her as a little girl in 1950.", "flash"],
  ["Mid-match, we go back in time to the coach's own last final.", "flash"],
  ["The story jumps to when he was five, crying at the school gate.", "flash"],
  ["The car drives into the night and the screen goes black.", "fade"],
  ["The picture darkens until the boat and the fog are gone.", "fade"],
  ["Slowly the scene darkens until we see nothing at all.", "fade"],
  ["After the funeral, the screen turns black for a few seconds.", "fade"],
  ["The last shot of the empty house goes black, and the credits roll.", "fade"],
  ["Short clips show her training: winter runs, summer runs, weeks of practice.", "mont"],
  ["Over the summer, we see the boys building the boat, a little more each day.", "mont"],
  ["The leaves change on the tree outside the window as months go by.", "mont"],
  ["A series of short clips shows the band practising in the garage.", "mont"],
  ["Days pass: the puppy grows, chews shoes and learns to sit.", "mont"]
 ]
}/*END*/;
  var SHOT={els:"🏔️ Extreme long shot",ls:"🧍 Long shot",ms:"👕 Medium shot",cu:"🙂 Close-up",ecu:"👁️ Extreme close-up"};
  var SWHY={els:"Extreme long shot: the person is tiny and the place fills the screen. It shows where we are.",
    ls:"Long shot: the whole body, head to feet, fills the screen. It shows what the person is doing.",
    ms:"Medium shot: from the waist up. Good for two people talking.",
    cu:"Close-up: the face and shoulders. It shows feelings.",
    ecu:"Extreme close-up: just one part, like the eyes. It shows a tiny detail or a strong feeling."};
  var ANG={hi:"⬇️ High angle",lo:"⬆️ Low angle",eye:"👀 Eye level",bird:"🦅 Bird's-eye view"};
  var AWHY={hi:"High angle: the camera looks DOWN at the person. It makes them look small or weak.",
    lo:"Low angle: the camera looks UP at the person. It makes them look big and powerful.",
    eye:"Eye level: the camera is level with the person's eyes. It feels normal, like meeting them.",
    bird:"Bird's-eye view: the camera is right above, looking straight down, like a bird."};
  var WHY={est:"🏞️ Establishing shot",cu:"🙂 Close-up",lo:"⬆️ Low angle",hi:"⬇️ High angle",pov:"👁️ Point-of-view shot"};
  var WWHY={est:"Establishing shot: a wide shot at the start of a scene that shows WHERE we are.",
    cu:"Close-up: it fills the screen with a face, so we see the feeling.",
    lo:"Low angle: looking up makes a character look big, strong or frightening.",
    hi:"High angle: looking down makes a character look small, weak or alone.",
    pov:"Point-of-view shot: we see exactly what the character sees, through their eyes."};
  var SND={di:"🎬 Diegetic (in the scene)",nd:"🎧 Non-diegetic (added)"};
  var SNWHY={di:"Diegetic: the sound comes from inside the film's world, so the characters can hear it.",
    nd:"Non-diegetic: it's added for the audience (soundtrack music, a voice-over). The characters can't hear it."};
  var MUS={te:"🥁 Low drums, getting faster",jo:"🎻 Bright, bouncy fiddle",sa:"🎹 Slow, soft piano",ca:"🪈 Gentle, quiet flute"};
  var MWHY={te:"Tense scene: low drums that get faster build suspense.",jo:"Happy scene: bright, bouncy music matches the fun.",
    sa:"Sad scene: slow, soft piano matches the sadness.",ca:"Calm scene: gentle, quiet music matches the peace."};
  var EDT={cut:"⚡ Quick cuts",slow:"🐢 Slow motion",flash:"⏪ Flashback",fade:"🌑 Fade to black",mont:"🎞️ Montage"};
  var EWHY={cut:"Quick cuts: lots of very short shots, one after another. They build speed and tension.",
    slow:"Slow motion: the action is slower than real life, so a big moment lasts longer.",
    flash:"Flashback: the film jumps back to the past.",
    fade:"Fade to black: the picture goes dark. It ends a scene or shows time passing.",
    mont:"Montage: short clips joined together to show a lot of time (days, weeks) passing quickly."};
  var FIXED=[].concat.apply([],[SHOT,ANG,WHY,SND,MUS,EDT].map(function(o){return Object.keys(o).map(function(k){return o[k];});}));
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];nw=nw||3;seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,nw:nw,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  function others(L,k){return Object.keys(L).filter(function(x){return x!==k;}).map(function(x){return L[x];});}
  function card(s){return '<div class="sh-card">'+esc(s)+'</div>';}

  /* ---------- drawing kit ----------
     A person is drawn 100 units tall (head top 0, eyes 6.6, chin 13, waist 52, feet 100) inside <g class="fig" transform="translate(x,y) scale(s)">.
     The frame is 320 x 200. The checker reads the transform and measures what part of the body is in the frame. */
  var SKIN=["#F3C9A5","#E2A97E","#C68A5E","#8D5A3B"],HAIR=["#3B2A1E","#7A4A22","#C9A15A","#1E1E1E","#A0522D"],TOP=["#2E7D57","#3A6EA5","#C0392B","#E0B400","#7B4FA0"];
  function person(x,y,s,c){var g='<g class="fig" transform="translate('+r2(x)+','+r2(y)+') scale('+r2(s)+')">';
    g+='<rect x="-6.5" y="52" width="5.5" height="46" fill="#2C3E50"/><rect x="1" y="52" width="5.5" height="46" fill="#2C3E50"/>';
    g+='<ellipse cx="-4" cy="99" rx="4" ry="1.6" fill="#222"/><ellipse cx="4" cy="99" rx="4" ry="1.6" fill="#222"/>';
    g+='<rect x="-13.5" y="16" width="4.5" height="33" rx="2" fill="'+c.top+'"/><rect x="9" y="16" width="4.5" height="33" rx="2" fill="'+c.top+'"/>';
    g+='<rect x="-9" y="15" width="18" height="39" rx="4" fill="'+c.top+'"/><rect x="-2" y="11.5" width="4" height="4.5" fill="'+c.skin+'"/>';
    g+='<circle cx="0" cy="6.6" r="6.4" fill="'+c.skin+'"/><path d="M-6.6,5.5 C-6.6,-1.2 6.6,-1.2 6.6,5.5 C4,2.6 -4,2.6 -6.6,5.5Z" fill="'+c.hair+'"/>';
    g+='<rect x="-3.6" y="4.9" width="2.6" height="0.5" fill="'+c.hair+'"/><rect x="1" y="4.9" width="2.6" height="0.5" fill="'+c.hair+'"/>';
    g+='<circle cx="-2.3" cy="6.6" r="0.95" fill="#fff"/><circle cx="2.3" cy="6.6" r="0.95" fill="#fff"/>';
    g+='<circle cx="-2.3" cy="6.7" r="0.55" fill="#1B2430"/><circle cx="2.3" cy="6.7" r="0.55" fill="#1B2430"/>';
    g+='<rect x="-1.7" y="9.9" width="3.4" height="0.55" rx="0.25" fill="#9B4A3A"/></g>';return g;}
  function colours(){return {skin:rnd(SKIN),hair:rnd(HAIR),top:rnd(TOP)};}
  function shotSVG(k,c){c=c||colours();var bg,x,y,s,P;
    if(k==="els"){s=uf(0.28,0.4);P=100*s;var feet=uf(150,172);y=feet-P;x=uf(40,280);
      bg='<rect width="320" height="200" fill="#CFE8F7"/><path d="M0,120 L60,70 L110,110 L170,55 L240,115 L290,85 L320,100 L320,200 L0,200Z" fill="#8FA9B8"/>'+
        '<rect y="'+r2(feet-6)+'" width="320" height="'+r2(206-feet)+'" fill="#7DB36B"/><circle cx="270" cy="35" r="14" fill="#F6CF5A"/>';}
    else if(k==="ls"){s=uf(1.4,1.7);P=100*s;var ft=uf(186,195);y=ft-P;x=uf(110,210);
      bg='<rect width="320" height="200" fill="#DDE7EE"/><rect y="'+r2(ft-4)+'" width="320" height="'+r2(204-ft)+'" fill="#B9C6A4"/>';}
    else{var f;bg='<rect width="320" height="200" fill="'+rnd(["#E9DFC9","#D6E4EC","#E7D7E0"])+'"/>';x=uf(145,175);
      if(k==="ms"){y=uf(12,28);f=uf(0.45,0.58);P=(200-y)/f;}
      else if(k==="cu"){y=uf(8,20);f=uf(0.22,0.29);P=(200-y)/f;}
      else{var ey=uf(88,112);s=uf(20,26);P=100*s;y=ey-6.6*s;}
      s=P/100;}
    return '<svg class="sh-svg" viewBox="0 0 320 200" role="img" aria-label="A film frame">'+bg+person(x,y,s,c)+'</svg>';}
  function angleSVG(k,c){c=c||colours();var px=225,s=1.3,top=52,ey=top+6.6*s,cx,cy;
    if(k==="hi"){cx=uf(55,80);cy=uf(6,16);}else if(k==="lo"){cx=uf(55,80);cy=uf(168,176);}
    else if(k==="eye"){cx=uf(50,85);cy=ey;}else{cx=px+uf(-4,4);cy=uf(14,22);}
    var rot=Math.atan2(ey-cy,px-cx)*180/Math.PI;if(k==="bird")rot=90;
    var g='<svg class="sh-svg" viewBox="0 0 320 200" role="img" aria-label="Where the camera is"><rect width="320" height="200" fill="#F4F7FA"/>'+
      '<rect y="182" width="320" height="18" fill="#B9C6A4"/>'+person(px,top,s,c)+
      '<line x1="'+r2(cx)+'" y1="'+r2(cy)+'" x2="'+r2(k==="bird"?cx:px)+'" y2="'+r2(k==="bird"?top-2:ey)+'" stroke="#E0B400" stroke-width="2.5" stroke-dasharray="6 5"/>'+
      '<g class="cam" transform="translate('+r2(cx)+','+r2(cy)+') rotate('+r2(rot)+')"><rect x="-15" y="-8" width="22" height="16" rx="3" fill="#1B2430"/>'+
      '<polygon points="7,-5 17,-9 17,9 7,5" fill="#1B2430"/><circle cx="-9" cy="-11" r="4.5" fill="#1B2430"/><circle cx="-1" cy="-11" r="4.5" fill="#1B2430"/></g></svg>';
    return g;}

  /* ================= SHOT SPOTTER: which shot size? ================= */
  function qShot(){var k=rnd(Object.keys(SHOT));
    return C("🎥 Which shot?",SHOT[k],others(SHOT,k),SWHY[k],shotSVG(k),{t:"shot",rv:"Shot size"},3);}
  /* ================= CAMERA ANGLE ================= */
  function qAngle(){var k=rnd(Object.keys(ANG));
    return C("📐 Where is the camera?",ANG[k],others(ANG,k),AWHY[k],angleSVG(k),{t:"angle",rv:"Camera angle"},3);}
  /* ================= WHY THIS SHOT? ================= */
  function qWhy(){var it=rnd(D.why);
    return C("🎬 Which shot does the job?",WHY[it[1]],others(WHY,it[1]),WWHY[it[1]],card("🎬 "+it[0]),{t:"why",s:it[0],rv:it[0]},3);}
  /* ================= SOUND & MUSIC ================= */
  function qSound(){var it=rnd(D.sound);
    return C("🔊 Can the characters hear it?",SND[it[1]],others(SND,it[1]),SNWHY[it[1]],card("🔊 "+it[0]),{t:"sound",s:it[0],rv:it[0]},1);}
  function qMusic(){var it=rnd(D.music);
    return C("🎵 Which music fits?",MUS[it[1]],others(MUS,it[1]),MWHY[it[1]],card("🎬 "+it[0]),{t:"music",s:it[0],rv:it[0]},3);}
  /* ================= EDITING ================= */
  function qEdit(){var it=rnd(D.edit);
    return C("✂️ Which editing trick?",EDT[it[1]],others(EDT,it[1]),EWHY[it[1]],card("🎞️ "+it[0]),{t:"edit",s:it[0],rv:it[0]},3);}

  /* Spot the pattern (rules section): the same person in three shot sizes */
  var sp=document.getElementById("sp-frames");
  if(sp&&sp.innerHTML!==undefined){var cc={skin:SKIN[0],hair:HAIR[1],top:TOP[1]};
    sp.innerHTML=["ls","ms","cu"].map(function(k,i){return '<div class="note"><b class="h">'+"ABC"[i]+'</b>'+shotSVG(k,cc)+'</div>';}).join("");}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    shot:[qShot],
    angle:[qAngle],
    why:[qWhy],
    sound:[qSound,qMusic],
    edit:[qEdit],
    mixed:[qShot,qShot,qAngle,qWhy,qSound,qMusic,qEdit]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=(m==="shot"||m==="angle"||m==="sound")?60:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"start"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while(((q.review===last&&q.data.t!=="shot"&&q.data.t!=="angle")||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=q.fixed||FIXED;
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* label buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="shot"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="shot"&&streak%5===0?800:500):3200);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! You read a film like a director.":score>=12?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){var key=m.review+"|"+m.said;if(seen[key])return;seen[key]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{D:D,SHOT:SHOT,ANG:ANG,WHY:WHY,SND:SND,MUS:MUS,EDT:EDT,shotSVG:shotSVG,angleSVG:angleSVG}};
})();
</script>
