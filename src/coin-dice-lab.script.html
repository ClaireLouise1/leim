<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function range(a,b){var o=[];for(var i=a;i<=b;i++)o.push(i);return o;}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a||1;}
  function F(n,d){var g=gcd(n,d);return [n/g,d/g];}
  function fstr(f){f=F(f[0],f[1]);return f[0]===0?"0":f[0]===f[1]?"1":f[0]+"/"+f[1];}
  function num(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
  function pl(n,w){return num(n)+" "+w+(n===1?"":"s");}
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  // exact decimal of n/d with at most 3 decimal places, else null
  function dec(n,d){if(d<=0||n<0)return null;var f=F(n,d),k=0,p=1;while(k<=3&&(f[0]*p)%f[1]!==0){k++;p*=10;}if(k>3)return null;
    var v=f[0]*p/f[1],s=String(v);if(k===0)return s;while(s.length<=k)s="0"+s;return s.slice(0,s.length-k)+"."+s.slice(s.length-k);}
  function pct(n,d){var s=dec(n*100,d);if(s===null)return null;if(s.indexOf(".")>=0&&s.split(".")[1].length>1)return null;return s+"%";}
  function fmt(f,form){return form==="dec"?dec(f[0],f[1]):form==="pct"?pct(f[0],f[1]):fstr(f);}
  var NAMES=[["Aoife","she"],["Cian","he"],["Niamh","she"],["Darragh","he"],["Saoirse","she"],["Oisín","he"],["Ciara","she"],["Seán","he"],["Róisín","she"],["Eoin","he"]];
  function C(en,frame,ans,pool,why,review,html,data){
    var seen={},w=[];seen[ans]=1;shuffle(pool.slice()).forEach(function(x){x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:review||((frame?en+" "+frame:en)+" → "+ans),data:data||{}};}
  // whole-number answer: slips first, then near misses; never negative, never equal to the answer
  function Q(en,frame,ans,slips,why,html,data){
    var pads=[ans+1,ans-1,ans+2,ans-2,ans*2,ans+10,ans-10],seen={},w=[];seen[ans]=1;
    slips.concat(pads).forEach(function(x){if(typeof x!=="number"||!isFinite(x)||x<0||x!==Math.round(x))return;if(!seen[x]&&w.length<3){seen[x]=1;w.push(num(x));}});
    return {en:en,frame:frame,html:html||"",answer:num(ans),wrong:w,why:why,review:(frame?en+" "+frame:en)+" → "+num(ans),data:data||{}};}
  // probability / relative-frequency answer [n,d] written as form ("dec" | "pct" | "frac");
  // wrong options: EQUAL IN VALUE to the answer, outside 0–1, or not writable in that form are dropped
  function QV(en,frame,ans,slips,form,why,html,data){
    var a=F(ans[0],ans[1]),A=fmt(a,form),seen={},w=[];seen[(a[0]/a[1]).toFixed(9)]=1;
    var b=ans[1],pads=[[ans[0]+1,b],[ans[0]-1,b],[ans[0]+2,b],[ans[0]-2,b],[ans[0]+5,b],[ans[0]-5,b],[ans[0]*2,b]];
    slips.concat(pads).forEach(function(f){if(!f||f[1]<=0||f[0]<0||f[0]>f[1]||f[0]!==Math.round(f[0])||f[1]!==Math.round(f[1]))return;
      var s=fmt(f,form);if(s===null)return;var k=(f[0]/f[1]).toFixed(9);if(!seen[k]&&w.length<3){seen[k]=1;w.push(s);}});
    data=data||{};data.form=form;
    return {en:en,frame:frame,html:html||"",answer:A,wrong:w,why:why,review:(frame?en+" "+frame:en)+" → "+A,data:data};}
  function formWord(form){return form==="dec"?" Give your answer as a decimal.":form==="pct"?" Give your answer as a percentage.":" Give your answer as a fraction in its simplest form.";}

  /* ---------- pictures ---------- */
  var INK="#1B2430",COL={Red:"#D9534F",Blue:"#3B7DD8",Green:"#2E7D57",Yellow:"#F6CF5A",Purple:"#7B5EA7"};
  var TH='style="border:1px solid #D1D5DB;padding:5px 7px;text-align:center;text-transform:none;letter-spacing:0;font-size:14px;background:#E8F2EC;color:#1B2430"',
      TD='style="border:1px solid #D1D5DB;padding:5px 7px;text-align:center"',TQ='style="border:1px solid #D1D5DB;padding:5px 7px;text-align:center;background:#FFF4CC"';
  // results table: one row of outcomes, one row of frequencies (cell hide = "?")
  function freqHTML(head,outs,fs,hide,vert){
    if(vert){var v='<table class="ftab" style="border-collapse:collapse;margin:0 auto 10px;font-size:16px;font-weight:700;min-width:0;width:auto"><tr><th '+TH+'>'+head+'</th><th '+TH+'>Frequency</th></tr>';
      outs.forEach(function(x,i){v+='<tr><th '+TH+' data-o="'+x+'">'+x+'</th>'+(i===hide?'<td '+TQ+' data-f="?">?</td>':'<td '+TD+' data-f="'+fs[i]+'">'+num(fs[i])+'</td>')+'</tr>';});
      return v+'</table>';}
    var o='<table class="ftab" style="border-collapse:collapse;margin:0 auto 10px;font-size:16px;font-weight:700;min-width:0;width:auto"><tr><th '+TH+'>'+head+'</th>'+outs.map(function(x){return '<th '+TH+' data-o="'+x+'">'+x+'</th>';}).join("")+'</tr>';
    o+='<tr><th '+TH+'>Frequency</th>'+fs.map(function(f,i){return i===hide?'<td '+TQ+' data-f="?">?</td>':'<td '+TD+' data-f="'+f+'">'+num(f)+'</td>';}).join("")+'</tr>';
    return o+'</table>';}
  // bar chart of results; gridlines every step from 0; every bar is <rect class="bar" data-c>, every tick <text class="yt" data-v>
  function barSVG(title,cats,fs,step){
    var mx=Math.max.apply(null,fs),top=Math.ceil(mx/step)*step,ticks=[];for(var v=0;v<=top;v+=step)ticks.push(v);if(ticks.length<4)ticks.push(top+step);
    var T=ticks[ticks.length-1],Y=function(v){return 180-150*v/T;},k=cats.length,slot=290/k,bw=Math.min(52,slot*.62);
    var o='<svg class="rfb" viewBox="0 0 340 222" width="100%" style="max-width:420px;display:block;margin:0 auto 8px" role="img" aria-label="Bar chart: '+title+'"><text x="185" y="18" font-size="13" font-weight="700" text-anchor="middle" fill="'+INK+'" font-family="Inter,sans-serif">'+title+'</text>';
    ticks.forEach(function(v){var y=Y(v).toFixed(1);o+='<line class="gl" x1="40" y1="'+y+'" x2="330" y2="'+y+'" stroke="#E3E8EE" stroke-width="1"/><text class="yt" data-v="'+v+'" x="34" y="'+(+y+4)+'" font-size="11" font-weight="600" text-anchor="end" fill="'+INK+'" font-family="Inter,sans-serif">'+v+'</text>';});
    o+='<line x1="40" y1="180" x2="330" y2="180" stroke="'+INK+'" stroke-width="1.5"/><line x1="40" y1="30" x2="40" y2="180" stroke="'+INK+'" stroke-width="1.5"/>';
    cats.forEach(function(c,i){var cx=40+slot*(i+.5),t=Y(fs[i]);
      o+='<rect class="bar" data-c="'+c+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+t.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(180-t).toFixed(1)+'" fill="'+(COL[c]||"#2E7D57")+'"/>';
      o+='<text class="xl" x="'+cx.toFixed(1)+'" y="197" font-size="11.5" font-weight="700" text-anchor="middle" fill="'+INK+'" font-family="Inter,sans-serif">'+c+'</text>';});
    return o+'</svg>';}
  // relative frequency after 10, 20, 50 … 1,000 trials; points <circle class="rp" data-n data-k>, y gridlines every 0.1
  var RN=[10,20,50,100,200,500,1000];
  function rfSVG(ks,lab){
    var X=function(i){return 52+i*44;},Y=function(v){return 190-160*v;},o='<svg class="rfg" viewBox="0 0 340 236" width="100%" style="max-width:420px;display:block;margin:0 auto 8px" role="img" aria-label="Graph of relative frequency against the number of trials">';
    for(var t=0;t<=10;t++){var y=Y(t/10).toFixed(1);o+='<line x1="46" y1="'+y+'" x2="330" y2="'+y+'" stroke="'+(t%5?"#EEF1F4":"#D7DDE4")+'" stroke-width="1"/>'+(t%2===0?'<text class="yt" data-v="'+(t/10)+'" x="40" y="'+(+y+4)+'" font-size="11" font-weight="600" text-anchor="end" fill="'+INK+'" font-family="Inter,sans-serif">'+(t===0?"0":t===10?"1":"0."+t)+'</text>':'');}
    o+='<line x1="46" y1="190" x2="330" y2="190" stroke="'+INK+'" stroke-width="1.5"/><line x1="46" y1="30" x2="46" y2="190" stroke="'+INK+'" stroke-width="1.5"/>';
    o+='<polyline fill="none" stroke="#3B7DD8" stroke-width="2.2" points="'+ks.map(function(k,i){return X(i)+","+Y(k/RN[i]).toFixed(1);}).join(" ")+'"/>';
    ks.forEach(function(k,i){o+='<circle class="rp" data-n="'+RN[i]+'" data-k="'+k+'" cx="'+X(i)+'" cy="'+Y(k/RN[i]).toFixed(1)+'" r="4" fill="#3B7DD8"/><text class="xt" x="'+X(i)+'" y="206" font-size="10.5" font-weight="600" text-anchor="middle" fill="'+INK+'" font-family="Inter,sans-serif">'+num(RN[i])+'</text>';});
    o+='<text x="188" y="224" font-size="11" font-weight="700" text-anchor="middle" fill="#6B7280" font-family="Inter,sans-serif">Number of trials</text><text x="190" y="18" font-size="12" font-weight="700" text-anchor="middle" fill="'+INK+'" font-family="Inter,sans-serif">Relative frequency of '+lab+'</text>';
    return o+'</svg>';}

  /* ---------- experiments ---------- */
  function who(){return rnd(NAMES);}
  var CTX=[
    {s:function(N,k){return "A drawing pin is dropped "+num(N)+" times. It lands point up "+num(k)+" times.";},ev:"the pin landing point up",ex:function(M){return "How many times would you expect it to land point up in "+num(M)+" drops?";},sh:"point up"},
    {s:function(N,k){return "A plastic cup is thrown in the air "+num(N)+" times. It lands on its side "+num(k)+" times.";},ev:"the cup landing on its side",ex:function(M){return "How many times would you expect it to land on its side in "+num(M)+" throws?";},sh:"on its side"},
    {s:function(N,k,p){return p[0]+" flips a water bottle "+num(N)+" times. It lands standing up "+num(k)+" times.";},ev:"the bottle landing standing up",ex:function(M){return "How many times would you expect it to land standing up in "+num(M)+" flips?";},sh:"standing up"},
    {s:function(N,k,p){return p[0]+" takes "+num(N)+" penalties in training and scores "+num(k)+" of them.";},ev:"a penalty being scored",ex:function(M,p){return "How many goals would you expect "+p[1]+" to score from "+num(M)+" penalties?";},sh:"scored"},
    {s:function(N,k,p){return p[0]+" plants "+num(N)+" sunflower seeds and "+num(k)+" of them grow.";},ev:"a seed growing",ex:function(M){return "How many of "+num(M)+" seeds would you expect to grow?";},sh:"grew"},
    {s:function(N,k){return "A survey of the next "+num(N)+" cars to pass the school finds that "+num(k)+" of them are red.";},ev:"a car being red",ex:function(M){return "How many red cars would you expect in the next "+num(M)+" cars?";},sh:"red",mx:.35},
    {s:function(N,k){return "A machine makes "+num(N)+" phone cases and "+num(k)+" of them have a fault.";},ev:"a phone case having a fault",ex:function(M){return "How many faulty cases would you expect in a batch of "+num(M)+"?";},sh:"faulty",mx:.25}];
  var NS=[20,25,40,50,80,100,200,250,400,500];
  function trial(Ns,mx){ // N trials, k successes, relative frequency writable to 3 dp
    var N,k;do{N=rnd(Ns||NS);k=ri(Math.ceil(N*.1),Math.floor(N*(mx||.9)));}while(dec(k,N)===null);return [N,k];}

  /* ---------- Lab: relative frequency ---------- */
  function qRF(){
    var c=rnd(CTX),p=who(),t=trial(null,c.mx),N=t[0],k=t[1],form=rnd(["dec","dec","dec","pct","frac"]);
    if(form==="pct"&&pct(k,N)===null)form="dec";
    var est=Math.random()<.4,a=F(k,N);
    return QV(c.s(N,k,p)+" "+(est?"Use these results to estimate the probability of ":"What is the relative frequency of ")+c.ev+"?"+formWord(form),"",[k,N],[[N-k,N],[k,N-k],[k,100],[k,N+k]],form,
      "Relative frequency = how many times it happened ÷ number of trials = "+num(k)+" ÷ "+num(N)+" = "+fmt(a,form)+"."+(est?" The relative frequency is the best estimate of the probability.":""),"",{t:"rf"});}
  var FACES=[1,2,3,4,5,6];
  function dieRolls(N,lo,hi){var fs,t=0;do{fs=FACES.map(function(){return Math.round(N/6*(lo+Math.random()*(hi-lo)));});fs[5]=N-fs.slice(0,5).reduce(function(a,b){return a+b;},0);t++;}while(fs[5]<1||Math.abs(fs[5]-N/6)>N/6*Math.max(1-lo,hi-1)+1);return fs;}
  function qRFTable(){
    var N=rnd([50,100,200,250,500]),fs=dieRolls(N,.7,1.3),p=who(),kind=rnd(["one","one","even","odd","gt","lt"]),txt,cnt,sel;
    if(kind==="one"){var f=ri(1,6);sel=[f];txt="a "+f;}
    else if(kind==="even"){sel=[2,4,6];txt="an even number";}
    else if(kind==="odd"){sel=[1,3,5];txt="an odd number";}
    else if(kind==="gt"){var g=ri(3,4);sel=FACES.filter(function(x){return x>g;});txt="a number greater than "+g;}
    else{var l=ri(3,4);sel=FACES.filter(function(x){return x<l;});txt="a number less than "+l;}
    cnt=sel.reduce(function(s,x){return s+fs[x-1];},0);
    if(dec(cnt,N)===null)return qRFTable();
    return QV(p[0]+" rolls a die "+num(N)+" times. The table shows the results. What is the relative frequency of "+txt+"? Give your answer as a decimal.","",[cnt,N],[[sel.length,6],[N-cnt,N],[cnt,100],[fs[sel[0]-1],N]],"dec",
      (sel.length>1?"Add the frequencies of "+sel.join(", ")+": "+sel.map(function(x){return fs[x-1];}).join(" + ")+" = "+cnt+". ":"")+"Relative frequency = "+cnt+" ÷ "+num(N)+" = "+dec(cnt,N)+".",freqHTML("Score",FACES,fs),{t:"rftable",sel:sel});}
  function qMissingF(){
    var N=rnd([60,100,120,200,300]),fs=dieRolls(N,.7,1.3),h=ri(0,5),p=who();
    return Q(p[0]+" rolls a die "+num(N)+" times. One frequency in the table is missing. How many times did "+p[1]+" roll a "+(h+1)+"?","",fs[h],[N/6,N-fs[h]],
      "The frequencies add up to the number of rolls, "+num(N)+". The others add up to "+(N-fs[h])+", so the missing one is "+num(N)+" − "+(N-fs[h])+" = "+fs[h]+".",freqHTML("Score",FACES,fs,h),{t:"missf",n:N});}
  function qCombine(){
    var c=rnd(CTX.slice(0,3)),a,b,n1,n2,k1,k2,t=0;
    do{n1=rnd([20,30,40,50,60]);n2=rnd([20,30,40,50,60,80,100]);k1=ri(Math.ceil(n1*.2),Math.floor(n1*.8));k2=ri(Math.ceil(n2*.2),Math.floor(n2*.8));t++;}
    while((n1===n2||dec(1,n1+n2)===null||dec(k1,n1)===null||dec(k2,n2)===null)&&t<400);
    if(t>=400)return qCombine();
    var P=shuffle(NAMES.slice()),A=P[0][0],B=P[1][0],what=c.sh;
    var verb=c===CTX[0]?"drops a drawing pin":c===CTX[1]?"throws a plastic cup":"flips a water bottle";
    return QV(A+" "+verb+" "+n1+" times and it lands "+what+" "+k1+" times. "+B+" does the same "+n2+" times and it lands "+what+" "+k2+" times. They put their results together. What is the relative frequency of landing "+what+" now? Give your answer as a decimal.","",[k1+k2,n1+n2],
      [[k1*n2+k2*n1,2*n1*n2],[k1,n1],[k2,n2],[k1+k2,Math.max(n1,n2)]],"dec",
      "Add the results first: "+(k1+k2)+" times out of "+(n1+n2)+" trials. "+(k1+k2)+" ÷ "+(n1+n2)+" = "+dec(k1+k2,n1+n2)+". (Don't take the mean of "+dec(k1,n1)+" and "+dec(k2,n2)+": "+B+" did "+(n2>n1?"more":"fewer")+" trials.)","",{t:"combine"});}
  function qBest(){
    var c=rnd(CTX.slice(0,3)),P=shuffle(NAMES.slice()).slice(0,4),ns=shuffle([10,20,30,50,100,200,500].slice()).slice(0,4),rows=[],max=Math.max.apply(null,ns);
    var ans,lines=P.map(function(p,i){var k=ri(Math.ceil(ns[i]*.15),Math.floor(ns[i]*.85));if(ns[i]===max)ans=p[0];return p[0]+": "+ns[i]+" trials, "+c.sh+" "+k+" times";});
    return C("Four students test the same "+(c===CTX[0]?"drawing pin":c===CTX[1]?"plastic cup":"water bottle")+". Whose results give the best estimate of the probability of landing "+c.sh+"?","",ans,P.map(function(p){return p[0];}),
      ans+" did the most trials ("+max+"). The more trials, the better the relative frequency is as an estimate of the probability.","Best estimate → the most trials ("+ans+", "+max+")",'<ul class="best" style="list-style:none;padding:8px 14px;margin:8px auto 0;max-width:340px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;font-size:16px;font-weight:600">'+lines.map(function(l){return '<li style="margin:3px 0">'+l+'</li>';}).join("")+'</ul>',{t:"best"});}

  /* ---------- Expected frequency ---------- */
  var EVS=[["an even number",function(n){return n%2===0;}],["a 6",function(n){return n===6;}],["a prime number",function(n){return [2,3,5].indexOf(n)>=0;}],["a multiple of 3",function(n){return n%3===0;}],["a number greater than 4",function(n){return n>4;}],["a 1 or a 2",function(n){return n<3;}],["a number less than 6",function(n){return n<6;}]];
  function fairEvent(){ // {act: "…" + " M times.", intro, n, d, what, tw}
    var k=ri(0,4);
    if(k===0){var e=rnd(EVS),c=FACES.filter(e[1]).length;return {act:"A fair die is rolled",intro:"A fair die is rolled.",n:c,d:6,what:e[0],tw:"rolls"};}
    if(k===1)return {act:"A fair coin is tossed",intro:"A fair coin is tossed.",n:1,d:2,what:"heads",tw:"tosses"};
    if(k===2){var n=rnd([4,5,8,10]),r=ri(1,n-1);return {act:"A fair spinner has "+n+" equal sectors and "+r+" of them are red. It is spun",intro:"A fair spinner has "+n+" equal sectors and "+r+" of them are red.",n:r,d:n,what:"red",tw:"spins"};}
    if(k===3){var R=ri(1,6),B=ri(1,6);return {act:"A bag has "+R+" red and "+B+" blue counters. A counter is picked and put back",intro:"A bag has "+R+" red and "+B+" blue counters. Each time, a counter is picked and put back.",n:R,d:R+B,what:"a red counter",tw:"picks"};}
    var top=rnd([10,20]),ev=rnd([["a multiple of 5",function(n){return n%5===0;}],["an even number",function(n){return n%2===0;}],["a number greater than 7",function(n){return n>7;}]]);
    return {act:"Cards numbered 1 to "+top+" are shuffled, and one is picked and put back",intro:"Cards are numbered 1 to "+top+". Each time, one is picked and put back.",n:range(1,top).filter(ev[1]).length,d:top,what:ev[0],tw:"picks"};}
  function qExpFair(){
    var e=fairEvent(),f=F(e.n,e.d),M=f[1]*rnd([5,10,12,15,20,25,30,40,50,60,100]),ans=M*f[0]/f[1];
    return Q(e.act+" "+num(M)+" times. How many times would you expect "+e.what+"?","",ans,[M*f[0],M/f[1],M-ans,e.n*e.d],
      "Expected frequency = probability × number of trials = "+fstr(f)+" × "+num(M)+" = "+num(ans)+".","",{t:"expfair"});}
  function qExpRF(){
    var c=rnd(CTX),p=who(),N,k,M,t=0;
    do{var tr=trial([20,25,40,50,80,100,200],c.mx);N=tr[0];k=tr[1];M=rnd([100,200,300,400,500,600,800,1000,1200,1500,2000]);t++;}while((M*k%N!==0||M===N)&&t<500);
    if(t>=500)return qExpRF();
    var ans=M*k/N,obj=[p[0],p[1]==="she"?"her":"him"];
    return Q(c.s(N,k,p)+" "+c.ex(M,obj),"",ans,[M-ans,k*M,ans+k,Math.round(M/N)],
      "Relative frequency = "+k+" ÷ "+N+" = "+(dec(k,N)||fstr([k,N]))+". Expected = "+(dec(k,N)||fstr([k,N]))+" × "+num(M)+" = "+num(ans)+".","",{t:"exprf"});}
  function qTrials(){
    var e=fairEvent(),f=F(e.n,e.d);if(f[0]===f[1])return qTrials();
    var T=f[0]*rnd([5,8,10,12,15,20,25,30,40,50]),ans=T*f[1]/f[0];
    return Q(e.intro+" How many "+e.tw+" are needed so that you would expect "+e.what+" on "+num(T)+" of them?","",ans,[T*f[0]/f[1],T*f[1],T+f[1],T*f[0]],
      "P = "+fstr(f)+". "+cap(e.tw)+" × "+fstr(f)+" = "+num(T)+", so "+e.tw+" = "+num(T)+" ÷ "+fstr(f)+" = "+num(ans)+".","",{t:"trials"});}
  function qBagEst(){
    var T,N,k,t=0,p=who();do{T=rnd([10,12,15,20,24,25,30,40]);N=rnd([50,60,100,120,200,250,300]);k=ri(Math.ceil(N*.15),Math.floor(N*.75));t++;}while(T*k%N!==0&&t<500);
    if(t>=500)return qBagEst();var ans=T*k/N;
    return Q("A bag has "+T+" counters, some red. "+p[0]+" picks a counter, notes its colour and puts it back, "+num(N)+" times. A red counter comes up "+num(k)+" times. Estimate how many red counters are in the bag.","",ans,[k,T-ans,N-k,Math.round(k/T)],
      "Relative frequency of red = "+k+" ÷ "+num(N)+" = "+(dec(k,N)||fstr([k,N]))+". Estimate = "+(dec(k,N)||fstr([k,N]))+" × "+T+" counters = "+ans+".","",{t:"bagest"});}
  function qExpDec(){

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="lab"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="lab"&&streak%5===0?700:350):3000);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! That's exam-ready speed.":score>=14?"Great work!":score>=7?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,kit:{barSVG:barSVG,rfSVG:rfSVG,freqHTML:freqHTML,dec:dec}};
})();
</script>
