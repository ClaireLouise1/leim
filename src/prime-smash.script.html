<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function isP(n){if(n<2)return false;for(var i=2;i*i<=n;i++)if(n%i===0)return false;return true;}
  function gcd(a,b){while(b){var t=b;b=a%b;a=t;}return a;}
  function lcm(a,b){return a/gcd(a,b)*b;}
  function divs(n){var o=[];for(var i=1;i<=n;i++)if(n%i===0)o.push(i);return o;}
  function pf(n){var o={},d=2;while(n>1){while(n%d===0){o[d]=(o[d]||0)+1;n/=d;}d++;}return o;}
  var SUP={2:"²",3:"³",4:"⁴",5:"⁵",6:"⁶",7:"⁷"};
  function idx(o){return Object.keys(o).map(Number).sort(function(a,b){return a-b;}).map(function(p){return p+(o[p]>1?SUP[o[p]]:"");}).join(" × ");}
  function longf(n){var o=pf(n),out=[];Object.keys(o).map(Number).sort(function(a,b){return a-b;}).forEach(function(p){for(var k=0;k<o[p];k++)out.push(p);});return out.join(" × ");}
  function why2(n){if(n===1)return "1 has only one factor, so it isn't prime";var o=pf(n),ks=Object.keys(o);return n+" = "+(ks.length===1&&o[ks[0]]===2?ks[0]+" × "+ks[0]:smallSplit(n));}
  function smallSplit(n){for(var d=2;d*d<=n;d++)if(n%d===0)return d+" × "+(n/d);return String(n);}
  var P=[];for(var i=2;i<100;i++)if(isP(i))P.push(i);
  var TRICKY=[1,9,15,21,27,33,39,49,51,57,63,69,77,81,87,91,93,95,99,45,35,55,65,85,25];
  // 3 distinct wrong numbers from slips, padded with near misses
  function wrongs(ans,c,fmt){
    fmt=fmt||String;var seen={},out=[];seen[fmt(ans)]=1;
    c.concat([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10]).forEach(function(x){
      if(typeof x!=="number"||!isFinite(x)||Math.round(x)!==x||x<1)return;
      var s=fmt(x);if(!seen[s]&&out.length<3){seen[s]=1;out.push(s);}});
    return out;}
  function Q(en,frame,ans,c,why,fmt,html){fmt=fmt||String;
    return {en:en,frame:frame,html:html||"",answer:fmt(ans),wrong:wrongs(ans,c,fmt),why:why,review:(frame?en+" "+frame:en)+" → "+fmt(ans)};}
  // choose: answer string + a pool of strings that are all definitely wrong
  function C(en,frame,ans,pool,why,review,html){
    var seen={},w=[];seen[ans]=1;shuffle(pool.slice()).forEach(function(x){x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:review||((frame?en+" "+frame:en)+" → "+ans)};}

  /* ---------- Prime Smash ---------- */
  function composites(k,max){var s={},o=[];while(o.length<k){var n=Math.random()<.7?rnd(TRICKY):ri(4,max);if(!isP(n)&&n<=max&&!s[n]){s[n]=1;o.push(n);}}return o;}
  function qIsPrime(){
    var p=Math.random()<.08?2:rnd(P.slice(1)),c=composites(3,99);
    return C("Smash the prime! Which one is prime?","",p,c,
      "Not prime: "+c.map(why2).join(" · ")+".", "Prime: "+p+" (not "+c.join(", ")+")");
  }
  function qNotPrime(){
    var s={},ps=[];while(ps.length<3){var x=rnd(P);if(!s[x]){s[x]=1;ps.push(x);}}
    var c=composites(1,99)[0];
    return C("Spot the fake! Which one is NOT prime?","",c,ps,why2(c)+".","Not prime: "+c+" ("+why2(c)+")");
  }
  var TRUE=["1 is not a prime number","2 is the only even prime","A prime has exactly two factors","Every number above 1 is prime or a product of primes","51 is not prime","91 = 7 × 13"];
  var FALSE=["1 is a prime number","All odd numbers are prime","9 is a prime number","51 is a prime number","A prime can have three factors","2 is not a prime number","91 is a prime number","57 is a prime number","Every prime is odd","15 is a prime number"];
  function qFact(){
    var t=rnd(TRUE);
    var why={"1 is not a prime number":"1 has only one factor (itself), so it isn't prime.","2 is the only even prime":"2 has factors 1 and 2. Every other even number also divides by 2.","A prime has exactly two factors":"Exactly two: 1 and itself.","Every number above 1 is prime or a product of primes":"That's why factor trees always end in primes.","51 is not prime":"5 + 1 = 6, so 51 divides by 3: 51 = 3 × 17.","91 = 7 × 13":"7 × 13 = 91, so 91 is not prime."}[t];
    return C("Which one is true?","",t,FALSE,why,"True: "+t);
  }

  /* ---------- Factors & multiples ---------- */
  var FN=[12,18,20,24,28,30,36,40,42,45,48,54,56,60,72,84,90,96,100];
  function qFactor(){
    var n=rnd(FN),d=divs(n).filter(function(x){return x>1&&x<n;}),a=rnd(d);
    var pool=[];for(var x=2;x<=Math.min(n-1,25);x++)if(n%x!==0)pool.push(x);
    return C("Which one is a factor of "+n+"?","",a,pool,n+" ÷ "+a+" = "+(n/a)+" exactly. Factors of "+n+": "+divs(n).join(", ")+".","A factor of "+n+": "+a);
  }
  function qNotFactor(){
    var n=rnd(FN),d=shuffle(divs(n).filter(function(x){return x>1&&x<n;})).slice(0,3);
    var pool=[];for(var x=3;x<=Math.min(n-1,25);x++)if(n%x!==0)pool.push(x);
    var a=rnd(pool);
    return C("Which one is NOT a factor of "+n+"?","",a,d,n+" ÷ "+a+" leaves a remainder. Factors of "+n+": "+divs(n).join(", ")+".","Not a factor of "+n+": "+a);
  }
  function qMultiple(){
    var k=ri(3,12),m=ri(3,12),a=k*m,pool=[];
    for(var x=a-6;x<=a+6;x++)if(x>k&&x%k!==0)pool.push(x);
    return C("Which one is a multiple of "+k+"?","",a,pool,k+" × "+m+" = "+a+", so "+a+" is in the "+k+" times table.","A multiple of "+k+": "+a);
  }
  function qNth(){
    var k=ri(3,12),m=ri(3,9),a=k*m,ord={3:"3rd"}[m]||m+"th";
    return Q("What is the "+ord+" multiple of "+k+"?","",a,[k+m,k*(m-1),k*(m+1)],"The "+ord+" multiple is "+k+" × "+m+" = "+a+".");
  }
  function qCount(){
    var n=rnd([10,12,15,16,18,20,24,28,30,32,36,40,48,49,50,60,64,100]),c=divs(n).length;
    return Q("How many factors does "+n+" have?","",c,[c-1,c+1,c-2,Math.floor(c/2)],"In pairs: "+pairs(n)+". That's "+c+" factors: "+divs(n).join(", ")+".");
  }
  function pairs(n){var o=[];for(var i=1;i*i<=n;i++)if(n%i===0)o.push(i+" × "+(n/i));return o.join(", ");}

  /* ---------- Factor trees ---------- */
  function node(x,y,t,prime,hide){
    var r='<g>';
    if(hide)r+='<rect x="'+(x-24)+'" y="'+(y-18)+'" width="48" height="36" rx="8" fill="#F6CF5A" stroke="#1B2430" stroke-width="2"/><text x="'+x+'" y="'+(y+7)+'" font-size="20" font-weight="800" text-anchor="middle" fill="#1B2430" font-family="Inter,sans-serif">?</text>';
    else{if(prime)r+='<circle cx="'+x+'" cy="'+y+'" r="21" fill="#E7F3EC" stroke="#2E7D57" stroke-width="2.5"/>';
      r+='<text x="'+x+'" y="'+(y+7)+'" font-size="20" font-weight="800" text-anchor="middle" fill="#1B2430" font-family="Inter,sans-serif">'+t+'</text>';}
    return r+'</g>';}
  function treeSVG(n,p,m,q,r,hide){
    var o='<svg viewBox="0 0 340 210" width="100%" style="max-width:340px" role="img" aria-label="Factor tree for '+n+'">';
    o+='<g stroke="#1B2430" stroke-width="2"><line x1="170" y1="46" x2="100" y2="88"/><line x1="170" y1="46" x2="240" y2="88"/><line x1="240" y1="122" x2="195" y2="162"/><line x1="240" y1="122" x2="285" y2="162"/></g>';
    o+=node(170,30,n,false,false)+node(100,105,p,true,hide==="p")+node(240,105,m,false,hide==="m")+node(195,180,q,true,hide==="q")+node(285,180,r,true,hide==="r");
    return o+'</svg>';}
  function qTree(){
    var p=rnd([2,2,3,3,5,7]),q=rnd([2,3,3,5,7]),r=rnd([2,3,5,7,11]),m=q*r,n=p*m,h=rnd(["p","m","r"]);
    var ans={p:p,m:m,r:r}[h];
    var why={p:n+" ÷ "+m+" = "+p+".",m:m+" = "+q+" × "+r+" (and "+p+" × "+m+" = "+n+").",r:m+" ÷ "+q+" = "+r+"."}[h];
    var c={p:[m,n-m,p+1],m:[n-p,q+r,n/q],r:[m-q,q,r+q]}[h];
    var o=Q("Fill in the factor tree. What number goes in the yellow box?","",ans,c,why+" Circled numbers are prime.",String,treeSVG(n,p,m,q,r,h));
    o.review="Factor tree for "+n+": "+n+" = "+p+" × "+m+", "+m+" = "+q+" × "+r+" → ? = "+ans;return o;
  }
  var PFN=[12,18,20,24,28,30,36,40,44,45,48,50,52,54,56,60,63,72,75,80,84,88,90,96,98,100,108,112,120,126,132,135,140,144,150,168,180,200,210,225,240,252,270,280,300,360];
  function qIndex(){
    var n=rnd(PFN),o=pf(n),ks=Object.keys(o).map(Number).sort(function(a,b){return a-b;}),ans=idx(o),pool=[];
    // slip 1: a composite left in (looks right, equals n)
    if(ks.length>=2||o[ks[0]]>1){var a=ks[0],b=ks.length>1?ks[1]:ks[0],o2=JSON.parse(JSON.stringify(o));o2[a]--;o2[b]--;var rest=idx(cl(o2));pool.push((rest?rest+" × ":"")+(a*b));}
    // slip 2/3: a power one too big / too small
    ks.forEach(function(p){var o3=JSON.parse(JSON.stringify(o));o3[p]++;pool.push(idx(o3));var o4=JSON.parse(JSON.stringify(o));o4[p]--;if(Object.keys(cl(o4)).length)pool.push(idx(cl(o4)));});
    // slip 4: 2 × n/2 style
    pool.push(ks[0]+" × "+(n/ks[0]));
    pool=pool.filter(function(s){return s!==ans&&s.indexOf("1²")<0;});
    return C("Write "+n+" as a product of primes (index form).","",ans,pool,n+" = "+longf(n)+" = "+ans+". Every factor must be prime.","Product of primes: "+n+" = "+ans);
  }
  function cl(o){var r={};for(var k in o)if(o[k]>0)r[k]=o[k];return r;}
  function qFromIndex(){
    var n=rnd(PFN),o=pf(n),s=idx(o),ks=Object.keys(o).map(Number),c=[];
    var add=0,ex=1;ks.forEach(function(p){add+=p*o[p];ex*=p;});c.push(add);if(ex!==n)c.push(ex);
    ks.forEach(function(p){if(o[p]>1)c.push(n/Math.pow(p,o[p])*p*o[p]);});
    return Q("Which number is this?",s,n,c,s+" = "+longf(n)+" = "+n+". A power means multiply: 2³ = 2 × 2 × 2 = 8.");
  }

  /* ---------- HCF & LCM ---------- */
  function pair(){
    var g,x,y,a,b;do{g=rnd([2,3,4,5,6,8,9,10,12,14,15]);x=ri(2,9);y=ri(2,9);a=g*x;b=g*y;}while(x===y||gcd(x,y)!==1||a>120||b>120);
    return [Math.min(a,b),Math.max(a,b)];}
  function qHCF(){
    var ab=pair(),a=ab[0],b=ab[1],h=gcd(a,b),l=lcm(a,b),cf=divs(h).filter(function(x){return x>1&&x<h;});
    return Q("What is the HCF of "+a+" and "+b+"?","",h,[cf.length?cf[cf.length-1]:1,l,a,b-a],"HCF = the biggest number that goes into both: "+a+" = "+h+" × "+(a/h)+", "+b+" = "+h+" × "+(b/h)+".");
  }
  function qLCM(){
    var ab=pair(),a=ab[0],b=ab[1],h=gcd(a,b),l=lcm(a,b);
    return Q("What is the LCM of "+a+" and "+b+"?","",l,[a*b,h,b*2,l+a],"LCM = the smallest number both go into: "+b+" × "+(l/b)+" = "+l+" and "+a+" × "+(l/a)+" = "+l+".");
  }
  function clock(start,add){var t=start+add,hh=Math.floor(t/60)%24,mm=t%60;return (hh%12||12)+":"+(mm<10?"0":"")+mm+(hh<12?" a.m.":" p.m.");}
  var BUS=[[6,8],[6,10],[8,12],[10,15],[12,18],[12,20],[15,20],[9,12],[10,25],[14,21],[16,24],[20,30],[18,24]];
  function qTogether(){
    var ab=rnd(BUS),a=ab[0],b=ab[1],l=lcm(a,b),st=rnd([7*60,7*60+30,8*60,8*60+15,9*60,13*60,15*60+30,16*60]),t=rnd(["bus","light"]);
    var en=t==="bus"?"One bus leaves every "+a+" minutes and another every "+b+" minutes. Both leave at "+clock(st,0)+" When do they next leave together?"
      :"One light flashes every "+a+" seconds and another every "+b+" seconds. They flash together now. After how many seconds do they next flash together?";
    var fmt=t==="bus"?function(n){return clock(st,n);}:function(n){return n+" seconds";};
    var o=Q(en,"",l,[a*b,a+b,gcd(a,b),b*2],"\"Together again\" means LCM. LCM of "+a+" and "+b+" = "+l+(t==="bus"?" minutes after "+clock(st,0):"."),fmt);
    o.review="LCM of "+a+" and "+b+" = "+l+" → "+fmt(l);return o;
  }
  var SHARE=[["pencils","rubbers","packs"],["red sweets","blue sweets","party bags"],["girls","boys","teams"],["apples","oranges","fruit boxes"]];
  function qShare(){
    var ab=pair(),a=ab[0],b=ab[1],h=gcd(a,b),s=rnd(SHARE);
    var o=Q("There are "+a+" "+s[0]+" and "+b+" "+s[1]+". They're shared into identical "+s[2]+" with nothing left over. What is the greatest number of "+s[2]+"?","",h,[lcm(a,b),a,b-a,(divs(h).filter(function(x){return x<h;}).pop()||1)],"Equal groups, nothing left over → HCF of "+a+" and "+b+" = "+h+". Each has "+(a/h)+" "+s[0]+" and "+(b/h)+" "+s[1]+".");
    o.review="HCF of "+a+" and "+b+" = "+h+" "+s[2];return o;
  }
  function qWhich(){
    var w=rnd([["Two buses arrive together again","LCM"],["Bells ringing together for the next time","LCM"],["The biggest equal teams from a class","HCF"],["Cutting two ribbons into the longest equal pieces","HCF"],["The first day both events happen again","LCM"],["The largest square tile that fits a floor exactly","HCF"]]);
    return {en:"HCF or LCM? Which one solves this?",frame:w[0],answer:w[1],wrong:[w[1]==="LCM"?"HCF":"LCM","Neither: just add them","Neither: just multiply them"],why:w[1]==="LCM"?"Together again / the next time → LCM.":"Biggest equal groups / largest size → HCF.",review:w[0]+" → "+w[1]};
  }

  var MAKERS={
    smash:[qIsPrime,qIsPrime,qIsPrime,qNotPrime,qNotPrime,qFact],
    factors:[qFactor,qFactor,qNotFactor,qMultiple,qMultiple,qNth,qCount],
    tree:[qTree,qTree,qIndex,qIndex,qFromIndex],
    hcf:[qHCF,qHCF,qLCM,qLCM,qTogether,qShare,qWhich],
    mixed:[qIsPrime,qNotPrime,qFact,qFactor,qNotFactor,qMultiple,qCount,qTree,qIndex,qFromIndex,qHCF,qLCM,qTogether,qShare,qWhich]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked,last="",LEN=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;LEN=(m==="hcf"||m==="tree")?75:60;score=0;streak=0;best=0;left=LEN;mistakes=[];asked=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=LEN+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/LEN*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){pick(b,t);};box.appendChild(b);
    });
  }
  function pick(btn,t){
    if(locked||left<=0)return;locked=true;asked++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="smash"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="smash"&&streak%5===0?700:350):2400);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=22?"Brilliant! That's exam-ready speed.":score>=14?"Great work!":score>=7?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,isP:isP,gcd:gcd,lcm:lcm,pf:pf,idx:idx};
})();
</script>
