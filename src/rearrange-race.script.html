<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function nz(a,b){var v;do{v=ri(a,b);}while(v===0);return v;}
  var M="−";
  function n_(x){x=Math.round(x*1e6)/1e6;return x<0?M+(-x):String(x);}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
  function lcm(a,b){return a/gcd(a,b)*b;}
  /* one term k·v; first term or following term */
  function tm(k,v,first){if(k===0)return "";var a=Math.abs(k),s=(a===1&&v?"":String(a))+v;
    if(first)return (k<0?M:"")+s;return (k<0?" "+M+" ":" + ")+s;}
  function lin(a,b,v){v=v||"x";if(a===0)return n_(b);return tm(a,v,true)+tm(b,"",false);}
  function ex(a,b,c){return tm(a,"x²",true)+tm(b,"x",false)+tm(c,"",false);}
  function cub(a,b,c,d){return tm(a,"x³",true)+tm(b,"x²",false)+tm(c,"x",false)+tm(d,"",false);}
  function bk(s){return /. [+−] /.test(s)?"("+s+")":s;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
  /* stacked fraction for the question box */
  function sf(t,b){return '<span class="fr"><span>'+t+'</span><span>'+b+'</span></span>';}
  /* question box: disp = what students see, plain = the same thing in one line (for the checker) */
  function EQ(disp,plain,extra){return '<div class="eqs"><p class="e" data-e="'+esc(plain||disp)+'">'+disp+'</p>'+(extra?'<p class="e2">'+extra+'</p>':'')+'</div>';}
  /* single fraction (Ax + B)/L, fully simplified */
  function fr1(A,B,L){var g=gcd(gcd(A,B),L)||1;A/=g;B/=g;L/=g;if(L<0){A=-A;B=-B;L=-L;}
    if(L===1)return lin(A,B);
    if(B===0)return (A===1?"x":A===-1?M+"x":n_(A)+"x")+"/"+L;
    if(A===0)return n_(B)+"/"+L;
    return "("+lin(A,B)+")/"+L;}
  function fkey(A,B,L){return (A/L).toFixed(9)+"|"+(B/L).toFixed(9);}
  function QI(en,ans,slips,why,html,data){var seen={},w=[];seen[n_(ans)]=1;
    slips.concat([ans+1,ans-1,ans+2,ans-2,-ans]).forEach(function(x){if(x==null||!isFinite(x)||x!==Math.round(x))return;var s=n_(x);if(seen[s]||w.length>=3)return;seen[s]=1;w.push(s);});
    return {en:en,frame:"",html:html||"",answer:n_(ans),wrong:w,why:why,review:en+(data&&data.rv?" ("+data.rv+")":"")+" → "+n_(ans),data:data||{}};}
  /* choice question: pool must hold only definitely-wrong options */
  function C(en,ans,pool,why,html,data){var seen={},w=[];seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(/NaN|undefined|Infinity/.test(x))return;if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,review:en+(data&&data.rv?" ("+data.rv+")":"")+" → "+ans,data:data||{}};}

  /* ================= REARRANGE (change the subject) ================= */
  function qLin(){var a=ri(2,9),b=nz(-12,12),f=ri(0,4),y="y",disp,plain,ans,pool,why;
    if(f===0){plain="y = "+lin(a,b);ans="x = ("+lin(1,-b,y)+")/"+a;
      pool=["x = ("+lin(1,b,y)+")/"+a,"x = y/"+a+tm(-b,"",false),"x = "+a+"("+lin(1,-b,y)+")","x = "+lin(a,-b,y)];
      why="Undo in reverse: "+(b>0?"subtract "+b:"add "+(-b))+", then divide by "+a+".";}
    else if(f===1){plain="y = "+n_(b)+tm(-a,"x",false);ans="x = ("+n_(b)+" "+M+" y)/"+a;
      pool=["x = ("+lin(1,-b,y)+")/"+a,"x = ("+lin(1,b,y)+")/"+a,"x = "+n_(b)+" "+M+" y/"+a,"x = "+lin(-a,b,y)];
      why="Add "+a+"x to both sides: "+a+"x + y = "+n_(b)+". Then "+a+"x = "+n_(b)+" "+M+" y, so divide by "+a+".";}
    else if(f===2){plain="y = ("+lin(1,b)+")/"+a;disp="y = "+sf(lin(1,b),a);ans="x = "+lin(a,-b,y);
      pool=["x = "+lin(a,b,y),"x = "+a+"("+lin(1,-b,y)+")","x = y/"+a+tm(-b,"",false),"x = ("+lin(1,-b,y)+")/"+a];
      why="Multiply by "+a+" first: "+lin(a,0,y)+" = "+lin(1,b)+". Then "+(b>0?"subtract "+b:"add "+(-b))+".";}
    else if(f===3){plain="y = x/"+a+tm(b,"",false);disp="y = "+sf("x",a)+tm(b,"",false);ans="x = "+a+"("+lin(1,-b,y)+")";
      pool=["x = "+lin(a,-b,y),"x = "+a+"("+lin(1,b,y)+")","x = ("+lin(1,-b,y)+")/"+a,"x = y/"+a+tm(-b,"",false)];
      why=(b>0?"Subtract "+b:"Add "+(-b))+" first, then multiply by "+a+".";}
    else{plain="y = "+a+"("+lin(1,b)+")";ans="x = y/"+a+tm(-b,"",false);
      pool=["x = ("+lin(1,-b,y)+")/"+a,"x = y/"+a+tm(b,"",false),"x = "+lin(a,-b,y),"x = "+a+"y"+tm(b,"",false)];
      why="Divide by "+a+" first: y/"+a+" = "+lin(1,b)+". Then "+(b>0?"subtract "+b:"add "+(-b))+".";}
    return C("Make x the subject.",ans,pool,why,EQ(disp||plain,plain),{t:"rearr",sub:"x",rv:plain});}

  var BANK=[
    {f:"v = u + at",s:"t",a:"t = (v − u)/a",w:["t = (v + u)/a","t = v/a − u","t = a(v − u)","t = (u − v)/a"],y:"Subtract u, then divide by a."},
    {f:"v = u + at",s:"u",a:"u = v − at",w:["u = v + at","u = at − v","u = (v − a)/t","u = v/at"],y:"Subtract at from both sides."},
    {f:"v = u + at",s:"a",a:"a = (v − u)/t",w:["a = (v + u)/t","a = v/t − u","a = t(v − u)","a = (u − v)/t"],y:"Subtract u, then divide by t."},
    {f:"P = 2l + 2w",s:"l",a:"l = (P − 2w)/2",w:["l = (P + 2w)/2","l = P/2 − 2w","l = 2(P − 2w)","l = P − w"],y:"Subtract 2w, then divide by 2."},
    {f:"A = lw",s:"w",a:"w = A/l",w:["w = Al","w = l/A","w = A − l"],y:"Divide both sides by l."},
    {f:"s = d/t",s:"d",a:"d = st",w:["d = s/t","d = t/s","d = s + t"],y:"Multiply both sides by t."},
    {f:"s = d/t",s:"t",a:"t = d/s",w:["t = ds","t = s/d","t = d − s"],y:"Multiply by t: st = d. Then divide by s."},
    {f:"C = 2πr",s:"r",a:"r = C/(2π)",w:["r = 2πC","r = 2π/C","r = C − 2π"],y:"Divide both sides by 2π."},
    {f:"V = lwh",s:"h",a:"h = V/(lw)",w:["h = Vlw","h = lw/V","h = V − lw"],y:"Divide both sides by lw."},
    {f:"A = ½bh",s:"h",a:"h = 2A/b",w:["h = A/(2b)","h = 2Ab","h = A/b","h = b/(2A)"],y:"Multiply by 2: 2A = bh. Then divide by b."},
    {f:"F = 1.8C + 32",s:"C",a:"C = (F − 32)/1.8",w:["C = F/1.8 − 32","C = (F + 32)/1.8","C = 1.8(F − 32)"],y:"Subtract 32, then divide by 1.8."},
    {f:"y = mx + c",s:"x",a:"x = (y − c)/m",w:["x = (y + c)/m","x = y/m − c","x = m(y − c)","x = (c − y)/m"],y:"Subtract c, then divide by m."},
    {f:"y = mx + c",s:"m",a:"m = (y − c)/x",w:["m = (y + c)/x","m = y/x − c","m = x(y − c)"],y:"Subtract c, then divide by x."},
    {f:"y = mx + c",s:"c",a:"c = y − mx",w:["c = y + mx","c = mx − y","c = (y − m)/x"],y:"Subtract mx from both sides."},
    {f:"S = 180(n − 2)",s:"n",a:"n = S/180 + 2",w:["n = S/180 − 2","n = (S − 2)/180","n = 180S + 2"],y:"Divide by 180, then add 2."},
    {f:"E = mc²",s:"m",a:"m = E/c²",w:["m = Ec²","m = c²/E","m = E − c²"],y:"Divide both sides by c²."},
    {f:"a = (v − u)/t",s:"v",a:"v = u + at",w:["v = at − u","v = u − at","v = (u + a)t"],y:"Multiply by t: at = v − u. Then add u."}
  ];
  function bankDisp(f){var m=f.match(/^(\w) = \((.+)\)\/(\w)$/);if(m)return m[1]+" = "+sf(m[2],m[3]);
    m=f.match(/^(\w) = (\w+)\/(\w+)$/);if(m)return m[1]+" = "+sf(m[2],m[3]);return f;}
  function qBank(){var e=rnd(BANK);
    return C("Make "+e.s+" the subject.",e.a,e.w,e.y,EQ(bankDisp(e.f),e.f),{t:"rearr",sub:e.s,rv:e.f});}
  /* rearrange, then substitute (the usual exam pair) */
  function qUse(){var k=ri(0,3),f,sub,ans,vals,sl,why;
    if(k===0){var u=ri(0,20),a=ri(2,9),t=ri(2,12),v=u+a*t;f="v = u + at";sub="t";ans=t;vals="v = "+v+", u = "+u+", a = "+a;
      sl=[(v+u)/a,v/a-u,v-u,(v-u)*a];why="t = (v − u)/a = ("+v+" − "+u+") ÷ "+a+" = "+t+".";}
    else if(k===1){var w=ri(2,15),l=ri(3,25),P=2*l+2*w;f="P = 2l + 2w";sub="l";ans=l;vals="P = "+P+", w = "+w;
      sl=[(P+2*w)/2,P/2-2*w,P-w,P-2*w];why="l = (P − 2w)/2 = ("+P+" − "+2*w+") ÷ 2 = "+l+".";}
    else if(k===2){var s=ri(3,15),tt=ri(2,9),d=s*tt;f="s = d/t";sub="t";ans=tt;vals="s = "+s+", d = "+d;
      sl=[s*d,d-s,s];why="t = d/s = "+d+" ÷ "+s+" = "+tt+".";}
    else{var Cc=5*ri(-4,9),F=Math.round(1.8*Cc+32);f="F = 1.8C + 32";sub="C";ans=Cc;vals="F = "+n_(F);
      sl=[Math.round(F/1.8-32),Math.round((F+32)/1.8),Math.round(1.8*(F-32)),F-32];why="C = (F − 32)/1.8 = ("+n_(F)+" − 32) ÷ 1.8 = "+n_(Cc)+".";}
    return QI("Find "+sub+".",ans,sl,why,EQ(bankDisp(f),f,vals),{t:"use",sub:sub,rv:f+"; "+vals});}

  /* ================= FRACTIONS (add / subtract) ================= */
  var DEN=[[2,3],[3,4],[2,5],[3,5],[4,5],[2,4],[4,6],[3,6],[2,6],[6,8],[4,3],[5,2],[6,4]];
  function fracParts(zero){var P=rnd(DEN),c=P[0],f=P[1],a=ri(1,5),d=ri(1,5),b=zero?0:nz(-9,9),e=zero?0:nz(-9,9),s=rnd([1,-1]);return {a:a,b:b,c:c,d:d,e:e,f:f,s:s};}
  function fracText(p){var op=p.s>0?" + ":" "+M+" ";
    var t1=lin(p.a,p.b),t2=lin(p.d,p.e);
    return {plain:bk(t1)+"/"+p.c+op+bk(t2)+"/"+p.f,disp:sf(t1,p.c)+op+sf(t2,p.f)};}
  function qAdd(){for(var t=0;t<200;t++){var p=fracParts(Math.random()<.25),L=lcm(p.c,p.f),m=L/p.c,n=L/p.f;
      var A=m*p.a+p.s*n*p.d,B=m*p.b+p.s*n*p.e;if(A===0)continue;var g=gcd(gcd(A,B),L);if(L/g===1)continue;
      var ans=fr1(A,B,L),key=fkey(A,B,L),cand=[],ks={};ks[key]=1;
      var add=function(A2,B2,L2){if(!L2||A2===0&&B2===0)return;var k=fkey(A2,B2,L2);if(ks[k])return;ks[k]=1;cand.push(fr1(A2,B2,L2));};
      add(p.a+p.s*p.d,p.b+p.s*p.e,p.c+p.f);           /* tops + tops, bottoms + bottoms */
      add(p.a+p.s*p.d,p.b+p.s*p.e,L);                 /* didn't multiply up */
      add(A,p.b+p.s*p.e,L);                           /* multiplied the x terms only */
      if(p.s<0)add(A,m*p.b+n*p.e,L);                  /* sign slip on the last term */
      add(n*p.a+p.s*m*p.d,n*p.b+p.s*m*p.e,L);         /* multipliers swapped */
      add(A,B,L*2);add(A+1,B,L);
      if(cand.length<3)continue;
      var T=fracText(p);
      return C("Write as one fraction.",ans,cand,"Common denominator "+L+": "+(m>1?"× "+m+" on the first, ":"")+(n>1?"× "+n+" on the second. ":"")+"→ "+ans+".",EQ(T.disp,T.plain),{t:"add",rv:T.plain});}}
  function qLCD(){var p=fracParts(false),L=lcm(p.c,p.f),T=fracText(p);
    return QI("Common denominator?",L,[p.c*p.f,p.c+p.f,Math.max(p.c,p.f)],"The smallest number both "+p.c+" and "+p.f+" go into: "+L+".",EQ(T.disp,T.plain),{t:"lcd",rv:T.plain});}
  function qSimp(){var a=ri(2,6),b=nz(-6,7),c=nz(-5,5),top=lin(a*c,a*b),ans=lin(c,b);
    var pool=[lin(c,a*b),lin(a*c,b),lin(c*a*a,b),lin(c,b+1),lin(c,-b)].filter(function(z){return z!==ans;});
    return C("Simplify.",ans,pool,"Divide EVERY term on top by "+a+": "+ans+".",EQ(sf(top,a),bk(top)+"/"+a),{t:"simp",rv:bk(top)+"/"+a});}

  /* ================= DIVIDE (long division) ================= */
  function divWhy(dv,q){return "Check: "+dv+" × ("+q+") gives the top line back.";}
  function qDiv1(){var p=nz(-9,9),q=nz(-9,9),b=p+q,c=p*q,top=ex(1,b,c),dv=lin(1,p),ans=lin(1,q);
    var pool=[lin(1,-q),lin(1,p),lin(1,b),lin(1,c),lin(1,q+1),lin(1,-p),lin(1,q-1),lin(2,q)].filter(function(z){return z!==ans;});
    return C("Divide.",ans,pool,divWhy("("+dv+")",ans)+" ("+ans+")("+dv+") = "+top+".",EQ("("+top+") ÷ ("+dv+")"),{t:"div",rv:"("+top+") ÷ ("+dv+")"});}
  function qDiv2(){var a=ri(2,5),p=nz(-7,7),q=nz(-9,9),top=ex(a,a*p+q,p*q),dv=lin(1,p),ans=lin(a,q);
    var pool=[lin(1,q),lin(a,-q),lin(a,p),lin(a,p*q),lin(a,q+1),lin(1,a*p+q)].filter(function(z){return z!==ans;});
    return C("Divide.",ans,pool,"x² ÷ x gives x, so the answer starts "+a+"x. ("+ans+")("+dv+") = "+top+".",EQ("("+top+") ÷ ("+dv+")"),{t:"div",rv:"("+top+") ÷ ("+dv+")"});}
  function qDiv3(){for(var t=0;t<100;t++){var d=ri(2,3),e=nz(-7,7),f=ri(1,4),g=nz(-8,8);if(gcd(d,e)!==1)continue;
      var B=d*g+e*f;if(B===0)continue;var top=ex(d*f,B,e*g),dv=lin(d,e),ans=lin(f,g);
      var pool=[lin(f,-g),lin(d*f,g),lin(f,e),lin(f,g+1),lin(d,g),lin(f*d,e*g)].filter(function(z){return z!==ans;});
      return C("Divide.",ans,pool,"("+ans+")("+dv+") = "+top+".",EQ("("+top+") ÷ ("+dv+")"),{t:"div",rv:"("+top+") ÷ ("+dv+")"});}}

  /* ================= HIGHER LEVEL ================= */
  function den2(u,v){return "("+lin(1,u)+")("+lin(1,v)+")";}
  function qHLFrac(){for(var t=0;t<200;t++){var p=ri(1,6),q=ri(1,6),u=nz(-6,6),v=nz(-6,6),s=rnd([1,-1]);if(u===v)continue;
      var A=p+s*q,B=p*v+s*q*u;if(A===0&&B===0)continue;var D=den2(u,v);
      var num=function(A2,B2){return A2===0?n_(B2):bk(lin(A2,B2));};
      var ans=num(A,B)+"/("+D+")",ks={};ks[A+"|"+B]=1;var pool=[];
      [[p+s*q,p*u+s*q*v],[A,p*v-s*q*u],[A,p+s*q],[A,B+1],[p-s*q,B]].forEach(function(z){if(z[0]===0&&z[1]===0)return;var k=z[0]+"|"+z[1];if(ks[k])return;ks[k]=1;pool.push(num(z[0],z[1])+"/("+D+")");});
      pool.push(n_(p+s*q)+"/("+lin(2,u+v)+")");
      var op=s>0?" + ":" "+M+" ",plain=p+"/("+lin(1,u)+")"+op+q+"/("+lin(1,v)+")";
      return C("Higher Level: Write as one fraction.",ans,pool,"Common denominator "+D+": "+p+"("+lin(1,v)+")"+op+q+"("+lin(1,u)+") = "+lin(A,B)+" on top.",EQ(sf(p,lin(1,u))+op+sf(q,lin(1,v)),plain),{t:"add",hl:1,rv:plain});}}
  function qCubic(){for(var t=0;t<100;t++){var p=nz(-5,5),q=nz(-6,6),r=nz(-9,9);
      var b=q+p,c=r+p*q,d=p*r;if(Math.abs(d)>60)continue;var top=cub(1,b,c,d),dv=lin(1,p),ans=ex(1,q,r);
      var pool=[ex(1,-q,r),ex(1,q,-r),ex(1,q+p,r),ex(1,r,q),ex(1,q,r+p),ex(1,-q,-r),ex(1,q,r-1)].filter(function(z){return z!==ans;});
      return C("Higher Level: Divide.",ans,pool,"("+ans+")("+dv+") = "+top+".",EQ("("+top+") ÷ ("+dv+")"),{t:"div",hl:1,rv:"("+top+") ÷ ("+dv+")"});}}
  function qCubeDiff(){var k=ri(1,4),s=rnd([1,-1]),top=s>0?"x³ "+M+" "+k*k*k:"x³ + "+k*k*k,dv=lin(1,-s*k),ans=ex(1,s*k,k*k);
    var pool=[ex(1,-s*k,k*k),ex(1,s*k,-k*k),ex(1,0,k*k),ex(1,s*k*k,k)].filter(function(z){return z!==ans;});
    return C("Higher Level: Divide.",ans,pool,"Leave gaps for the missing x² and x terms, then divide: "+ans+". Check: ("+ans+")("+dv+") = "+top+".",EQ("("+top+") ÷ ("+dv+")"),{t:"div",hl:1,rv:"("+top+") ÷ ("+dv+")"});}
  var HLBANK=[
    {f:"A = πr²",s:"r",a:"r = √(A/π)",w:["r = A/(2π)","r = √(Aπ)","r = (A/π)²","r = √A/π"],y:"Divide by π, then take the square root."},
    {f:"E = ½mv²",s:"v",a:"v = √(2E/m)",w:["v = √(E/(2m))","v = 2E/m","v = √(2Em)","v = (2E/m)²"],y:"Multiply by 2, divide by m, then take the square root."},
    {f:"V = πr²h",s:"r",a:"r = √(V/(πh))",w:["r = V/(πh)","r = √(Vπh)","r = √V/(πh)","r = V/(2πh)"],y:"Divide by πh, then take the square root."},
    {f:"V = πr²h",s:"h",a:"h = V/(πr²)",w:["h = Vπr²","h = πr²/V","h = V − πr²"],y:"Divide both sides by πr²."},
    {f:"a = (v − u)/t",s:"t",a:"t = (v − u)/a",w:["t = a(v − u)","t = (v + u)/a","t = a/(v − u)"],y:"Multiply by t: at = v − u. Then divide by a."},
    {f:"s = ut + ½at²",s:"a",a:"a = 2(s − ut)/t²",w:["a = (s − ut)/(2t²)","a = 2(s + ut)/t²","a = 2s/t² − ut","a = 2(s − ut)/t"],y:"Subtract ut, multiply by 2, then divide by t²."},
    {f:"1/f = 1/u + 1/v",s:"f",a:"f = uv/(u + v)",w:["f = u + v","f = (u + v)/(uv)","f = uv/(u − v)"],y:"Add the right side: 1/f = (v + u)/(uv). Turn both sides upside down."},
    {f:"T = 2π√(l/g)",s:"l",a:"l = gT²/(4π²)",w:["l = gT²/(2π)","l = T²/(4π²g)","l = 4π²g/T²","l = gT/(2π)"],y:"Divide by 2π, square both sides, then multiply by g."},
    {f:"h = √(a² + b²)",s:"a",a:"a = √(h² − b²)",w:["a = h − b","a = √(h − b)","a = h² − b²","a = √(h² + b²)"],y:"Square both sides: h² = a² + b². Subtract b², then take the square root."}
  ];
  function hlDisp(f){var m=f.match(/^(\w) = \((.+)\)\/(\w)$/);if(m)return m[1]+" = "+sf(m[2],m[3]);
    if(f==="1/f = 1/u + 1/v")return sf(1,"f")+" = "+sf(1,"u")+" + "+sf(1,"v");return f;}
  function qHLRe(){var e=rnd(HLBANK);
    return C("Higher Level: Make "+e.s+" the subject.",e.a,e.w,e.y,EQ(hlDisp(e.f),e.f),{t:"rearr",sub:e.s,hl:1,rv:e.f});}
  /* the subject appears twice */
  function qTwice(){var p,q;do{p=nz(-6,6);q=nz(-6,6);}while(p===q);
    var top=lin(1,p),bot=lin(1,q),plain="y = ("+top+")/("+bot+")";
    var num=function(c0,cy){return bk(cy>0&&c0<0?lin(cy,c0,"y"):n_(c0)+tm(cy,"y",false));};
    var ans="x = "+num(p,-q)+"/(y "+M+" 1)";
    var pool=["x = "+num(p,-q)+"/(y + 1)","x = "+num(p,-q)+"/y"];[[p,q],[-p,-q],[-p,q]].forEach(function(z){if(z[0]!==-z[1]&&!(z[0]===p&&z[1]===-q))pool.push("x = "+num(z[0],z[1])+"/(y "+M+" 1)");});
    return C("Higher Level: Make x the subject.",ans,pool,"y("+bot+") = "+top+" → xy"+tm(q,"y",false)+" = "+top+" → xy "+M+" x = "+n_(p)+tm(-q,"y",false)+" → x(y "+M+" 1) = "+n_(p)+tm(-q,"y",false)+".",EQ("y = "+sf(top,bot),plain),{t:"rearr",sub:"x",hl:1,rv:plain});}

  /* ================= SPOT THE SLIP ================= */
  function stepsHTML(L){return '<div class="steps">'+L.map(function(z,i){return '<p data-line="'+(i+1)+'" data-s="'+esc(z)+'"><b>Line '+(i+1)+':</b> <span class="nw">'+z+'</span></p>';}).join("")+'</div>';}
  function slipQ(start,startPlain,L,bad,fix,data,sub){var ans=bad===0?"No mistake":"Line "+bad;
    return C((sub?"Make "+sub+" the subject. ":"")+"Which line has the first mistake?",ans,["Line 1","Line 2","Line 3","No mistake"].filter(function(z){return z!==ans;}),fix,EQ(start,startPlain)+stepsHTML(L),data);}
  function qSlipFrac(){for(var t=0;t<300;t++){var P=rnd([[2,3],[3,4],[2,5],[3,5],[4,5],[3,2],[4,3],[5,2]]),c=P[0],f=P[1],a=ri(1,4),d=ri(1,4),b=nz(-7,7),e=nz(-7,7),s=rnd([1,-1]),bad=ri(0,3);
      var Lc=c*f,m=f,n=c;var op=s>0?" + ":" "+M+" ";
      var m1=bad===1?n:m,n1=bad===1?m:n;
      var l1="("+m1+"("+lin(a,b)+")"+op+n1+"("+lin(d,e)+"))/"+Lc;
      var x1=m1*a,c1=m1*b,x2=s*n1*d,c2=s*n1*e;if(bad===2)c2=s>0?e:-c2;   /* forgot to multiply / sign of the last term */
      var l2="("+lin(x1,c1)+tm(x2,"x",false)+tm(c2,"",false)+")/"+Lc;
      var A=x1+x2,B=c1+c2;if(bad===3)B+=rnd([-2,2]);if(A===0)continue;
      var l3=fr1(A,B,Lc);
      var TA=m*a+s*n*d,TB=m*b+s*n*e;if(bad>0&&fkey(A,B,Lc)===fkey(TA,TB,Lc))continue;if(TA===0)continue;
      var p={a:a,b:b,c:c,d:d,e:e,f:f,s:s},T=fracText(p);
      var fix=bad===0?"Every line is right.":bad===1?"Line 1: the first top is multiplied by "+m+" (what "+c+" needs to make "+Lc+").":bad===2?(s>0?"Line 2: "+n+" multiplies BOTH terms in the bracket.":"Line 2: "+M+n+" × "+(e<0?"("+n_(e)+")":e)+" = "+n_(-n*e)+". The minus sign multiplies the whole bracket."):"Line 3: the numbers on top were added wrongly.";
      return slipQ(T.disp,T.plain,[l1,l2,l3],bad,fix,{t:"slipexpr",rv:T.plain+" ("+[l1,l2,l3].join("; ")+")"});}}
  function qSlipRe(){for(var t=0;t<300;t++){var a=ri(2,6),c=ri(2,5),b=nz(-9,9),bad=ri(0,3);if(a===c)continue;
      var start="y = ("+lin(a,b)+")/"+c,L;
      if(bad===1)L=["y"+tm(-b,"",false)+" = "+a+"x/"+c,c+"(y"+tm(-b,"",false)+") = "+a+"x","x = "+c+"(y"+tm(-b,"",false)+")/"+a];
      else if(bad===2)L=[c+"y = "+lin(a,b),c+"y"+tm(b,"",false)+" = "+a+"x","x = ("+c+"y"+tm(b,"",false)+")/"+a];
      else if(bad===3)L=[c+"y = "+lin(a,b),c+"y"+tm(-b,"",false)+" = "+a+"x","x = "+c+"y/"+a+tm(-b,"",false)];
      else L=[c+"y = "+lin(a,b),c+"y"+tm(-b,"",false)+" = "+a+"x","x = ("+c+"y"+tm(-b,"",false)+")/"+a];
      var fix=bad===0?"Every line is right.":bad===1?"Line 1: multiply by "+c+" first. "+n_(b)+" is divided by "+c+" too, so you can't move it yet.":bad===2?"Line 2: "+tm(b,"",true)+" changes sign when it moves across.":"Line 3: divide ALL of "+c+"y"+tm(-b,"",false)+" by "+a+".";
      return slipQ("y = "+sf(lin(a,b),c),start,L,bad,fix,{t:"slipeq",sub:"x",rv:start+" ("+L.join("; ")+")"},"x");}}
  function qSlipLet(){var k=ri(0,1),bad=ri(0,3),f=k?"s = (u + v)t/2":"A = (a + b)h/2",S=k?"s":"A",x=k?"v":"a",o=k?"u":"b",h=k?"t":"h",L;
    if(bad===1)L=[S+"/2 = ("+o+" + "+x+")"+h,S+"/(2"+h+") = "+o+" + "+x,x+" = "+S+"/(2"+h+") "+M+" "+o];
    else if(bad===2)L=["2"+S+" = ("+o+" + "+x+")"+h,"2"+S+" "+M+" "+h+" = "+o+" + "+x,x+" = 2"+S+" "+M+" "+h+" "+M+" "+o];
    else if(bad===3)L=["2"+S+" = ("+o+" + "+x+")"+h,"2"+S+"/"+h+" = "+o+" + "+x,x+" = 2"+S+"/"+h+" + "+o];
    else L=["2"+S+" = ("+o+" + "+x+")"+h,"2"+S+"/"+h+" = "+o+" + "+x,x+" = 2"+S+"/"+h+" "+M+" "+o];
    var fix=bad===0?"Every line is right: "+x+" = 2"+S+"/"+h+" "+M+" "+o+".":bad===1?"Line 1: to undo ÷ 2, MULTIPLY by 2: 2"+S+".":bad===2?"Line 2: to undo × "+h+", DIVIDE by "+h+".":"Line 3: "+o+" moves across, so it becomes "+M+o+".";
    var disp=S+" = "+sf("("+o+" + "+x+")"+h,2);
    return slipQ(disp,f,L,bad,fix,{t:"slipeq",sub:x,rv:f+" ("+L.join("; ")+")"},x);}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    rearr:[qLin,qLin,qBank,qBank,qBank,qUse],
    frac:[qAdd,qAdd,qAdd,qLCD,qSimp],
    divide:[qDiv1,qDiv1,qDiv2,qDiv3],
    hl:[qHLFrac,qHLFrac,qCubic,qCubeDiff,qHLRe,qHLRe,qTwice],
    slip:[qSlipFrac,qSlipRe,qSlipLet],
    mixed:[]
  };
  ["rearr","frac","divide","hl","slip"].forEach(function(m){MAKERS[m].forEach(function(f){if(MAKERS.mixed.indexOf(f)<0)MAKERS.mixed.push(f);});});

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="rearr"?75:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>14;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="rearr"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="rearr"&&streak%5===0?700:350):3600);
  }
  function esc2(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready speed.":score>=11?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc2(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc2(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc2(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{lin:lin,fr1:fr1,ex:ex,cub:cub,sf:sf}};
})();
</script>
