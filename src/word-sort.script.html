  var NAME={n:"Noun",v:"Verb",adj:"Adjective",adv:"Adverb",pron:"Pronoun",prep:"Preposition",conj:"Conjunction"};
  var ICON={n:"📦",v:"🏃",adj:"🎨",adv:"⏱️",pron:"👤",prep:"📍",conj:"🔗"};
  var JOB={n:"names a person, place, thing or idea",v:"is an action or a state (doing or being)",adj:"describes a noun",adv:"tells you how, when, where or how often",
    pron:"stands in for a noun (I, she, they, it …)",prep:"shows where or when: under, after, to …",conj:"joins words or ideas: and, but, because …"};
  var BIG4=["n","v","adj","adv"],GLUE=["pron","prep","conj"];
  /* parse "{word|tag}" sentences into tokens */
  var SENT=D.sent.map(function(s){var out=[],re=/\{([^|}]+)\|([^}]+)\}|([^{]+)/g,m;
    while((m=re.exec(s))){if(m[1])out.push({w:m[1],t:m[2]});else out.push({w:m[3]});}return out;});
  function sentHTML(tok,k,cls){return '<p class="ws-s">'+tok.map(function(x,i){
    return i===k?'<mark class="'+(cls||"hl")+'">'+esc(x.w)+'</mark>':esc(x.w);}).join("")+'</p>';}
  function tagged(tok,set){var r=[];tok.forEach(function(x,i){if(x.t&&set.indexOf(x.t)>=0)r.push(i);});return r;}
  /* a choice question */
  function C(en,ans,pool,why,html,data){var seen={},w=[];seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  function lab(t){return ICON[t]+" "+NAME[t];}
  function plain(tok){return tok.map(function(x){return x.w;}).join("");}

  /* ================= WORD SORT: noun, verb, adjective, adverb ================= */
  function qSort(){var s,ix;do{s=rnd(SENT);ix=tagged(s,BIG4);}while(!ix.length);var k=rnd(ix),t=s[k].t;
    return C("Which word class?",lab(t),BIG4.filter(function(x){return x!==t;}).map(lab),
      "“"+s[k].w+"” "+JOB[t]+", so it's "+(t==="adj"||t==="adv"?"an ":"a ")+NAME[t].toLowerCase()+".",
      sentHTML(s,k),{t:"sort",cls:t,word:s[k].w,sent:plain(s),rv:s[k].w+" in “"+plain(s).trim()+"”"});}
  /* ================= FIND IT: tap the word ================= */
  function qFind(set){return function(){var s,ix,t,ans,others;
    do{s=rnd(SENT);ix=tagged(s,set);t=ix.length?s[rnd(ix)].t:null;
      ans=ix.filter(function(i){return s[i].t===t;});
      others=tagged(s,BIG4.concat(GLUE)).filter(function(i){return s[i].t!==t;});
    }while(!t||ans.length!==1||others.length<3);
    var k=ans[0],pool=others.map(function(i){return s[i].w;}).filter(function(w){return w.toLowerCase()!==s[k].w.toLowerCase();});
    return C(ICON[t]+" Tap the "+NAME[t].toLowerCase(),s[k].w,pool,"“"+s[k].w+"” "+JOB[t]+".",sentHTML(s,-1),
      {t:"find",cls:t,word:s[k].w,sent:plain(s),rv:"the "+NAME[t].toLowerCase()+" in “"+plain(s).trim()+"”"});};}
  /* ================= GLUE WORDS: pronoun, preposition, conjunction ================= */
  function qGlue(){var s,ix;do{s=rnd(SENT);ix=tagged(s,GLUE);}while(!ix.length);var k=rnd(ix),t=s[k].t;
    var pool=GLUE.filter(function(x){return x!==t;}).map(lab);pool.push(lab(rnd(BIG4)));
    return C("Which word class?",lab(t),pool,"“"+s[k].w+"” "+JOB[t]+", so it's a "+NAME[t].toLowerCase()+".",
      sentHTML(s,k),{t:"glue",cls:t,word:s[k].w,sent:plain(s),rv:s[k].w+" in “"+plain(s).trim()+"”"});}
  /* ================= STRONGER WORDS ================= */
  function qStrong(){var it=rnd(D.strong),s=it[0],weak=s.match(/\{([^}]+)\}/)[1];
    var html='<p class="ws-s">'+esc(s.slice(0,s.indexOf("{")))+'<mark class="weak">'+esc(weak)+'</mark>'+esc(s.slice(s.indexOf("}")+1))+'</p>';
    return C("💪 Pick a stronger word",it[1],it[2],it[3],html,{t:"strong",word:weak,sent:s.replace(/[{}]/g,""),rv:weak+" → "+it[1]+" ("+s.replace(/[{}]/g,"")+")"});}
  /* ================= WORD SWITCH: same word, different job ================= */
  function qSwitch(){var it=rnd(D["switch"]),s=it[0],w=s.match(/\{([^}]+)\}/)[1];
    var html='<p class="ws-s">'+esc(s.slice(0,s.indexOf("{")))+'<mark class="hl">'+esc(w)+'</mark>'+esc(s.slice(s.indexOf("}")+1))+'</p>';
    return C("Which job here?",lab(it[1]),BIG4.filter(function(x){return x!==it[1];}).map(lab),it[3],html,
      {t:"switch",cls:it[1],word:w,sent:s.replace(/[{}]/g,""),rv:w+" in “"+s.replace(/[{}]/g,"")+"”"});}

  /* ---------- makers by mode ---------- */
  var qFind4=qFind(BIG4),qFindG=qFind(GLUE);
  var MAKERS={
    sort:[qSort],
    find:[qFind4,qFind4,qFind4,qFindG],
    glue:[qGlue,qGlue,qFindG],
    strong:[qStrong],
    "switch":[qSwitch],
    mixed:[qSort,qSort,qFind4,qGlue,qFindG,qStrong,qSwitch]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="sort"?60:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>14;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=Object.keys(NAME).map(lab);
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* word-class buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="sort"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="sort"&&streak%5===0?700:350):3000);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=22?"Brilliant! That's exam-ready speed.":score>=14?"Great work!":score>=6?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{SENT:SENT,D:D}};
