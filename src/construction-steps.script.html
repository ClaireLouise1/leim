  function nScale(){var d;do{d=ri(20,160);}while(Math.abs(d-90)<6);return QU("Ella wants an angle of "+d+"° but reads the wrong scale on the protractor. What angle does she draw?","",180-d,"°",[d,90-d>0?90-d:d+90,360-d],"The two scales add to 180°: reading the wrong one gives 180° − "+d+"° = "+(180-d)+"°.","",{t:"scale",d:d});}
  function nHyp(){var s=ri(4,7),h=s+ri(2,4);return QU("You construct a right-angled triangle with a side of "+s+" cm and a hypotenuse of "+h+" cm. After drawing the "+s+" cm side and the right angle, what do you set the compass to for the arc from B?","",h,"cm",[s,h-s,h+s,h/2],"The arc from B is the hypotenuse, so set the compass to "+h+" cm.","",{t:"hyp",s:s,h:h});}
  function nRect(){var w=ri(5,10),h=ri(2,6);if(h===w)h=w-1;return QU("You construct the rectangle ABCD with |AB| = "+w+" cm and |BC| = "+h+" cm. What is its perimeter?","",2*(w+h),"cm",[w+h,w*h,2*w+h],"Perimeter = "+w+" + "+h+" + "+w+" + "+h+" = "+(2*(w+h))+" cm.","",{t:"rect",w:w,h:h});}
  function nPerp(){return QU("You construct a line perpendicular to l. What angle does it make with l?","",90,"°",[180,45,60],"Perpendicular lines meet at 90°.","",{t:"perp"});}

  var MAKERS={
    steps:[qStep],
    name:[qName,qName,qName,qDesc,qDesc],
    tools:[qTool,qTool,qTool,qTool,qCan,qNotThird],
    numbers:[nBisect,nBisectBack,nHalf,nEqui,nParts,nMarks,nWidth,nThird,nScale,nHyp,nRect,nPerp],
    mixed:[qStep,qStep,qStep,qName,qDesc,qTool,qTool,qCan,qNotThird,nBisect,nBisectBack,nHalf,nEqui,nParts,nWidth,nThird,nScale,nHyp]
  };

  /* ---------- step viewer (rules section) ---------- */
  var $=function(id){return document.getElementById(id);};
  var vcon=null,vj=0;
  function vshow(){if(!$("vsvg"))return;var n=vcon.steps.length;
    $("vsvg").innerHTML=draw(vcon,vj,[340,250]);
    $("vtxt").innerHTML=vj===0?"<b>Start.</b> "+vcon.start+" <i>"+vcon.title+"</i>":"<b>Step "+vj+" of "+n+".</b> "+vcon.steps[vj-1].tx;
    $("vprev").disabled=vj===0;$("vnext").textContent=vj===n?"Start again ↺":"Next step →";}
  function vload(){var k=+$("vsel").value;vcon=withSeed(1400+k,function(){return BUILD[k]();});vj=0;vshow();}
  if($("vsel")&&$("vsel").tagName==="SELECT"){
    $("vsel").innerHTML=Object.keys(NAMES).map(function(k){return '<option value="'+k+'">'+k+". "+NAMES[k]+(HL[k]?" (HL only)":"")+'</option>';}).join("");
    $("vsel").onchange=vload;$("vprev").onclick=function(){if(vj>0){vj--;vshow();}};
    $("vnext").onclick=function(){vj=vj===vcon.steps.length?0:vj+1;vshow();};vload();}

  /* ---------- Game loop ---------- */
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=(m==="steps")?90:75;score=0;streak=0;best=0;left=DUR;mistakes=[];asked=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){pick(b,t);};box.appendChild(b);
    });
  }
  function pick(btn,t){
    if(locked||left<=0)return;locked=true;asked++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="steps"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="steps"&&streak%5===0?700:450):3800);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! You know your constructions.":score>=12?"Great work!":score>=6?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why&&m.why!==m.review&&m.why.indexOf(m.review)<0?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  if($("again")&&$("again").tagName){$("again").onclick=function(){start(mode);};$("menu").onclick=function(){show("start");};}
  document.addEventListener("keydown",function(e){
    if(!$("play")||$("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,BUILD:BUILD,NAMES:NAMES,HL:HL,draw:draw,render:render,upto:upto,withSeed:withSeed,
    el:{S:S,A:A,AR:AR,N:N,M:M,RT:RT,LEN:LEN,W:W,PRO:PRO,DOT:DOT,FILL:FILL,pt:pt,cc:cc,dist:dist,ang:ang,U:U}};
})();
</script>
