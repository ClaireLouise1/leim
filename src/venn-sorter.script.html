<script>

  var LIST=[["factors of {n}",[12,18,20,24,28,30,36]],["prime numbers less than {n}",[10,12,15,20,24]],["multiples of {k} less than {n}",[20,25,30]],["square numbers less than {n}",[30,40,50,70]]];

  var TOP2=[["Tea","Coffee","drink tea","drink coffee"],["Gaelic","Soccer","play Gaelic","play soccer"],["TikTok","YouTube","use TikTok","use YouTube"],["Dog","Cat","have a dog","have a cat"],["French","German","study French","study German"]];
  function qRead2(){
    var t=rnd(TOP2),v={1:ri(3,19),3:ri(2,12),2:ri(3,19),0:ri(1,9)},A=v[1]+v[3],B=v[2]+v[3],T=v[0]+v[1]+v[2]+v[3];
    var qs=[["How many "+t[2]+" only?",v[1],[A,v[3],v[2]],"\"Only\" means the part of the circle outside the overlap: "+v[1]+".","onlyA"],
      ["How many "+t[2]+"? (#A)",A,[v[1],A+v[2],v[3]],"Everything inside circle A, overlap included: "+v[1]+" + "+v[3]+" = "+A+".","A"],
      ["How many "+t[2]+" or "+t[3].replace(/^(drink|play|use|have a|study) /,"")+"? #(A ∪ B)",A+v[2],[A+B,T,v[1]+v[2]],"Add every region inside the circles, the overlap once: "+v[1]+" + "+v[3]+" + "+v[2]+" = "+(A+v[2])+".","union"],
      ["How many do neither?",v[0],[T-A,T-B,v[3]],"Neither = outside both circles: "+v[0]+".","none"],
      ["How many do exactly one of the two?",v[1]+v[2],[A+B,v[1]+v[2]+v[3],v[3]],"Exactly one = A only + B only: "+v[1]+" + "+v[2]+" = "+(v[1]+v[2])+".","one"],
      ["How many people were asked in total?",T,[T-v[0],A+B+v[0],A+B],"Add all four regions, including outside: "+v[1]+" + "+v[3]+" + "+v[2]+" + "+v[0]+" = "+T+".","total"],
      ["How many "+t[3]+" but not "+t[2].replace(/^(drink|play|use|have a|study) /,"")+"? #(B \\ A)",v[2],[B,v[1],v[3]],"B \\ A = inside B, outside A: "+v[2]+".","BnotA"]];
    var q=rnd(qs);
    return Q("A = "+t[0]+", B = "+t[1]+". "+q[0],"",q[1],q[2],q[3],countSVG(2,v,[t[0],t[1]]),{t:"read2",q:q[4]});
  }
  function qX(){
    var T=ri(24,36),x=ri(2,9),a=ri(x+3,20),b=ri(x+3,18),nn=T-(a+b-x);
    if(nn<2||nn>12)return qX();
    var t=rnd(TOP2),vals={1:a+"-x",3:"x",2:b+"-x",0:nn};
    return Q("There are "+T+" students in a class. "+a+" "+t[2]+", "+b+" "+t[3]+" and "+nn+" do neither. x students do both. Find x.","",x,[a+b-T,T-nn,a+b+nn-T+nn,T-a-b+nn,x+nn],"Add the four regions and set equal to "+T+": ("+a+" − x) + x + ("+b+" − x) + "+nn+" = "+T+", so "+(a+b+nn)+" − x = "+T+" and x = "+x+".",countSVG(2,vals,[t[0],t[1]]),{t:"x",T:T,a:a,b:b,n:nn});
  }
  function qWord(){
    var t=rnd(TOP2),both=ri(2,9),a=ri(both+2,20),b=ri(both+2,18),nn=ri(2,8),T=a+b-both+nn,flip=Math.random()<.4;
    if(flip)return Q("In a survey of "+T+" people, "+a+" "+t[2]+" and "+b+" "+t[3]+". "+nn+" do neither. How many do both?","",both,[a+b-T,T-nn,a+b-T+nn+nn],"Inside the circles: "+T+" − "+nn+" = "+(T-nn)+". "+a+" + "+b+" = "+(a+b)+" counts the overlap twice, so both = "+(a+b)+" − "+(T-nn)+" = "+both+".","",{t:"word",T:T,a:a,b:b,n:nn,ask:"both"});
    return Q("In a class of "+T+", "+a+" "+t[2]+", "+b+" "+t[3]+" and "+both+" do both. How many do neither?","",nn,[T-a-b+both+both,T-(a-both)-(b-both),T-a,T-b],"#(A ∪ B) = "+a+" + "+b+" − "+both+" = "+(a+b-both)+" (take away the overlap so it isn't counted twice). Neither = "+T+" − "+(a+b-both)+" = "+nn+".","",{t:"word",T:T,a:a,b:b,both:both,ask:"none"});
  }
  var TOP3=[["Bus","Car","Walk"],["Maths","Art","PE"],["Netflix","Disney+","Prime"],["Pizza","Curry","Tacos"]];
  function qRead3(){
    var t=rnd(TOP3),v={};[0,1,2,3,4,5,6,7].forEach(function(g){v[g]=ri(g===7?1:2,g===0?9:14);});
    function S(f){var s=0;for(var g=0;g<8;g++)if(f(g))s+=v[g];return s;}
    function bits(g){return (g&1)+(g>>1&1)+(g>>2&1);}
    var qs=[["How many chose "+t[2]+" only?",v[4],[S(function(g){return g&4;}),v[7],v[5]+v[6]],"\"Only\" = inside C and outside A and B: "+v[4]+".","onlyC"],
      ["How many chose exactly two?",S(function(g){return bits(g)===2;}),[S(function(g){return bits(g)>=2;}),v[3],S(function(g){return bits(g)===1;})],"Exactly two = the three \"only\" overlaps, NOT the centre: "+v[3]+" + "+v[5]+" + "+v[6]+".","two"],
      ["How many chose at least two?",S(function(g){return bits(g)>=2;}),[S(function(g){return bits(g)===2;}),v[7],S(function(g){return bits(g)>=1;})],"At least two = the three overlaps AND the centre: "+v[3]+" + "+v[5]+" + "+v[6]+" + "+v[7]+".","atleast2"],
      ["How many chose "+t[0]+" and "+t[1]+" but not "+t[2]+"?",v[3],[v[3]+v[7],v[7],v[1]+v[2]],"In A and B, outside C: just the A–B overlap region: "+v[3]+".","ABnotC"],
      ["How many chose "+t[1]+"? (#B)",S(function(g){return g&2;}),[v[2],S(function(g){return g&2;})-v[7],v[2]+v[3]+v[6]+v[7]+v[0]],"Add all four regions inside B: "+v[2]+" + "+v[3]+" + "+v[6]+" + "+v[7]+".","B"],
      ["How many chose none of the three?",v[0],[v[4],S(function(g){return g;})-v[7],v[7]],"None = outside all three circles: "+v[0]+".","none"]];
    var q=rnd(qs);
    return Q("A = "+t[0]+", B = "+t[1]+", C = "+t[2]+". "+q[0],"",q[1],q[2],q[3],countSVG(3,v,[t[0],t[1],t[2]]),{t:"read3",q:q[4]});
  }

  var MAKERS={
    sort:[qSort2,qSort2,qSort2,qSort3,qSort3],
    lang:[qOp,qOp,qComp,qState,qState,qList],
    shade:[qShade,qShade,qShade,qWhere,qLaw],
    survey:[qRead2,qRead2,qX,qWord,qWord,qRead3],
    mixed:[qSort2,qSort3,qOp,qComp,qState,qList,qShade,qShade,qWhere,qLaw,qRead2,qX,qWord,qRead3]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked,last="",LEN=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;LEN=(m==="sort")?60:75;score=0;streak=0;best=0;left=LEN;mistakes=[];asked=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=LEN+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/LEN*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){pick(b,t);};box.appendChild(b);
    });
  }
  function pick(btn,t){
    if(locked||left<=0)return;locked=true;asked++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="sort"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="sort"&&streak%5===0?700:350):2600);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! That's exam-ready speed.":score>=14?"Great work!":score>=7?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS};
})();
</script>
