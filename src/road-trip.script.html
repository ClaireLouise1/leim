<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t;}return a;}
  function isNice(x,dp){var k=Math.pow(10,dp==null?1:dp);return Math.abs(x*k-Math.round(x*k))<1e-7;}
  function commas(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,",");}
  /* numbers: up to dp decimal places, trailing zeros dropped, thousands commas */
  function num(x,dp){dp=dp==null?2:dp;var k=Math.pow(10,dp),y=Math.round(x*k)/k,s=String(y),p=s.split(".");return commas(p[0])+(p[1]?"."+p[1]:"");}
  function kmh(x){return num(x,1)+" km/h";}
  function km(x){return num(x,1)+" km";}
  function ms(x){return num(x,2)+" m/s";}
  function hrs(x){return num(x,3)+" hours";}
  function hm(t){t=Math.round(t);var h=Math.floor(t/60),m=t%60;return h&&m?h+" h "+m+" min":h?h+" h":m+" min";}
  function clk(t){t=((Math.round(t)%1440)+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}
  function hrsDec(t){return num(t/60,3);}   // minutes → "2.5"
  /* money in whole cents; CUR = [symbol, name, smallest unit] */
  var CUR={GBP:["£","sterling","penny"],USD:["$","US dollars","cent"],CHF:["CHF ","Swiss francs","cent"],EUR:["€","euro","cent"]};
  function mon(code,c){c=Math.round(c);var s=CUR[code][0];return s+commas(String(Math.floor(c/100)))+"."+String(c%100).padStart(2,"0");}
  function r2(v){var s=num(v,3);return /\.\d\d/.test(s)?s:v.toFixed(2);}   // 1.1 → "1.10", 0.865 → "0.865"
  function rate(R){return r2(R/1000);}
  function hu(a,b){return Math.floor((2*a+b)/(2*b));}     // a ÷ b rounded half up (a, b > 0 integers)
  /* numeric question: ans and slips are VALUES; f formats them. Wrong options never equal the answer, never ≤ 0, no duplicates */
  function Q(en,frame,ans,slips,f,why,html,data){var A=f(ans),seen={},out=[];seen[A]=1;
    slips.forEach(function(x){if(x==null||!isFinite(x)||x<=0)return;var s=f(x);if(/NaN|undefined|Infinity/.test(s)||seen[s])return;if(out.length<3){seen[s]=1;out.push(s);}});
    return {en:en,frame:frame,html:html||"",answer:A,wrong:out,why:why,review:(frame?en+" "+frame:en)+" → "+A,data:data||{}};}
  /* choice question: pool must hold only definitely-wrong options */
  function C(en,frame,ans,pool,why,review,html,data){
    var seen={},w=[];seen[ans]=1;shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(/NaN|undefined/.test(x))return;if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:review||((frame?en+" "+frame:en)+" → "+ans),data:data||{}};}

  var NAMES=["Siobhán","Darragh","Niamh","Oisín","Aoife","Cian","Róisín","Eoin","Ciara","Seán","Méabh","Tadhg"];
  var MOVERS=[["A bus","bus"],["A train","train"],["A lorry","lorry"],["A car","car"],["A coach","coach"],["A van","van"]];
  /* a journey: t minutes, speed s km/h, distance D = s × t / 60 (whole km) */
  var TIMES=[30,40,45,50,60,75,80,90,100,105,120,135,140,150,165,180,195,200,210,225,240,270];
  function trip(lo,hi){for(var k=0;k<200;k++){var t=rnd(TIMES),st=60/gcd(t,60),s=st*ri(Math.ceil((lo||30)/st),Math.floor((hi||120)/st));if(s<(lo||30)||s>(hi||120))continue;return {t:t,s:s,D:s*t/60};}return {t:90,s:60,D:90};}
  function misread(t){var h=Math.floor(t/60),f=Math.round((t/60-h)*1000)/10;return isNice(f,0)&&f<60&&f>0?h*60+f:null;}  // 2.25 h read as 2 h 25 min

  /* ---------- Road Trip: speed, distance, time ---------- */
  function qSpeed(){
    var j=trip(),mv=rnd(MOVERS),h=Math.floor(j.t/60),m=j.t%60;
    return Q(mv[0]+" travels "+km(j.D)+" in "+hm(j.t)+". What is its average speed?","",j.s,
      [m?j.D/(h+m/100):null,j.D/j.t,j.D*j.t/60,h?j.D/h:null,j.s+10,j.s-10,j.s*2,j.s+5],kmh,
      "Speed = distance ÷ time. "+hm(j.t)+" = "+hrsDec(j.t)+" hours, so "+num(j.D)+" ÷ "+hrsDec(j.t)+" = "+kmh(j.s)+".","",{t:"speed"});
  }
  function qDist(){
    var j=trip(),mv=rnd(MOVERS),h=Math.floor(j.t/60),m=j.t%60;
    return Q(mv[0]+" travels for "+hm(j.t)+" at an average speed of "+kmh(j.s)+". How far does it go?","",j.D,
      [m?j.s*(h+m/100):null,j.s*j.t,j.s/(j.t/60),h?j.s*h:null,j.D+10,j.D-10,j.D+j.s/2,j.D*2],km,
      "Distance = speed × time = "+num(j.s)+" × "+hrsDec(j.t)+" hours = "+km(j.D)+".","",{t:"dist"});
  }
  function qTime(){
    var j=trip(),mv=rnd(MOVERS);
    return Q("How long does it take to travel "+km(j.D)+" at an average speed of "+kmh(j.s)+"?","",j.t,
      [misread(j.t),j.t+15,j.t-15,j.t+60,j.t-30,j.t+10],hm,
      "Time = distance ÷ speed = "+num(j.D)+" ÷ "+num(j.s)+" = "+hrsDec(j.t)+" hours = "+hm(j.t)+(misread(j.t)?". ("+hrsDec(j.t)+" hours is NOT "+hm(misread(j.t))+": × 60 to get minutes.)":"."),"",{t:"time"});
  }
  function qDecH(){
    if(Math.random()<.5){
      var h=ri(0,3),m=rnd([6,12,15,18,24,30,36,42,45,48,54]),t=h*60+m;
      return Q("Write "+hm(t)+" in hours, as a decimal.","",t/60,[h+m/100,h+m/10,t/100,h+m/60+0.1,t/60+1],hrs,
        m+" min = "+m+" ÷ 60 = "+num(m/60,3)+" of an hour, so "+hm(t)+" = "+hrs(t/60)+".","",{t:"tohrs"});
    }
    var h2=ri(0,3),m2=rnd([6,9,12,15,18,21,24,27,33,36,39,42,45,48,51,54,57]),t2=h2*60+m2,d=hrsDec(t2),bad=misread(t2);
    if(h2===0&&!bad)return qDecH();
    return Q("A journey takes "+d+" hours. How long is that in hours and minutes?","",t2,
      [bad,t2+10,t2-6,Math.round(t2/60*100),t2+60],hm,
      "Only the decimal part is × 60: 0."+d.split(".")[1]+" × 60 = "+m2+" min, so "+d+" hours = "+hm(t2)+".","",{t:"tohm"});
  }
  function qArrive(){
    var j=trip(40,110),dep=ri(6*12,15*12)*5,arr=dep+j.t,who=rnd(NAMES),bad=misread(j.t);
    return Q(who+" leaves at "+clk(dep)+" and drives "+km(j.D)+" at an average speed of "+kmh(j.s)+". At what time does "+who+" arrive?","",arr,
      [bad?dep+bad:null,arr+60,arr-60,arr+10,arr-15,arr+30],clk,
      "Time = "+num(j.D)+" ÷ "+num(j.s)+" = "+hrsDec(j.t)+" hours = "+hm(j.t)+". "+clk(dep)+" + "+hm(j.t)+" = "+clk(arr)+".","",{t:"arrive"});
  }
  function qWhichCalc(){
    var kind=rnd(["speed","dist","time"]),j;
    do{j=trip();}while(j.t%15!==0||j.t===60);
    var D=num(j.D),S=num(j.s),T=hrsDec(j.t),en,ans,pool,why;
    if(kind==="speed"){en="A train goes "+km(j.D)+" in "+hm(j.t)+". Which calculation gives its average speed in km/h?";ans=D+" ÷ "+T;
      pool=[D+" × "+T,T+" ÷ "+D,D+" ÷ "+j.t];if(j.t%60)pool.push(D+" ÷ "+Math.floor(j.t/60)+"."+(j.t%60));why="Speed = distance ÷ time, with the time in HOURS ("+hm(j.t)+" = "+T+" hours).";}
    else if(kind==="dist"){en="A car drives for "+hm(j.t)+" at "+kmh(j.s)+". Which calculation gives the distance in km?";ans=S+" × "+T;
      pool=[S+" ÷ "+T,T+" ÷ "+S,S+" × "+j.t];if(j.t%60)pool.push(S+" × "+Math.floor(j.t/60)+"."+(j.t%60));why="Distance = speed × time, with the time in hours ("+T+").";}
    else{en="A coach must travel "+km(j.D)+" at "+kmh(j.s)+". Which calculation gives the time in hours?";ans=D+" ÷ "+S;
      pool=[D+" × "+S,S+" ÷ "+D,D+" − "+S];why="Time = distance ÷ speed.";}
    return C(en,"",ans,pool,why,null,"",{t:"whichcalc",kind:kind,after:true});
  }

  /* ---------- Average speed & units ---------- */
  function qAvg2(){
    for(var k=0;k<300;k++){
      var a=trip(30,110),b=trip(30,110),T=a.t+b.t,D=a.D+b.D,v=D*60/T;
      if(!isNice(v,1)||a.s===b.s||Math.abs(v-(a.s+b.s)/2)<1e-9||T>360)continue;
      var who=rnd(NAMES);
      return Q(who+" drives "+km(a.D)+" in "+hm(a.t)+", then "+km(b.D)+" in "+hm(b.t)+". What is "+who+"'s average speed for the whole journey?","",v,
        [(a.s+b.s)/2,D/(T/100),a.s+b.s,D*60/a.t,v+5,v-5],kmh,
        "Average speed = TOTAL distance ÷ TOTAL time = "+num(D)+" km ÷ "+hm(T)+" ("+hrsDec(T)+" hours) = "+kmh(v)+". (Not the mean of "+num(a.s)+" and "+num(b.s)+".)","",{t:"avg2"});
    }
    return qAvg2();
  }
  function qAvgSpeeds(){
    for(var k=0;k<300;k++){
      var s1=ri(6,24)*5,s2=ri(6,24)*5,h1=rnd([1,1.5,2,2.5,3]),h2=rnd([0.5,1,1.5,2]),D=s1*h1+s2*h2,v=D/(h1+h2);
      if(s1===s2||!isNice(v,1)||!isNice(D,0)||Math.abs(v-(s1+s2)/2)<1e-9)continue;
      return Q("A lorry travels for "+hm(h1*60)+" at "+kmh(s1)+", then for "+hm(h2*60)+" at "+kmh(s2)+". What is its average speed for the whole trip?","",v,
        [(s1+s2)/2,D,s1+s2,v+5,v-5,v+10],kmh,
        "Distances: "+num(s1)+" × "+num(h1)+" = "+num(s1*h1)+" km and "+num(s2)+" × "+num(h2)+" = "+num(s2*h2)+" km. Total "+num(D)+" km in "+num(h1+h2)+" hours: "+num(D)+" ÷ "+num(h1+h2)+" = "+kmh(v)+".","",{t:"avgspeeds"});
    }
    return qAvgSpeeds();
  }
  function qStop(){
    for(var k=0;k<300;k++){
      var a=trip(40,110),b=trip(40,110),p=rnd([10,15,20,25,30,40,45]),D=a.D+b.D,T=a.t+b.t+p,v=D*60/T,v2=D*60/(a.t+b.t);
      if(!isNice(v,1)||T>420)continue;
      var who=rnd(NAMES);
      return Q(who+" drives "+km(a.D)+" in "+hm(a.t)+", stops for "+p+" minutes, then drives "+km(b.D)+" in "+hm(b.t)+". What is the average speed for the whole journey, including the stop?","",v,
        [v2,(a.s+b.s)/2,D*60/(a.t+b.t+p/100*60),v+5,v-5],kmh,
        "Total time includes the stop: "+hm(a.t)+" + "+p+" min + "+hm(b.t)+" = "+hm(T)+" = "+hrsDec(T)+" hours. "+num(D)+" ÷ "+hrsDec(T)+" = "+kmh(v)+".","",{t:"stop"});
    }
    return qStop();
  }
  var ROUND=[[60,40],[30,20],[90,60],[120,80],[60,30],[40,60],[20,30],[80,120],[45,30],[36,24],[15,10],[100,150],[50,75],[70,30],[105,70],[24,16],[18,12],[72,48]];
  function qRound(){
    var p=rnd(ROUND),a=p[0],b=p[1],v=2*a*b/(a+b),st=a*b/gcd(a,b),L=st*ri(1,Math.max(1,Math.floor(150/st)));
    if(L*60/a%1||L*60/b%1)return qRound();
    var who=rnd(NAMES),how=a<=40&&b<=40?"cycles":"drives";
    return Q(who+" "+how+" "+km(L)+" to the lake at "+kmh(a)+" and comes straight back at "+kmh(b)+". What is the average speed for the round trip?","",v,
      [(a+b)/2,a+b,Math.abs(a-b),v+5,v-4],kmh,
      "Times: "+num(L)+" ÷ "+a+" = "+hm(L*60/a)+" and "+num(L)+" ÷ "+b+" = "+hm(L*60/b)+". Total "+num(2*L)+" km in "+hm(L*60/a+L*60/b)+": "+kmh(v)+". More time is spent at the slower speed, so it is NOT the mean "+num((a+b)/2)+".","",{t:"round"});
  }
  function qMs(){
    var v=ri(2,40)*rnd([1,1,1,0.5]),k=v*3.6;
    if(!isNice(k,1))return qMs();
    if(Math.random()<.5)return Q("Change "+kmh(k)+" into metres per second.","",v,[k*3.6,k/60,k*1000/60,k/3.6*10,v+2,v*2],ms,
      kmh(k)+" = "+num(k*1000)+" m in 3,600 s: "+num(k*1000)+" ÷ 3,600 = "+ms(v)+". (Quick way: ÷ 3.6.)","",{t:"tomps"});
    return Q("Change "+ms(v)+" into kilometres per hour.","",k,[v/3.6,v*60,v*3600,k+10,v*36,k/2],kmh,
      ms(v)+" × 3,600 s = "+num(v*3600)+" m an hour = "+kmh(k)+". (Quick way: × 3.6.)","",{t:"tokmh"});
  }
  function qRun(){
    var who=rnd(NAMES),kind=rnd(["sp","di"]),D=rnd([100,200,400,800,1500,3000,5000]),v=rnd([4,5,6,8,2.5,5.5,6.25,7.5,10,12.5]),t=D/v;
    if(!isNice(t,0)||t>1500)return qRun();
    if(kind==="sp")return Q(who+" runs "+num(D)+" m in "+num(t)+" seconds. What is "+who+"'s average speed?","",v,[t/D,D/t*60,D/(t/60),v+1,v+0.5,v*2],ms,
      "Speed = "+num(D)+" ÷ "+num(t)+" = "+ms(v)+".","",{t:"run"});
    var s=rnd([30,40,45,60,90,100,120,150,200]),d=v*s;
    if(!isNice(d,0))return qRun();
    return Q(who+" runs at an average speed of "+ms(v)+" for "+s+" seconds. How far does "+who+" run?","",d,[v*s/60,s/v,d+v*10,d-20,d+50],function(x){return num(x,1)+" m";},
      "Distance = speed × time = "+num(v)+" × "+s+" = "+num(d)+" m.","",{t:"rundist"});
  }
  function qFastest(){
    var ns=shuffle(NAMES.slice()).slice(0,4),tr=[],sp=[];
    for(var i=0;i<4;i++){var j;do{j=trip(30,110);}while(sp.indexOf(j.s)>=0||tr.some(function(x){return x.D===j.D;}));tr.push(j);sp.push(j.s);}
    var best=sp.indexOf(Math.max.apply(null,sp)),far=tr.map(function(x){return x.D;}).indexOf(Math.max.apply(null,tr.map(function(x){return x.D;})));
    if(far===best)return qFastest();
    var html='<ul class="trips">'+tr.map(function(x,i){return '<li data-n="'+ns[i]+'" data-d="'+x.D+'" data-t="'+x.t+'"><b>'+ns[i]+':</b> '+km(x.D)+' in '+hm(x.t)+'</li>';}).join("")+'</ul>';
    return C("Four friends drive to a match. Who had the highest average speed?","",ns[best],ns.filter(function(x,i){return i!==best;}),
      ns.map(function(x,i){return x+" "+kmh(sp[i]);}).join(", ")+". The longest trip isn't always the fastest!",
      "Highest average speed: "+ns[best]+" ("+kmh(sp[best])+")",html,{t:"fastest"});
  }

  /* ---------- Distance–time graphs ---------- */
  var PATS=[["a","s","a"],["a","s","b"],["a","a","s","b"],["a","s","a","b"],["a","s","a","s"],["a","b","s","b"]];
  function journey(n){
    for(var k=0;k<500;k++){
      var pat=rnd(PATS.filter(function(p){return !n||p.length===n;})),d=0,t=0,pts=[[0,0]],ok=true;
      pat.forEach(function(ty,i){var dur,dd;
        if(ty==="s"){dur=rnd([15,30,30,45,60]);dd=0;}
        else if(ty==="a"){dur=rnd([30,30,45,60,60,90]);dd=rnd([10,10,15,20,20,25,30,40,45,50,60]);}
        else{var last=i===pat.length-1;dur=rnd([30,45,60,60,90,120]);dd=last?-d:-rnd([10,15,20,30]);}
        if(ty==="b"&&(d+dd<0||dd===0))ok=false;
        var sp=Math.abs(dd)*60/dur;if(!isNice(sp,0)||sp>120)ok=false;
        t+=dur;d+=dd;pts.push([t,d]);});
      if(!ok||t>240||t<90)continue;
      return {start:rnd([480,510,540,570,600,780,810,840]),pts:pts,who:rnd(NAMES),names:"OABCDE".slice(0,pts.length)};
    }
    return {start:540,pts:[[0,0],[30,20],[60,20],[120,50]],who:"Aoife",names:"OABC"};
  }
  function graphSVG(g){
    var P=g.pts,T=P[P.length-1][0],mx=Math.max.apply(null,P.map(function(p){return p[1];})),stepY=mx<=60?10:20,Y=Math.ceil(mx/stepY)*stepY||stepY,Tm=Math.ceil(T/30)*30;
    var x0=46,x1=326,y0=200,y1=18,X=function(t){return x0+(x1-x0)*t/Tm;},Yc=function(d){return y0-(y0-y1)*d/Y;};
    var o='<svg class="dtg" viewBox="0 0 340 238" data-start="'+g.start+'" data-x0="'+x0+'" data-xs="'+((x1-x0)/Tm)+'" data-y0="'+y0+'" data-ys="'+((y0-y1)/Y)+'" role="img" aria-label="Distance-time graph of '+g.who+'\'s journey">';
    for(var t=0;t<=Tm;t+=15)o+='<line x1="'+X(t)+'" y1="'+y1+'" x2="'+X(t)+'" y2="'+y0+'" class="gr'+(t%30?' mi':'')+'"/>';
    for(var d=0;d<=Y;d+=stepY/2)o+='<line x1="'+x0+'" y1="'+Yc(d)+'" x2="'+x1+'" y2="'+Yc(d)+'" class="gr'+(d%stepY?' mi':'')+'"/>';
    for(t=0;t<=Tm;t+=30)o+='<text x="'+X(t)+'" y="'+(y0+14)+'" class="ax" text-anchor="middle">'+clk(g.start+t)+'</text>';
    for(d=0;d<=Y;d+=stepY)o+='<text x="'+(x0-5)+'" y="'+(Yc(d)+4)+'" class="ax" text-anchor="end">'+d+'</text>';
    o+='<text x="'+((x0+x1)/2)+'" y="234" class="axt" text-anchor="middle">Time</text><text x="11" y="'+((y0+y1)/2)+'" class="axt" text-anchor="middle" transform="rotate(-90 11 '+((y0+y1)/2)+')">Distance from home (km)</text>';
    o+='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y0+'" class="axl"/><line x1="'+x0+'" y1="'+y0+'" x2="'+x0+'" y2="'+y1+'" class="axl"/>';
    o+='<polyline class="jl" points="'+P.map(function(p){return X(p[0])+","+Yc(p[1]);}).join(" ")+'"/>';
    P.forEach(function(p,i){var lx=X(p[0]),ly=Yc(p[1]);o+='<circle class="gp" cx="'+lx+'" cy="'+ly+'" r="3.6" data-t="'+p[0]+'" data-d="'+p[1]+'" data-n="'+g.names[i]+'"/>'+(i?'<text class="pl" x="'+(lx+(i===P.length-1?-10:0))+'" y="'+(ly-8)+'" text-anchor="middle">'+g.names[i]+'</text>':'');});
    return o+'</svg>';
  }
  function segs(g){var s=[];for(var i=1;i<g.pts.length;i++){var a=g.pts[i-1],b=g.pts[i],dd=b[1]-a[1],dur=b[0]-a[0];s.push({i:i,from:g.names[i-1],to:g.names[i],dd:dd,dur:dur,sp:Math.abs(dd)*60/dur,a:a,b:b});}return s;}
  function qGRead(){
    var g=journey(),c=g.pts.map(function(p,i){return i;}).filter(function(i){return i>0&&g.pts[i][1]>0;}),k=rnd(c),p=g.pts[k];
    var others=g.pts.map(function(q){return q[1];});
    return Q("This graph shows "+g.who+"'s journey. How far from home was "+g.who+" at "+clk(g.start+p[0])+"?","",p[1],
      others.concat([p[1]+5,p[1]-5,p[1]+10,p[0]]),km,
      "Find "+clk(g.start+p[0])+" on the Time axis, go up to the line (point "+g.names[k]+"), then across: "+km(p[1])+".",graphSVG(g),{t:"gread",after:true});
  }
  function qGStop(){
    var g=journey(),S=segs(g),st=S.filter(function(s){return s.dd===0;});
    if(st.length!==1)return qGStop();
    var s=st[0];
    return Q("This graph shows "+g.who+"'s journey. The flat part is a stop. How long did "+g.who+" stop for?","",s.dur,
      S.filter(function(x){return x.dd!==0;}).map(function(x){return x.dur;}).concat([s.dur+15,s.dur-15,s.dur+30,s.dur*2,s.dur+45,s.dur+60]),hm,
      "The line is flat (distance not changing) from "+s.from+" ("+clk(g.start+s.a[0])+") to "+s.to+" ("+clk(g.start+s.b[0])+"): "+hm(s.dur)+".",graphSVG(g),{t:"gstop",after:true});
  }
  function qGSpeed(){
    var g=journey(),S=segs(g).filter(function(s){return s.dd!==0;}),s=rnd(S);
    return Q("This graph shows "+g.who+"'s journey. What was "+g.who+"'s speed between "+s.from+" and "+s.to+"?","",s.sp,
      [Math.abs(s.dd),Math.abs(s.dd)/s.dur,s.b[1],Math.abs(s.dd)*s.dur/60].concat(S.map(function(x){return x.sp;})).concat([s.sp+10,s.sp-5]),kmh,
      "From "+s.from+" to "+s.to+": "+num(Math.abs(s.dd))+" km in "+hm(s.dur)+" ("+hrsDec(s.dur)+" hours). Speed = "+num(Math.abs(s.dd))+" ÷ "+hrsDec(s.dur)+" = "+kmh(s.sp)+".",graphSVG(g),{t:"gspeed",after:true});
  }
  function qGAvg(){
    for(var k=0;k<200;k++){
      var g=journey(),S=segs(g),tot=S.reduce(function(a,s){return a+Math.abs(s.dd);},0),T=g.pts[g.pts.length-1][0],v=tot*60/T,mv=S.filter(function(s){return s.dd!==0;}),Tm=mv.reduce(function(a,s){return a+s.dur;},0);
      if(!isNice(v,1)||Tm===T)continue;
      var en=g.who+"'s whole journey is shown"+(g.pts[g.pts.length-1][1]===0?" (there and back)":"")+". What was the average speed for the whole journey, including stops?";
      return Q(en,"",v,[tot*60/Tm,mv.reduce(function(a,s){return a+s.sp;},0)/mv.length,g.pts[g.pts.length-1][1]*60/T,tot/(T/100),v+5,v-5,v*2,v+1],kmh,
        "Total distance travelled = "+mv.map(function(s){return num(Math.abs(s.dd));}).join(" + ")+" = "+km(tot)+". Total time "+clk(g.start)+" to "+clk(g.start+T)+" = "+hm(T)+". "+num(tot)+" ÷ "+hrsDec(T)+" = "+kmh(v)+".",graphSVG(g),{t:"gavg",after:true});
    }
    return qGAvg();
  }
  var DOING={a:"Moving away from home",s:"Stopped (not moving)",b:"Coming back towards home"};
  function qGWhat(){
    var g=journey(),S=segs(g),s=rnd(S),ty=s.dd>0?"a":s.dd<0?"b":"s";
    return C("This graph shows "+g.who+"'s journey. What was "+g.who+" doing between "+s.from+" and "+s.to+"?","",DOING[ty],
      Object.keys(DOING).filter(function(x){return x!==ty;}).map(function(x){return DOING[x];}).concat(["Going up a hill"]),
      ty==="s"?"A flat line: the distance from home isn't changing, so "+g.who+" is stopped.":ty==="a"?"The line goes UP: the distance from home is growing.":"The line goes DOWN: the distance from home is shrinking.",
      null,graphSVG(g),{t:"gwhat",from:s.from,to:s.to,after:true});
  }
  function qGFast(){
    var g=journey(4),S=segs(g),sp=S.map(function(s){return s.sp;}),m=Math.max.apply(null,sp);
    if(sp.filter(function(x){return x===m;}).length>1)return qGFast();
    var lab=S.map(function(s){return s.from+" to "+s.to;}),b=sp.indexOf(m);
    return C("This graph shows "+g.who+"'s journey. On which part was "+g.who+" travelling fastest?","",lab[b],lab.filter(function(x,i){return i!==b;}),
      "The steepest part is the fastest: "+S.map(function(s){return s.from+"–"+s.to+" "+kmh(s.sp);}).join(", ")+".",null,graphSVG(g),{t:"gfast",after:true});
  }

  /* ---------- Currency ---------- */
  var RATES={GBP:[840,845,850,855,860,865,870,875,880,885,890],USD:[1050,1060,1070,1080,1085,1090,1100,1120,1150,1160,1180],CHF:[920,925,930,935,940,945,950,960,970]};
  function cur(){var c=rnd(["GBP","GBP","USD","USD","CHF"]);return {c:c,R:rnd(RATES[c])};}
  function rateStr(x){var s=rate(x.R);return "€1 = "+CUR[x.c][0]+s;}
  function qToF(){
    var x=cur(),E=ri(4,90)*rnd([5,10,10,20]),fc=hu(E*100*x.R,1000),who=rnd(NAMES);
    return Q("The exchange rate is "+rateStr(x)+". "+who+" changes €"+commas(String(E))+" into "+CUR[x.c][1]+". How much does "+who+" get?","",fc,
      [hu(E*100*1000,x.R),E*x.R,fc+100,fc-100,fc+1000,E*100],function(c){return mon(x.c,c);},
      "Euro → "+CUR[x.c][1]+": MULTIPLY by the rate. "+commas(String(E))+" × "+rate(x.R)+" = "+mon(x.c,fc)+".","",{t:"tof",c:x.c,R:x.R});
  }
  function qToE(){
    var x=cur(),F=ri(3,90)*rnd([5,10,10,20]),ec=hu(F*100*1000,x.R),who=rnd(NAMES);
    return Q("The exchange rate is "+rateStr(x)+". After a holiday "+who+" changes "+mon(x.c,F*100).replace(/\.00$/,"")+" back into euro. How many euro does "+who+" get (to the nearest cent)?","",ec,
      [hu(F*100*x.R,1000),ec+100,ec-100,ec+1000,F*100,ec*2],function(c){return mon("EUR",c);},
      CUR[x.c][1].charAt(0).toUpperCase()+CUR[x.c][1].slice(1)+" → euro: DIVIDE by the rate. "+commas(String(F))+" ÷ "+rate(x.R)+" = "+mon("EUR",ec)+".","",{t:"toe",c:x.c,R:x.R});
  }
  function qFee(){
    var x=cur(),c=rnd([1,1.5,2,2.5,3]),E=ri(5,40)*20,after=E*(100-c),fc=hu(after*x.R,1000),who=rnd(NAMES);
    return Q("A bank takes "+num(c)+"% commission from the euro before changing it. "+who+" changes €"+commas(String(E))+" into "+CUR[x.c][1]+" at "+rateStr(x)+". How much does "+who+" get?","",fc,
      [hu(E*100*x.R,1000),hu(E*(100+c)*x.R,1000),hu((E*100-c*100)*x.R,1000),fc+100,fc-100],function(v){return mon(x.c,v);},
      "Commission: "+num(c)+"% of €"+commas(String(E))+" = "+mon("EUR",E*c)+", leaving "+mon("EUR",after)+". Then × "+rate(x.R)+" = "+mon(x.c,fc)+".","",{t:"fee",c:x.c,R:x.R});
  }
  function qRate(){
    var x=cur(),E=rnd([100,200,250,400,500,1000,2000]),fc=E*x.R/10;
    if(!isNice(fc,0))return qRate();
    var rf=function(v){return "€1 = "+CUR[x.c][0]+r2(v);};
    var who=rnd(NAMES);return Q(who+" changes €"+commas(String(E))+" and gets "+mon(x.c,fc)+". What is the exchange rate?","",x.R/1000,
      [E/(fc/100),x.R/100,x.R/1000+0.1,x.R/1000-0.05,(fc/100-E)/E],rf,
      mon(x.c,fc)+" ÷ "+commas(String(E))+" = "+rate(x.R)+", so €1 = "+CUR[x.c][0]+rate(x.R)+".","",{t:"rate",c:x.c});
  }
  function qCompare(){
    var x={c:"GBP",R:rnd(RATES.GBP)},items=[["pair of runners",60,140],["jacket",50,160],["games console",250,450],["phone case",12,35],["concert ticket",40,95],["bike helmet",30,80]];
    for(var k=0;k<200;k++){
      var it=rnd(items),eu=ri(it[1],it[2])*100+rnd([0,0,50,99]),pc=Math.round(eu*x.R/1000*ri(82,118)/100/50)*50-rnd([0,0,1]),pe=hu(pc*1000,x.R),diff=Math.abs(eu-pe),raw=Math.abs(eu-pc);
      if(diff<100||diff>4000||raw===diff)continue;
      var B="Belfast is cheaper by ",Ck="Cork is cheaper by ",ans=(pe<eu?B:Ck)+mon("EUR",diff),other=(pe<eu?Ck:B);
      var pool=[other+mon("EUR",diff),(pc<eu?B:Ck)+mon("EUR",raw),"They cost the same"];
      var wd=Math.abs(eu-hu(pc*x.R,1000));if(wd!==diff&&wd>0)pool.push((hu(pc*x.R,1000)<eu?B:Ck)+mon("EUR",wd));
      return C("A "+it[0]+" costs "+mon("EUR",eu)+" in Cork and "+mon("GBP",pc)+" in Belfast. The rate is "+rateStr(x)+". Which is true?","",ans,pool,
        "Change the sterling price to euro: "+mon("GBP",pc)+" ÷ "+rate(x.R)+" = "+mon("EUR",pe)+". Compare with "+mon("EUR",eu)+": difference "+mon("EUR",diff)+".",null,"",{t:"compare",R:x.R});
    }
    return qCompare();
  }
  function qWhichCur(){
    var x=cur(),A=ri(3,60)*10,toE=Math.random()<.5,R=rate(x.R),ans=toE?A+" ÷ "+R:A+" × "+R,nm=CUR[x.c][1];
    return C("The rate is "+rateStr(x)+". Which calculation changes "+(toE?CUR[x.c][0]+A+" into euro":"€"+A+" into "+nm)+"?","",ans,
      [toE?A+" × "+R:A+" ÷ "+R,R+" ÷ "+A,A+" − "+R,A+" + "+R],
      toE?"Into euro: divide by the rate (each €1 costs "+CUR[x.c][0]+R+").":"Out of euro: multiply by the rate (each €1 gets you "+CUR[x.c][0]+R+").",null,"",{t:"whichcur",c:x.c,R:x.R,A:A,toE:toE});
  }

  var MAKERS={
    trip:[qSpeed,qSpeed,qDist,qDist,qTime,qTime,qDecH,qArrive,qArrive,qWhichCalc],
    average:[qAvg2,qAvg2,qAvgSpeeds,qStop,qRound,qMs,qMs,qRun,qFastest],
    graph:[qGRead,qGStop,qGSpeed,qGSpeed,qGAvg,qGWhat,qGFast],
    currency:[qToF,qToF,qToE,qToE,qFee,qRate,qCompare,qWhichCur],
    mixed:[qSpeed,qDist,qTime,qDecH,qArrive,qWhichCalc,qAvg2,qAvgSpeeds,qStop,qRound,qMs,qRun,qFastest,qGRead,qGStop,qGSpeed,qGAvg,qGWhat,qGFast,qToF,qToE,qFee,qRate,qCompare,qWhichCur]
  };

  /* draw the fixed graphs in the rules and Exam corner */
  [].forEach.call(document.querySelectorAll("[data-graph]"),function(el){try{var g=JSON.parse(el.getAttribute("data-graph"));el.innerHTML=graphSVG(g);}catch(e){}});

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="trip"?75:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.data&&q.data.after?esc(q.frame||"")+(q.html||""):(q.html||"")+esc(q.frame||"");
    $("frame").className="frame"+(q.frame&&q.frame.length>24?" long":"");
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){pick(b,t);};box.appendChild(b);
    });
  }
  function pick(btn,t){
    if(locked||left<=0)return;locked=true;asked++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="trip"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="trip"&&streak%5===0?700:350):3400);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready speed.":score>=11?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,graphSVG:graphSVG};
})();
</script>
