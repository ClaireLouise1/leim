<script>
(function(){
  /* ---------- helpers ---------- */
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  /* ---------- data (the PDFs and src/test_talk_tips.py read this block: keep it valid JSON; one item per line) ----------
     tips: [do/avoid, a speaking or listening habit]
     open: [topic (as said in a sentence), emoji, the best opening line (a hook)]
     sign: [sentence that starts with a signpost, s (start) / m (next point) / e (end)]
     listen: [what a friend says, the best listening reply, [3 poor replies]]
     discuss: [phrase used in a class discussion, ag (agree) / di (disagree politely) / jo (join in) / as (ask for more)] */
  var D=/*DATA*/{
 "tips": [
  ["do", "Look up at your audience"],
  ["do", "Make eye contact with different people"],
  ["do", "Speak loudly enough for the back row"],
  ["do", "Slow down and pause after a key point"],
  ["do", "Stand up straight and keep your feet still"],
  ["do", "Use cue cards with key words only"],
  ["do", "Smile at the start"],
  ["do", "Practise out loud before the day"],
  ["do", "Take a deep breath before you begin"],
  ["do", "Let others finish before you speak"],
  ["do", "Nod to show you're listening"],
  ["do", "Ask a question about what someone said"],
  ["do", "Vary your voice to stress key words"],
  ["do", "Time your talk at home"],
  ["avoid", "Read every word from the page"],
  ["avoid", "Stare at the floor"],
  ["avoid", "Mumble into your notes"],
  ["avoid", "Rush to get it over with"],
  ["avoid", "Say “em” and “like” in every sentence"],
  ["avoid", "Fidget with your hair or your pen"],
  ["avoid", "Turn your back to the class"],
  ["avoid", "Interrupt someone in the middle of a sentence"],
  ["avoid", "Check your phone while someone is talking"],
  ["avoid", "Speak in the same flat voice the whole time"],
  ["avoid", "Laugh at someone's mistake"],
  ["avoid", "Whisper to your friend during a talk"],
  ["avoid", "Fill your slides with long sentences"],
  ["avoid", "Sway from side to side"]
 ],
 "open": [
  ["dogs", "🐶", "Have you ever been woken up by a dog licking your face?"],
  ["Gaelic football", "🏟️", "Over 80,000 people pack into Croke Park for the All-Ireland Gaelic football final."],
  ["my granny", "👵", "When I was six, my granny taught me how to make brown bread."],
  ["phones in school", "📱", "What would you do if your phone was taken away for a whole week?"],
  ["recycling", "♻️", "A plastic bottle can take hundreds of years to break down, so recycling matters."],
  ["learning to swim", "🏊", "Last summer, I jumped off the pier at Kinsale and forgot that I couldn't swim."],
  ["sharks", "🦈", "Sharks were swimming in the sea over 400 million years ago, long before the dinosaurs."],
  ["the best day of my life", "🌟", "Two years ago, the best day of my life began with a phone call at six in the morning."],
  ["video games", "🎮", "Who here has stayed up far too late playing video games?"],
  ["school uniforms", "👔", "Should we really have to wear a school uniform every single day?"],
  ["the Irish language", "☘️", "Over 70,000 people speak Irish every day outside school."],
  ["my first day at secondary school", "🏫", "When I walked into secondary school on my first day, I got lost three times before lunch."],
  ["healthy breakfasts", "🥣", "What did you eat for breakfast this morning?"],
  ["the moon", "🌙", "The moon is about 384,000 kilometres away from Earth."],
  ["being a big sister", "👧", "When my baby brother was born, I became a big sister overnight."],
  ["the Cliffs of Moher", "🌊", "The Cliffs of Moher are over 200 metres high at their tallest point."]
 ],
 "sign": [
  ["First of all, let me tell you how it began.", "s"],
  ["To begin with, I'll explain the rules.", "s"],
  ["I'd like to start with a quick story.", "s"],
  ["Firstly, let's look at the cost.", "s"],
  ["Let me begin by asking you a question.", "s"],
  ["Moving on, let's look at the problems.", "m"],
  ["Secondly, think about the cost.", "m"],
  ["Another reason is safety.", "m"],
  ["Next, I'll show you how it works.", "m"],
  ["On top of that, it saves money.", "m"],
  ["My second point is about time.", "m"],
  ["To sum up, dogs make great pets.", "e"],
  ["In conclusion, our town needs more parks.", "e"],
  ["To finish, here's one last tip.", "e"],
  ["So, to wrap up, give it a go.", "e"],
  ["All in all, the trip was worth it.", "e"],
  ["Thank you all for listening.", "e"]
 ],
 "listen": [
  ["I went to Paris for my birthday.", "What was your favourite part of Paris?", ["Cool. Anyway, I got new runners.", "Did you see the match last night?", "Paris is overrated."]],
  ["I've started learning the guitar.", "What song are you learning on the guitar first?", ["Ugh, that sounds boring.", "Have you done the maths homework?", "I play the piano and I'm way better at it."]],
  ["My cat had kittens last week.", "How many kittens did she have?", ["Ugh, I hate cats.", "What's for lunch today?", "My dog had puppies once and they were cuter."]],
  ["We're doing a play in drama class.", "What part are you playing in the play?", ["Drama is a waste of time.", "Are you going to the disco on Friday?", "I was in a play once and I was the star."]],
  ["I made my own pizza at the weekend.", "What did you put on your pizza?", ["Pizza is unhealthy, you know.", "Can I borrow your charger?", "My mam makes the best pizza in the world."]],
  ["My team won the county final.", "Well done! Who scored in the final?", ["That's not a big deal.", "Did you watch the new film last night?", "We'd have beaten you easily."]],
  ["I'm reading a really good book about space.", "What's the most interesting thing you've learned about space?", ["Ugh, sounds dull.", "What time does the bus come?", "I don't read books. I just watch YouTube."]],
  ["My granny is moving in with us.", "How do you feel about your granny moving in?", ["Whatever.", "Did you see what Liam posted?", "My granny lives in Spain and she's way cooler."]],
  ["I'm minding my cousins every Saturday.", "What do you do with your cousins on Saturdays?", ["Sounds like a pain.", "Where did you get that jacket?", "I don't have any cousins. I just have a brother."]],
  ["We went camping in Connemara.", "Did you stay near the sea in Connemara?", ["Camping is the worst.", "Where did you get your runners?", "We stayed in a hotel in Galway last year."]],
  ["I'm nervous about my piano exam.", "When is your piano exam?", ["You'll probably fail anyway.", "Do you want to come to my house later?", "I never get nervous about anything."]],
  ["I've been training for a 5K run.", "How far can you run now?", ["That's pointless.", "What did you get for Christmas?", "I could run 5K without any training."]]
 ],
 "discuss": [
  ["I agree with Aoife on that.", "ag"],
  ["That's a great point.", "ag"],
  ["Exactly. I think so too.", "ag"],
  ["You're right about the cost.", "ag"],
  ["I see what you mean, but I'm not so sure.", "di"],
  ["I take your point, but I think it's too expensive.", "di"],
  ["I'd see it a bit differently.", "di"],
  ["With respect, I disagree.", "di"],
  ["Can I come in here?", "jo"],
  ["If I could just add something here.", "jo"],
  ["Could I say something?", "jo"],
  ["May I add a quick point?", "jo"],
  ["Can you give us an example?", "as"],
  ["What do you mean by that?", "as"],
  ["Could you explain that a bit more?", "as"],
  ["Why do you think that?", "as"],
  ["Can you tell us more about that?", "as"]
 ]
}/*END*/;
  var TIP={"do":"👍 Do it",avoid:"👎 Avoid it"};
  var HOOK={q:"❓ Question",f:"📊 Fact",s:"📖 Story"};
  var SIGN={s:"🚀 Start",m:"➡️ Next point",e:"🏁 End"};
  var DISC={ag:"🤝 Agree",di:"🙅 Disagree politely",jo:"🙋 Join in",as:"🤔 Ask for more"};
  var FIXED=[TIP,HOOK,SIGN,DISC].reduce(function(a,L){return a.concat(Object.keys(L).map(function(k){return L[k];}));},[]);
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];nw=nw||3;seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,nw:nw,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  function card(s,cls){return '<div class="tt-card'+(cls?" "+cls:"")+'"><p>'+s+'</p></div>';}
  function others(L,k){return Object.keys(L).filter(function(x){return x!==k;}).map(function(x){return L[x];});}
  function hookType(s){return /\?$/.test(s)?"q":/^(When|Last|Two years ago|One|The day)\b/.test(s)?"s":"f";}
  /* weak openers, made from the topic */
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
  function weak(t){return ["Today I'm going to talk about "+t+".","Em, so, like, em, it's about "+t+", yeah.","Sorry, I didn't really prepare. It's about "+t+".","That's all I know about "+t+". Thanks for listening."];}
  var HWHY={q:"A question makes every listener think of an answer.",f:"A surprising fact or number grabs attention.",s:"A short story from your life pulls people in."};

  /* ================= TALK TIPS: do it or avoid it? ================= */
  function qTip(){var it=rnd(D.tips);
    return C("Good habit?",TIP[it[0]],others(TIP,it[0]),it[0]==="do"?"Do it: it helps your audience see, hear and follow you.":"Avoid it: it makes you harder to hear, follow or trust.",card(esc(it[1])),{t:"tip",s:it[1],rv:it[1]},1);}
  /* ================= HOOK THEM: best opening line ================= */
  function qOpen(){var it=rnd(D.open);
    return C("🎣 Best opening line?",it[2],weak(it[0]),"Hook them first. "+HWHY[hookType(it[2])]+" Never open with “Today I'm going to talk about…”.",
      card('<span class="tt-lab">Talk</span>'+it[1]+" "+esc(cap(it[0]))),{t:"open",topic:it[0],rv:"Opening line for a talk on "+it[0]},3);}
  function qHook(){var it=rnd(D.open),k=hookType(it[2]);
    return C("Which kind of hook?",HOOK[k],others(HOOK,k),HWHY[k],card(esc(it[2])),{t:"hook",s:it[2],rv:it[2]},2);}
  /* ================= SIGNPOSTS ================= */
  function qSign(){var it=rnd(D.sign);
    return C("🪧 Where in the talk?",SIGN[it[1]],others(SIGN,it[1]),"Signpost words tell listeners where they are: start, next point or end.",card(esc(it[0])),{t:"sign",s:it[0],rv:it[0]},2);}
  /* ================= LISTEN WELL ================= */
  function qListen(){var it=rnd(D.listen);
    return C("👂 Best reply?",it[1],it[2],"A good listener asks about what the speaker just said. Don't change the subject, talk about yourself or put them down.",
      card('<span class="tt-lab">Your friend says</span>“'+esc(it[0])+'”',"say"),{t:"listen",s:it[0],rv:"“"+it[0]+"”"},3);}
  /* ================= DISCUSS IT ================= */
  function qDisc(){var it=rnd(D.discuss);
    return C("💬 What is it for?",DISC[it[1]],others(DISC,it[1]),"In a discussion you agree, disagree politely, join in or ask for more. Keep it polite.",card("“"+esc(it[0])+"”"),{t:"disc",s:it[0],rv:it[0]},3);}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    tips:[qTip],
    open:[qOpen,qOpen,qHook],
    sign:[qSign],
    listen:[qListen],
    discuss:[qDisc],
    mixed:[qTip,qOpen,qHook,qSign,qListen,qListen,qDisc]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=(m==="mixed")?90:60;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"start"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>14;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=FIXED;
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* label buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="tips"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="tips"&&streak%5===0?800:500):3200);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! You talk and listen like a pro.":score>=12?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{D:D,TIP:TIP,HOOK:HOOK,SIGN:SIGN,DISC:DISC,weak:weak,hookType:hookType}};
})();
</script>
