(function(){

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
    /* ---------- data (the PDFs and src/test_format_sort.py read this block: keep it valid JSON; one item per line) ----------

  var D=/*DATA*/{
 "type": [

  ["Hi everyone, and welcome back to my blog!", "blo"],

 ],
 "heads": [
  ["A Clare teenager has rescued a seal pup that was trapped in fishing nets on Fanore beach.", "Teen Saves Seal Pup on Fanore Beach"],
  ["Students at a Sligo school have built a robot that sorts plastic from paper in the recycling bins.", "Sligo Pupils Build Recycling Robot"],

 ],
 "vague": ["Big News Today", "You Won't Believe This", "Something Happened", "Read All About It", "Things Are Changing"],
 "rep": [

 ],
 "rev": [
  ["Storm Island is directed by Orla Healy and runs for 98 minutes.", "de"],
  ["The Silver Hurley, written by Pádraig Lynch, has 240 pages.", "de"],
  ["Bog Racer 3 is available on all games consoles and costs €30.", "de"],
  ["Rated 12A, the film was released in cinemas last Friday.", "de"],
  ["Starring Aoife Kearney as the detective, the series has six episodes.", "de"],
  ["The album was released in June and has eleven songs.", "de"],
  ["The acting is superb, especially from the girl who plays Nell.", "pr"],
  ["I loved the way the story jumps between the past and the present.", "pr"],
  ["The jokes are hilarious, and the whole cinema was laughing.", "pr"],
  ["The race tracks look stunning, from the bogs of Offaly to the Cliffs of Moher.", "pr"],
  ["The twist at the end is clever and took me completely by surprise.", "pr"],
  ["Her singing is the highlight of the whole album.", "pr"],
  ["The middle section drags, and I nearly fell asleep.", "cr"],
  ["Sadly, the ending is predictable.", "cr"],
  ["The levels become repetitive after a while.", "cr"],
  ["At nearly three hours, the film is far too long.", "cr"],

  ["Four stars out of five: a must for any mystery fan.", "ve"],

  ["Three out of five: fun, but not one to remember.", "ve"]
 ]
}/*END*/;
  var TYPE={rep:"📊 Report",rev:"⭐ Review",art:"📰 Article",blo:"💻 Blog",spe:"🎤 Speech"};
  var TWHY={rep:"Report: a title \u201cReport on…\u201d, terms of reference, findings (often with numbers), recommendations. Formal and factual.",
    rev:"Review: details (director, author, price), praise and criticism, a verdict or star rating.",
    art:"Article: a headline, a byline (By …), facts, quotes from people (\u201caccording to\u201d, residents, a spokesperson).",
    blo:"Blog: chatty and personal, talks to readers (\u201cHi everyone\u201d), comments, followers, hashtags.",
    spe:"Speech: spoken to a live audience: \u201cGood morning, everyone\u201d, \u201cFellow students\u201d, \u201cThank you for listening\u201d."};
  var REP={ti:"📌 Title",in:"📋 Introduction",fi:"🔍 Findings",re:"💡 Recommendation",si:"✍️ Sign-off"};
  var RWHY={ti:"Title: \u201cReport on …\u201d says exactly what the report is about.",
    in:"Introduction (terms of reference): who asked for the report and what it sets out to do.",
    fi:"Findings: what you found out, often with numbers (68%, 12 out of 40, most students).",
    re:"Recommendation: what should be done (I recommend that…, should…).",
    si:"Sign-off: who wrote it, their role and the date."};
  var REV={de:"ℹ️ Details",pr:"👍 Praise",cr:"👎 Criticism",ve:"⭐ Verdict"};
  var VWHY={de:"Details: the facts the reader needs (title, director or author, length, price, where to get it).",
    pr:"Praise: what's good about it, with a reason (superb acting, a clever twist).",
    cr:"Criticism: what's weak (it drags, predictable, repetitive).",
    ve:"Verdict: your final judgement: stars, a score, \u201coverall\u201d, would you recommend it?"};
  var FIXED=[].concat(Object.keys(TYPE).map(function(k){return TYPE[k];}),Object.keys(REP).map(function(k){return REP[k];}),Object.keys(REV).map(function(k){return REV[k];}));
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];nw=nw||3;seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,nw:nw,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  function others(L,k){return Object.keys(L).filter(function(x){return x!==k;}).map(function(x){return L[x];});}
  function card(s,cls){return '<div class="fs-card'+(cls?" "+cls:"")+'"><p>'+esc(s)+'</p></div>';}

  /* ================= FORMAT SORT: which text type? ================= */
  function qType(){var it=rnd(D.type),k=it[1];
    return C("🗂️ Which text type?",TYPE[k],others(TYPE,k),TWHY[k],card(it[0]),{t:"type",s:it[0],rv:it[0]},3);}
  /* ================= HEADLINES: pick the best one ================= */
  function qHead(){var i=Math.floor(Math.random()*D.heads.length),it=D.heads[i];
    var pool=shuffle(D.heads.filter(function(x,j){return j!==i;}).map(function(x){return x[1];})).slice(0,2).concat([rnd(D.vague)]);
    var q=C("📰 Best headline?",it[1],pool,"A good headline is short and names the main fact: who or what, and where. It must match the story.",
      '<div class="fs-card news"><div class="fs-gap">? ? ?</div><p>'+esc(it[0])+'</p></div>',{t:"head",s:it[0],rv:it[0].slice(0,48)+"…"},3);
    return q;}
  /* ================= REPORT PARTS ================= */
  function qRep(){var it=rnd(D.rep),k=it[1];
    return C("📊 Which part of the report?",REP[k],others(REP,k),RWHY[k],card(it[0],"rep"),{t:"rep",s:it[0],rv:it[0]},3);}
  /* ================= REVIEW PARTS ================= */
  function qRev(){var it=rnd(D.rev),k=it[1];
    return C("⭐ Which part of the review?",REV[k],others(REV,k),VWHY[k],card(it[0],"rev"),{t:"rev",s:it[0],rv:it[0]},3);}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    sort:[qType],
    head:[qHead],
    rep:[qRep],
    rev:[qRev],
    mixed:[qType,qType,qHead,qRep,qRev]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=(m==="head"||m==="mixed")?90:60;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"start"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>18;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=q.fixed||FIXED;
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* label buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="sort"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="sort"&&streak%5===0?800:500):3200);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! You know your formats.":score>=12?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{D:D,TYPE:TYPE,REP:REP,REV:REV}};
})();
</script>
