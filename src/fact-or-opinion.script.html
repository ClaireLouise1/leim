 "spot": [

 ],

  {"title": "Rubbish found on the beach", "y": "Pieces", "bars": [["Plastic", 50], ["Cans", 20], ["Glass", 5], ["Paper", 15]]},

  {"title": "Visitors to the museum", "y": "Visitors", "bars": [["Mon", 15], ["Tue", 20], ["Wed", 35], ["Thu", 25], ["Fri", 40]]},
  {"title": "Trees planted by each class", "y": "Trees", "bars": [["1A", 25], ["1B", 40], ["1C", 15], ["1D", 30]]}
 ],
 "posters": [
  {"head": "Spooky Night Walk", "img": "🎃🔦", "cap": "Families on last year's walk in the woods", "when": "Saturday 31 October, 7 p.m., Doneraile Park", "con": "Book on 087 555 0142"},
  {"head": "Summer Surf Camp", "img": "🏄🌊", "cap": "Learners catching their first wave", "when": "1–5 July, 10 a.m. daily, Lahinch beach", "con": "www.lahinchsurfcamp.ie"},
  {"head": "Big Book Swap", "img": "📚🔄", "cap": "Our shelves after the spring swap", "when": "Friday 14 March, 3 p.m., school library", "con": "Email library@kilbrook.ie"},
  {"head": "Talent Show Auditions", "img": "🎤🎸", "cap": "Last year's winners on stage", "when": "Tuesday 9 December, 4 p.m., main hall", "con": "Call Ms Ryan on 086 555 0177"},
  {"head": "Tidy Towns Clean-Up", "img": "🧤🗑️", "cap": "Volunteers on the river path", "when": "Sunday 20 April, 10 a.m., the Square", "con": "www.ballinoratidytowns.ie"},
  {"head": "Christmas Craft Fair", "img": "🎄🧶", "cap": "Hand-made decorations from last year", "when": "Saturday 6 December, 11 a.m., the parish hall", "con": "Text 085 555 0109 for a stall"},
  {"head": "Free Bike Repair Day", "img": "🚲🔧", "cap": "A mechanic fixing a puncture", "when": "Wednesday 2 April, 2 p.m., the Greenway car park", "con": "Email fixit@pedalpower.ie"},
  {"head": "Dog Show", "img": "🐕🏆", "cap": "Rex, winner of the waggiest tail", "when": "Sunday 17 August, noon, the GAA grounds", "con": "Enter at www.kilmoredogshow.ie"},
  {"head": "Science Week Open Night", "img": "🔬🧪", "cap": "Students testing their rockets", "when": "Thursday 13 November, 6 p.m., the science labs", "con": "Call the office on 021 555 0133"},
  {"head": "Coastal Bird Watch", "img": "🐦🔭", "cap": "Puffins on the cliffs at dawn", "when": "Saturday 10 May, 6 a.m., Kilmore Quay", "con": "Book at www.wexfordbirds.ie"},
  {"head": "Junior Chess Tournament", "img": "♟️🏅", "cap": "Players in last year's final round", "when": "Saturday 22 February, 9 a.m., the community centre", "con": "Email chess@ennisclub.ie"},
  {"head": "Fun Run for the Hospice", "img": "🏃🎽", "cap": "Runners crossing the finish line", "when": "Sunday 5 October, 11 a.m., the town park", "con": "Sign up on 087 555 0190"}
 ]
}/*END*/;
  var FO=["🧾 Fact","💭 Opinion"];
  var LINES=["Line 1","Line 2","Line 3","Line 4"];
  var PARTS=["📢 Headline","🖼️ Picture","📝 Caption","📅 When & where","📞 Contact details"];
  var FIXED=FO.concat(LINES,PARTS);
  var FOWHY={"🧾 Fact":"Fact: it can be checked (a number, a date, a time, a place).","💭 Opinion":"Opinion: a judgement word (best, too, boring, should, amazing…). Someone could disagree."};
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];nw=nw||3;seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,nw:nw,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  /* fact/opinion keys: fo lines carry their list; spot texts list their opinion lines in "op" (1–4) */
  function kindAt(T,i){return T.op.indexOf(i+1)>=0?FO[1]:FO[0];}
  /* ================= FACT OR OPINION? ================= */
  function qFo(){var isF=Math.random()<.5,s=rnd(isF?D.fo.f:D.fo.o),ans=isF?FO[0]:FO[1];
    return C("Fact or opinion?",ans,FO.filter(function(x){return x!==ans;}),FOWHY[ans],'<p class="fo-s">'+esc(s)+'</p>',{t:"fo",s:s,rv:s},1);}

  /* ================= FIND THE ODD LINE in a leaflet / review / poster ================= */
  var keep=null,keepN=0;
  function text(){if(keep!==null&&keepN<2){keepN++;return D.spot[keep];}keep=Math.floor(Math.random()*D.spot.length);keepN=1;return D.spot[keep];}
  function card(T,hl){return '<div class="fo-card"><span class="fo-k">'+esc(T.k)+' · '+esc(T.title)+'</span>'+T.lines.map(function(l,i){return '<p'+(i===hl?' class="hl"':'')+'><b>'+(i+1)+'</b> '+esc(l)+'</p>';}).join("")+'</div>';}
  function qSpot(){var T=text(),ks=T.lines.map(function(l,i){return kindAt(T,i);}),nf=ks.filter(function(k){return k===FO[0];}).length;
    var want=nf===1?FO[0]:FO[1],i=ks.indexOf(want);
    if(keepN===2){var j=rnd([0,1,2,3].filter(function(x){return x!==i;})),a=ks[j];
      return C("Line "+(j+1)+": fact or opinion?",a,FO.filter(function(x){return x!==a;}),FOWHY[a],card(T,j),{t:"line",title:T.title,ln:j+1,rv:T.title+", line "+(j+1)},1);}
    return C(want===FO[0]?"🔍 Which line is the only fact?":"🔍 Which line is the only opinion?","Line "+(i+1),LINES.filter(function(x){return x!=="Line "+(i+1);}),
      "Line "+(i+1)+": "+T.lines[i],card(T,-1),{t:"spot",title:T.title,want:want,rv:T.title},3);}

  /* ================= READ THE CHART ================= */
  var X0=56,X1=390,Y0=214,TOP=24,MAXV=50,S=(Y0-TOP)/MAXV;
  function chart(G){var n=G.bars.length,w=(X1-X0)/n,s='<svg class="fo-chart" viewBox="0 0 400 264" role="img" aria-label="Bar chart: '+esc(G.title)+'">';
    s+='<text x="200" y="14" text-anchor="middle" font-size="17" font-weight="700" fill="#1B2A3A">'+esc(G.title)+'</text>';
    for(var v=0;v<=MAXV;v+=10){var y=Y0-v*S;s+='<g class="tick"><line x1="'+X0+'" x2="'+X1+'" y1="'+y+'" y2="'+y+'" stroke="#D9DEE4"'+(v?' stroke-dasharray="3 3"':'')+'/><text x="'+(X0-6)+'" y="'+(y+5)+'" text-anchor="end" font-size="16" fill="#55606C">'+v+'</text></g>';
      if(v<MAXV){var y5=Y0-(v+5)*S;s+='<line x1="'+X0+'" x2="'+X1+'" y1="'+y5+'" y2="'+y5+'" stroke="#EEF1F4"/>';}}
    G.bars.forEach(function(b,i){var h=b[1]*S,x=X0+i*w+w*.18,bw=w*.64;
      s+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+(Y0-h).toFixed(2)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(2)+'" rx="3" fill="#4C8BC9"/>';
      s+='<text class="bl" x="'+(x+bw/2).toFixed(1)+'" y="'+(Y0+20)+'" text-anchor="middle" font-size="15" fill="#1B2A3A">'+esc(b[0])+'</text>';});
    s+='<text x="14" y="'+((Y0+TOP)/2)+'" font-size="15" fill="#55606C" transform="rotate(-90 14 '+((Y0+TOP)/2)+')" text-anchor="middle">'+esc(G.y)+'</text>';
    return s+'</svg>';}
  function near(v,others){return [v-5,v+5,v-10,v+10].concat(others).filter(function(x){return x>0&&x!==v;});}
  function qChart(){var G=rnd(D.charts),B=G.bars,vals=B.map(function(b){return b[1];}),labs=B.map(function(b){return b[0];}),k=Math.floor(Math.random()*4),h=chart(G);
    var hi=vals.indexOf(Math.max.apply(null,vals)),lo=vals.indexOf(Math.min.apply(null,vals));
    if(k===0)return C("📊 Which is the highest?",labs[hi],labs.filter(function(x,i){return i!==hi;}),labs[hi]+": "+vals[hi]+".",h,{t:"most",title:G.title,rv:G.title+": highest"},3);
    if(k===1)return C("📊 Which is the lowest?",labs[lo],labs.filter(function(x,i){return i!==lo;}),labs[lo]+": "+vals[lo]+".",h,{t:"least",title:G.title,rv:G.title+": lowest"},3);
    var i=Math.floor(Math.random()*B.length);
    if(k===2)return C("📊 How many: "+labs[i]+"?",String(vals[i]),shuffle(near(vals[i],vals)).map(String),"Read across from the top of the "+labs[i]+" bar: "+vals[i]+".",h,{t:"value",title:G.title,lab:labs[i],rv:G.title+": "+labs[i]},3);
    var j;do{j=Math.floor(Math.random()*B.length);}while(j===i||vals[j]===vals[i]);
    if(vals[j]>vals[i]){var t=i;i=j;j=t;}
    var d=vals[i]-vals[j],pool=[vals[i]+vals[j],vals[i],vals[j],d+5,d-5,d+10,d+15].filter(function(x){return x>0&&x!==d;});
    return C("📊 How many more: "+labs[i]+" than "+labs[j]+"?",String(d),pool.map(String),labs[i]+" "+vals[i]+" − "+labs[j]+" "+vals[j]+" = "+d+".",h,{t:"diff",title:G.title,a:labs[i],b:labs[j],rv:G.title+": "+labs[i]+" − "+labs[j]},3);}

  /* ================= POSTER PARTS ================= */
  var KEYS=["head","img","cap","when","con"];
  function poster(P,order,hl){return '<div class="fo-poster">'+order.map(function(k){
      return '<div class="pp pp-'+(k==="head"?"big":k==="img"?"pic":k==="cap"?"small":"info")+(k===hl?' hl':'')+'">'+esc(P[k])+'</div>';}).join("")+'</div>';}
  function qPoster(){var P=rnd(D.posters),order=["head","img","cap"].concat(shuffle(["when","con"])),k=rnd(KEYS),ans=PARTS[KEYS.indexOf(k)];
    var WHY={head:"Headline: the big words at the top that grab your attention.",img:"Picture: it shows the event and catches the eye.",cap:"Caption: the line under a picture that explains it.",when:"When & where: the day, the time and the place.",con:"Contact details: a phone number, a website or an email."};
    return C("🖼️ What is the highlighted part?",ans,PARTS.filter(function(x){return x!==ans;}),WHY[k],poster(P,order,k),{t:"poster",head:P.head,rv:P.head+": "+P[k]},3);}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    fo:[qFo],
    spot:[qSpot],
    chart:[qChart],
    poster:[qPoster],
    mixed:[qFo,qSpot,qChart,qPoster]
  };
  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="fo"?60:90;keep=null;keepN=0;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"start"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>16;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=q.fixed||FIXED;
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* label buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="fo"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="fo"&&streak%5===0?800:500):3200);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! You read like an examiner.":score>=12?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){var key=m.review+"|"+m.said;if(seen[key])return;seen[key]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{D:D,chart:chart,poster:poster}};
})();
</script>
