  /* ================= MOOD MATCH: which mood? ================= */
  function qMood(){var it=rnd(D.tone),k=it[1];
    return C("🎭 Which mood?",TONE[k],toneOthers(k).map(function(x){return TONE[x];}),TWHY[k],couplet(it[0]),{t:"mood",s:it[0],rv:plain(it[0])},3);}

  function qWord(){var it=rnd(D.tone),s=it[0],ans=s.match(/\{([^}]+)\}/)[1].toLowerCase(),seen={},pool=[];
    /* options are shown in lower case (a capital would give the answer away); names (a capital inside a line) are never offered */
    plain(s).split(" / ").forEach(function(line){line.match(/[A-Za-zÀ-ÿ']+/g).forEach(function(w,i){var lw=w.toLowerCase();
      if(i>0&&w!==lw)return;
      if(lw.length>=4&&STOP.indexOf(lw)<0&&MOODY.indexOf(lw)<0&&lw.indexOf("'")<0&&lw!==ans&&!seen[lw]){seen[lw]=1;pool.push(lw);}});});
