<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function n_(x){return x<0?"−"+(-x):String(x);}
  function cs(p){return "("+n_(p[0])+", "+n_(p[1])+")";}
  function key(P){return P.map(function(p){return p[0]+","+p[1];}).sort().join(" ");}
  function eqSet(A,B){return key(A)===key(B);}
  function r2(x){return Math.round(x*100)/100;}
  /* numeric question (whole numbers), wrong options never equal the answer, ≥ 0, no duplicates */
  function QN(en,frame,ans,slips,why,html,data){var seen={},w=[];seen[ans]=1;
    slips.concat([ans+1,ans+2,ans-1,ans+3,ans-2]).forEach(function(x){if(x==null||!isFinite(x)||x<0||seen[x]||w.length>=3)return;seen[x]=1;w.push(String(x));});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:(frame?en+" "+frame:en)+" → "+ans,data:data||{}};}
  /* choice question: pool must hold only definitely-wrong options */
  function C(en,frame,ans,pool,why,review,html,data){
    var seen={},w=[];seen[ans]=1;shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(/NaN|undefined/.test(x))return;if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:frame,html:html||"",answer:String(ans),wrong:w,why:why,review:review||((frame?en+" "+frame:en)+" → "+ans),data:data||{}};}
  /* coordinate question: ans and slips are points; wrong options never the same point as the answer */
  function QP(en,frame,ans,slips,why,html,data){var seen={},w=[],A=cs(ans);seen[A]=1;
    slips.concat([[ans[0]+1,ans[1]],[ans[0],ans[1]-1],[ans[1],ans[0]],[-ans[0],ans[1]],[ans[0],-ans[1]]]).forEach(function(p){var s=cs(p);if(seen[s]||w.length>=3)return;seen[s]=1;w.push(s);});
    return {en:en,frame:frame,html:html||"",answer:A,wrong:w,why:why,review:(frame?en+" "+frame:en)+" → "+A,data:data||{}};}

  /* ---------- transformations (exact, on lattice points) ---------- */
  function TR(v){return {k:"tr",v:v,f:function(p){return [p[0]+v[0],p[1]+v[1]];}};}
  function AX(L){return {k:"ax",L:L,f:function(p){var x=p[0],y=p[1];
    if(L.t==="x")return [x,2*L.c-y];          // horizontal line y = c (c = 0: the x-axis)
    if(L.t==="y")return [2*L.c-x,y];          // vertical line x = c (c = 0: the y-axis)
    if(L.t==="d")return [y,x];                // y = x
    return [-y,-x];}};}                        // y = −x
  function CS(c){return {k:"cs",c:c,f:function(p){return [2*c[0]-p[0],2*c[1]-p[1]];}};}
  function RO(c,cw){return {k:"ro",c:c,cw:cw,f:function(p){var dx=p[0]-c[0],dy=p[1]-c[1];return cw?[c[0]+dy,c[1]-dx]:[c[0]-dy,c[1]+dx];}};}
  function img(T,P){return P.map(T.f);}
  function inBox(P,R){return P.every(function(p){return Math.abs(p[0])<=R&&Math.abs(p[1])<=R;});}
  function bb(P){var xs=P.map(function(p){return p[0];}),ys=P.map(function(p){return p[1];});return [Math.min.apply(null,xs),Math.min.apply(null,ys),Math.max.apply(null,xs),Math.max.apply(null,ys)];}
  function apart(P,Q){var a=bb(P),b=bb(Q);return a[2]<=b[0]||b[2]<=a[0]||a[3]<=b[1]||b[3]<=a[1];}
  function cen(P){var x=0,y=0;P.forEach(function(p){x+=p[0];y+=p[1];});return [x/P.length,y/P.length];}

  /* a small shape with no symmetry (all sides different), vertices on grid points, in a 0..w × 0..h box */
  function d2(a,b){return (a[0]-b[0])*(a[0]-b[0])+(a[1]-b[1])*(a[1]-b[1]);}
  function shape(){
    for(var t=0;t<500;t++){var n=Math.random()<.65?3:4,w=ri(2,3),h=ri(2,3),P=[],ok=true,i,j;
      if(n===3)P=[[0,ri(0,h)],[w,ri(0,h)],[ri(0,w),rnd([0,h])]];
      else P=[[0,ri(0,h-1)],[ri(1,w-1),0],[w,ri(1,h)],[ri(0,w-1),h]];
      var k={};P.forEach(function(p){k[p]=1;});if(Object.keys(k).length<n)continue;
      var c=cen(P);P.sort(function(a,b){return Math.atan2(a[1]-c[1],a[0]-c[0])-Math.atan2(b[1]-c[1],b[0]-c[0]);});
      var A=0;for(i=0;i<n;i++){var a=P[i],b=P[(i+1)%n];A+=a[0]*b[1]-b[0]*a[1];}if(Math.abs(A)<4)continue;var mx=0;for(i=0;i<n;i++)mx=Math.max(mx,Math.sqrt(d2(P[i],P[(i+1)%n])));if(Math.abs(A)/mx<1.3)continue;
      var L=[];for(i=0;i<n;i++)L.push(d2(P[i],P[(i+1)%n]));
      for(i=0;i<n;i++)for(j=i+1;j<n;j++)if(L[i]===L[j])ok=false;
      if(n===4){for(i=0;i<n;i++){var p=P[i],q=P[(i+1)%n],r=P[(i+2)%n];if((q[0]-p[0])*(r[1]-q[1])-(q[1]-p[1])*(r[0]-q[0])===0)ok=false;}
        if(d2(P[0],P[2])===d2(P[1],P[3]))ok=false;}
      if(!ok)continue;var b0=bb(P);return P.map(function(p){return [p[0]-b0[0],p[1]-b0[1]];});}
    return [[0,0],[3,0],[1,2]];
  }
  function place(P,x,y){return P.map(function(p){return [p[0]+x,p[1]+y];});}

  /* line descriptions */
  function lname(L){return L.t==="x"&&L.c===0?"the x-axis":L.t==="y"&&L.c===0?"the y-axis":"the line m";}
  function cname(c,nm){return c[0]===0&&c[1]===0?"the origin (0, 0)":"the point "+nm+cs(c);}
  function tdesc(v){var s=[];if(v[0])s.push(Math.abs(v[0])+(Math.abs(v[0])===1?" unit ":" units ")+(v[0]>0?"right":"left"));if(v[1])s.push(Math.abs(v[1])+(Math.abs(v[1])===1?" unit ":" units ")+(v[1]>0?"up":"down"));return s.join(" and ");}
  function describe(T){ // short description used in options
    if(T.k==="tr")return "Translation: "+tdesc(T.v);
    if(T.k==="ax")return "Axial symmetry in "+lname(T.L);
    if(T.k==="cs")return "Central symmetry in "+(T.c[0]||T.c[1]?cs(T.c):"(0, 0)");
    return "Rotation of 90° "+(T.cw?"clockwise":"anticlockwise")+" about "+(T.c[0]||T.c[1]?cs(T.c):"(0, 0)");
  }

  /* ---------- coordinate-grid kit ---------- */
  /* o = {R, polys:[{P,c,n}], pts:[{p,n,c}], lines:[L], vec:[[a,b]], cen:[{p,n}], axes:true} */
  function clip(L,R){if(L.t==="x")return [[-R,L.c],[R,L.c]];if(L.t==="y")return [[L.c,-R],[L.c,R]];if(L.t==="d")return [[-R,-R],[R,R]];return [[-R,R],[R,-R]];}
  function plane(o){
    var R=o.R||6,s=o.s||22,pd=18,W=2*R*s+2*pd,i;
    var X=function(x){return r2(pd+(x+R)*s);},Y=function(y){return r2(pd+(R-y)*s);};
    var h='<svg class="tg" viewBox="0 0 '+W+' '+W+'" style="max-width:'+Math.round(W*1.45)+'px" data-r="'+R+'" data-s="'+s+'" data-pd="'+pd+'" role="img" aria-label="'+(o.aria||"Shapes on a coordinate grid")+'">';
    for(i=-R;i<=R;i++){h+='<line class="gl" x1="'+X(i)+'" y1="'+Y(-R)+'" x2="'+X(i)+'" y2="'+Y(R)+'"/><line class="gl" x1="'+X(-R)+'" y1="'+Y(i)+'" x2="'+X(R)+'" y2="'+Y(i)+'"/>';}
    if(o.axes!==false){h+='<line class="ax" x1="'+X(-R)+'" y1="'+Y(0)+'" x2="'+X(R)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(-R)+'" x2="'+X(0)+'" y2="'+Y(R)+'"/>';
      for(i=-R;i<=R;i++){if(i===0)continue;h+='<text class="tk" data-v="'+i+'" x="'+X(i)+'" y="'+r2(Y(0)+11)+'" text-anchor="middle">'+n_(i)+'</text><text class="tk" data-w="'+i+'" x="'+r2(X(0)-4)+'" y="'+r2(Y(i)+3.5)+'" text-anchor="end">'+n_(i)+'</text>';}
      h+='<text class="tk" x="'+r2(X(0)-4)+'" y="'+r2(Y(0)+11)+'" text-anchor="end">0</text><text class="axl" x="'+r2(X(R)+7)+'" y="'+r2(Y(0)+4)+'" text-anchor="middle">x</text><text class="axl" x="'+X(0)+'" y="'+r2(Y(R)-6)+'" text-anchor="middle">y</text>';}
    (o.lines||[]).forEach(function(L){var e=clip(L,R),lab=L.n||"m",q=e[1];
      h+='<line class="mir" data-t="'+L.t+'" data-c="'+(L.c||0)+'" x1="'+X(e[0][0])+'" y1="'+Y(e[0][1])+'" x2="'+X(e[1][0])+'" y2="'+Y(e[1][1])+'"/>';
      if(!(L.t==="x"&&L.c===0)&&!(L.t==="y"&&L.c===0)){var lx=L.t==="y"?X(q[0])+9:L.t==="x"?X(q[0])-8:L.t==="d"?X(q[0])-9:X(q[0])-9,ly=L.t==="y"?Y(q[1])+12:L.t==="x"?Y(q[1])-6:L.t==="d"?Y(q[1])+16:Y(q[1])-6;
        h+='<text class="ml" x="'+r2(lx)+'" y="'+r2(ly)+'" text-anchor="middle">'+lab+'</text>';}});
    (o.vec||[]).forEach(function(v){var a=v[0],b=v[1],x1=X(a[0]),y1=Y(a[1]),x2=X(b[0]),y2=Y(b[1]),dx=x2-x1,dy=y2-y1,l=Math.sqrt(dx*dx+dy*dy),ux=dx/l,uy=dy/l;
      h+='<line class="vec" data-a="'+a.join(",")+'" data-b="'+b.join(",")+'" x1="'+x1+'" y1="'+y1+'" x2="'+r2(x2-ux*7)+'" y2="'+r2(y2-uy*7)+'"/><polygon class="vh" points="'+x2+','+y2+' '+r2(x2-ux*10-uy*5)+','+r2(y2-uy*10+ux*5)+' '+r2(x2-ux*10+uy*5)+','+r2(y2-uy*10-ux*5)+'"/>';});
    (o.polys||[]).forEach(function(p){var c=cen(p.P);
      h+='<polygon class="sp '+(p.c||"ob")+'" data-n="'+(p.n||"")+'" points="'+p.P.map(function(q){return X(q[0])+","+Y(q[1]);}).join(" ")+'" data-pts="'+p.P.map(function(q){return q.join(",");}).join(" ")+'"/>';
      if(p.n)h+='<text class="pn '+(p.c||"ob")+'" x="'+X(c[0])+'" y="'+r2(Y(c[1])+4.5)+'" text-anchor="middle">'+p.n+'</text>';});
    (o.pts||[]).forEach(function(p){var dx=p.dx==null?8:p.dx,dy=p.dy==null?-7:p.dy;
      h+='<circle class="pt '+(p.c||"")+'" data-x="'+p.p[0]+'" data-y="'+p.p[1]+'" data-n="'+(p.n||"")+'" cx="'+X(p.p[0])+'" cy="'+Y(p.p[1])+'" r="3.6"/>';
      if(p.n)h+='<text class="pl" x="'+r2(X(p.p[0])+dx)+'" y="'+r2(Y(p.p[1])+dy)+'" text-anchor="middle">'+p.n+'</text>';});
    return h+'</svg>';
  }
  /* squared paper pattern: on = list of [col,row] cells (row 0 at the bottom), line {t:"v"|"h"|"d"} through the middle */
  function cells(W,H,on,L){
    var s=26,pd=12,X=function(c){return pd+c*s;},Y=function(r){return pd+(H-r)*s;},w=W*s+2*pd,hh=H*s+2*pd,o='<svg class="tg cg" viewBox="0 0 '+w+' '+hh+'" style="max-width:'+Math.round(w*1.45)+'px" data-w="'+W+'" data-h="'+H+'" data-s="'+s+'" data-pd="'+pd+'" role="img" aria-label="Pattern of shaded squares with a mirror line">',k={};
    on.forEach(function(c){k[c]=1;});
    for(var c=0;c<W;c++)for(var r=0;r<H;r++)o+='<rect class="cell'+(k[[c,r]]?' on':'')+'" data-c="'+c+'" data-r="'+r+'" x="'+X(c)+'" y="'+Y(r+1)+'" width="'+s+'" height="'+s+'"/>';
    var e=L.t==="v"?[[W/2,-0.4],[W/2,H+0.4]]:L.t==="h"?[[-0.4,H/2],[W+0.4,H/2]]:[[-0.3,-0.3],[W+0.3,H+0.3]];
    o+='<line class="mir" data-t="'+L.t+'" x1="'+r2(X(e[0][0]))+'" y1="'+r2(Y(e[0][1]))+'" x2="'+r2(X(e[1][0]))+'" y2="'+r2(Y(e[1][1]))+'"/><text class="ml" x="'+r2(X(e[1][0])+(L.t==="v"?9:L.t==="h"?-2:-4))+'" y="'+r2(Y(e[1][1])+(L.t==="v"?10:L.t==="h"?-6:-4))+'" text-anchor="middle">m</text>';
    return o+'</svg>';
  }
  function cref(L,W,H){return function(c){var x=c[0],y=c[1];return L.t==="v"?[W-1-x,y]:L.t==="h"?[x,H-1-y]:[y,x];};}

  /* plain shape (not on a grid) with optional dashed lines through it, for axes of symmetry */
  function shapeSVG(P,lines,aria){
    var b0=bb(P),w=b0[2]-b0[0],h=b0[3]-b0[1],c=cen(P),L=0.5*Math.sqrt(w*w+h*h)+0.15*Math.max(w,h),E=[];
    (lines||[]).forEach(function(l){var dx=Math.cos(l.a),dy=Math.sin(l.a);E.push({n:l.n,a:[c[0]-dx*L,c[1]-dy*L],e:[c[0]+dx*L,c[1]+dy*L],d:[dx,dy]});});
    var all=P.concat(E.map(function(x){return x.a;}),E.map(function(x){return x.e;})),b=bb(all),bw=b[2]-b[0],bh=b[3]-b[1],box=E.length?200:170,s=box/Math.max(bw,bh),pd=E.length?22:30,W=r2(bw*s+2*pd),H=r2(bh*s+2*pd);
    var X=function(x){return r2(pd+(x-b[0])*s);},Y=function(y){return r2(pd+(b[3]-y)*s);};
    var o='<svg class="tg sy" viewBox="0 0 '+W+' '+H+'" style="max-width:'+Math.round(W*1.5)+'px" data-s="'+r2(s*1e4)/1e4+'" data-ox="'+X(0)+'" data-oy="'+Y(0)+'" role="img" aria-label="'+(aria||"Shape")+'">';
    o+='<polygon class="sp ob" points="'+P.map(function(p){return X(p[0])+","+Y(p[1]);}).join(" ")+'" data-pts="'+P.map(function(p){return r2(p[0]*1e4)/1e4+","+r2(p[1]*1e4)/1e4;}).join(" ")+'"/>';
    E.forEach(function(l){var ex=X(l.e[0]),ey=Y(l.e[1]);
      o+='<line class="mir dl" data-n="'+l.n+'" x1="'+X(l.a[0])+'" y1="'+Y(l.a[1])+'" x2="'+ex+'" y2="'+ey+'"/>';
      if(l.n)o+='<text class="ml" x="'+r2(Math.min(W-7,Math.max(7,ex+l.d[0]*11)))+'" y="'+r2(Math.min(H-3,Math.max(13,ey-l.d[1]*11+5)))+'" text-anchor="middle">'+l.n+'</text>';});
    return o+'</svg>';
  }

  /* ---------- named shapes for axes of symmetry ---------- */
  function reg(n,r,rot){var P=[];for(var i=0;i<n;i++){var a=rot+2*Math.PI*i/n;P.push([r*Math.cos(a),r*Math.sin(a)]);}return P;}
  var SHAPES={
    "square":function(){var s=ri(3,5);return {P:[[0,0],[s,0],[s,s],[0,s]],ax:4,cen:true};},
    "rectangle":function(){var w=ri(4,7),h=ri(2,w-1);return {P:[[0,0],[w,0],[w,h],[0,h]],ax:2,cen:true};},
    "rhombus":function(){var a=ri(3,5),b=ri(2,a-1)*0.8;return {P:[[0,-b],[a,0],[0,b],[-a,0]],ax:2,cen:true};},
    "parallelogram":function(){var w=ri(4,6),h=ri(2,3),p=ri(1,2);return {P:[[0,0],[w,0],[w+p,h],[p,h]],ax:0,cen:true};},
    "kite":function(){var a=ri(2,3),t=ri(1,2),b=ri(t+2,t+4);return {P:[[0,t],[a,0],[0,-b],[-a,0]],ax:1,cen:false};},
    "isosceles trapezium":function(){var w=ri(5,7),t=ri(2,w-2),h=ri(2,3);if((w-t)%2)t--;return {P:[[0,0],[w,0],[(w+t)/2,h],[(w-t)/2,h]],ax:1,cen:false};},
    "isosceles triangle":function(){var w=ri(3,6),h=ri(3,6);if(Math.abs(h-w*0.866)<0.6)h+=2;if(2*h===w)h++;return {P:[[0,0],[w,0],[w/2,h]],ax:1,cen:false};},
    "equilateral triangle":function(){return {P:reg(3,ri(3,4),Math.PI/2),ax:3,cen:false};},
    "scalene triangle":function(){return {P:[[0,0],[6,0],[ri(1,2),ri(3,4)]],ax:0,cen:false};},
    "right-angled isosceles triangle":function(){var a=ri(3,5);return {P:[[0,0],[a,0],[0,a]],ax:1,cen:false};},
    "regular pentagon":function(){return {P:reg(5,3,Math.PI/2),ax:5,cen:false};},
    "regular hexagon":function(){return {P:reg(6,3,0),ax:6,cen:true};},
    "regular octagon":function(){return {P:reg(8,3,Math.PI/8),ax:8,cen:true};}
  };
  var SNAMES=Object.keys(SHAPES);

  var NAMES=["Siobhán","Darragh","Niamh","Oisín","Aoife","Cian","Róisín","Eoin","Ciara","Seán","Méabh","Tadhg"];

  /* ---------- the transformation that a question asks for ---------- */
  function lineAt(){var r=Math.random();if(r<.25)return {t:"y",c:0};if(r<.5)return {t:"x",c:0};if(r<.62)return {t:"d"};if(r<.72)return {t:"e"};return Math.random()<.5?{t:"y",c:rnd([-2,-1,1,2])}:{t:"x",c:rnd([-2,-1,1,2])};}
  function centreAt(){return Math.random()<.5?[0,0]:[ri(-2,2),ri(-2,2)];}
  function tvec(){var v;do{v=[ri(-6,6),ri(-5,5)];}while(Math.abs(v[0])+Math.abs(v[1])<3||Math.abs(v[0])<1&&Math.abs(v[1])<2);return v;}
  function asked(kind){
    if(kind==="ax"){var L=lineAt();return {T:AX(L),lines:[L],txt:"axial symmetry in "+lname(L)};}
    if(kind==="cs"){var c=centreAt();return {T:CS(c),pts:c[0]||c[1]?[{p:c,n:"C",c:"cc"}]:[{p:c,n:"",c:"cc"}],txt:"central symmetry in "+cname(c,"C")};}
    if(kind==="ro"){var c2=centreAt(),cw=Math.random()<.5;return {T:RO(c2,cw),pts:c2[0]||c2[1]?[{p:c2,n:"C",c:"cc"}]:[{p:c2,n:"",c:"cc"}],txt:"a rotation of 90° "+(cw?"clockwise":"anticlockwise")+" about "+cname(c2,"C")};}
    var v=tvec();return {T:TR(v),txt:"the translation that moves every point "+tdesc(v)};
  }
  /* decoy transformations: every other kind, centred near the middle */
  function decoys(){var D=[],i,j;
    [{t:"x",c:0},{t:"y",c:0},{t:"d"},{t:"e"},{t:"x",c:-1},{t:"x",c:1},{t:"y",c:-1},{t:"y",c:1},{t:"x",c:2},{t:"y",c:-2}].forEach(function(L){D.push(AX(L));});
    for(i=-2;i<=2;i++)for(j=-2;j<=2;j++){D.push(CS([i,j]));D.push(RO([i,j],true));D.push(RO([i,j],false));}
    for(i=0;i<14;i++)D.push(TR(tvec()));
    return shuffle(D);}

  /* ---------- Mirror Move: pick the image ---------- */
  function qPick(kind,lab){
    for(var t=0;t<600;t++){
      var a=asked(kind),R=6,S=shape(),b=bb(S),P=place(S,ri(-R,R-b[2]),ri(-R,R-b[3])),I=img(a.T,P);
      if(!inBox(I,R)||!apart(P,I))continue;
      var cs_=[I],D=decoys();
      for(var d=0;d<D.length&&cs_.length<4;d++){var J=img(D[d],P);if(!inBox(J,R)||eqSet(J,I)||eqSet(J,P))continue;
        if(!cs_.every(function(K){return apart(J,K);})||!apart(J,P))continue;cs_.push(J);}
      if(cs_.length<4)continue;
      /* point labels (the centre C) must not sit inside a shape's box */
      var pts=a.pts||[];if(pts.some(function(p){return cs_.concat([P]).some(function(K){var B=bb(K);return p.p[0]>=B[0]&&p.p[0]<=B[2]&&p.p[1]>=B[1]&&p.p[1]<=B[3];});}))continue;
      var L4=["A","B","C","D"],order=shuffle([0,1,2,3]),polys=[{P:P,c:"ob",n:"S"}],ans;
      if(pts.some(function(p){return p.n==="C";}))L4=["A","B","D","E"];
      order.forEach(function(k,i){polys.push({P:cs_[k],c:"im",n:L4[i]});if(k===0)ans=L4[i];});
      var g=plane({R:R,polys:polys,lines:a.lines,pts:pts,aria:"Shape S and four other shapes on a grid"});
      var how={ax:"Every point and its image are the same distance from the mirror line, on opposite sides, and the shape is flipped.",

  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready speed.":score>=11?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimTest={MAKERS:MAKERS,kit:{plane:plane,cells:cells,shapeSVG:shapeSVG,SHAPES:SHAPES,axesOf:axesOf,AX:AX,CS:CS,RO:RO,TR:TR,img:img,FIX:FIX}};
})();
</script>
