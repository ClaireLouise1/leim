<script>
(function(){
  /* ---------- helpers ---------- */
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  /* ---------- extracts (the PDFs and src/test_character_clues.py read this block: keep it valid JSON) ----------
     texts: {k: label, who: character, pr: he/she, lines: 4 lines,
       how: STEAL method of each line (say, think, effect, act, look),
       q: the short quote from each line (must be inside that line),
       traits: [[trait, line]]  (one line per trait; that line's quote is the proof)} */
  var D=/*DATA*/{
 "texts": [
  {"k": "📖 Story", "who": "Mia", "pr": "she",
   "lines": ["Mia gave half of her lunch to the new boy, who had forgotten his.",
             "The boy stared at her, as if nobody had ever done that before.",
             "“It's only a sandwich,” Mia said, going red.",
             "Later, she wondered why nobody else had noticed him sitting alone."],
   "how": ["act", "effect", "say", "think"],
   "q": ["gave half of her lunch", "stared at her", "going red", "nobody else had noticed him"],
   "traits": [["kind", 1], ["shy", 3]]},
  {"k": "📖 Story", "who": "Darragh", "pr": "he",
   "lines": ["Darragh's school jumper was creased, and one shoelace was always open.",
             "He stayed in bed until ten past eight and left his homework on the kitchen table.",
             "His teacher sighed when she saw the empty page again.",
             "“The dog ate it, Miss, and then he asked for seconds,” Darragh said, and the whole class laughed."],
   "how": ["look", "act", "effect", "say"],
   "q": ["one shoelace was always open", "stayed in bed until ten past eight", "sighed", "the whole class laughed"],
   "traits": [["lazy", 2], ["funny", 4]]},
  {"k": "📖 Story", "who": "Niamh", "pr": "she",
   "lines": ["When the dog ran into the river, Niamh kicked off her shoes and waded in after it.",
             "Her little brother screamed at her to come back.",
             "She thought the current would pull her under, but the dog was nearer now.",
             "“Got him!” Niamh shouted, holding the soaking dog up in the air."],
   "how": ["act", "effect", "think", "say"],
   "q": ["waded in after it", "screamed at her to come back", "the dog was nearer now", "Got him!"],
   "traits": [["brave", 1]]},
  {"k": "📖 Story", "who": "Conor", "pr": "he",
   "lines": ["Conor wore his old runners and stood at the back with his arms folded.",
             "When Sam lifted the trophy, Conor scowled and looked away.",
             "He wished he had trained harder all season.",
             "His mum squeezed his shoulder on the way to the car."],
   "how": ["look", "act", "think", "effect"],
   "q": ["arms folded", "scowled and looked away", "trained harder all season", "squeezed his shoulder"],
   "traits": [["jealous", 2]]},
  {"k": "📖 Story", "who": "Aisling", "pr": "she",
   "lines": ["“You hold the map, you carry the bags, and nobody talks,” Aisling said.",
             "The others groaned but did what she said.",
             "At the crossroads she spotted the moss on the trees and worked out which way was north.",
             "She hoped nobody would notice that her hands were shaking."],
   "how": ["say", "effect", "act", "think"],
   "q": ["and nobody talks", "did what she said", "worked out which way was north", "her hands were shaking"],
   "traits": [["bossy", 1], ["clever", 3]]},
  {"k": "📖 Story", "who": "Fionn", "pr": "he",
   "lines": ["Fionn found a wallet with €50 in it outside the chipper.",
             "For a second he thought about the new football boots he wanted.",
             "Then he walked straight into the Garda station and handed it in.",
             "The owner, an old man, shook his hand and called him a credit to his parents."],
   "how": ["act", "think", "act", "effect"],
   "q": ["found a wallet", "the new football boots he wanted", "handed it in", "a credit to his parents"],
   "traits": [["honest", 3]]},
  {"k": "📖 Story", "who": "Leah", "pr": "she",
   "lines": ["Leah wore her hood up, even indoors.",
             "When the teacher asked her name, she stared at her shoes and whispered it.",
             "Nobody in the new class knew she could sing.",
             "But at the talent show she walked on stage, took the microphone and sang."],
   "how": ["look", "act", "effect", "act"],
   "q": ["her hood up", "stared at her shoes", "Nobody in the new class knew", "walked on stage"],
   "traits": [["shy", 2], ["brave", 4]]},
  {"k": "📖 Story", "who": "Ciarán", "pr": "he",
   "lines": ["Ciarán grabbed the biggest slice of pizza before anyone else sat down.",
             "His little sister watched with her mouth open.",
             "He thought it was fair, because he had paid for half.",
             "Ciarán had tomato sauce on his chin and on his new white shirt."],
   "how": ["act", "effect", "think", "look"],
   "q": ["grabbed the biggest slice", "watched with her mouth open", "he had paid for half", "tomato sauce on his chin"],
   "traits": [["selfish", 1]]},
  {"k": "📖 Story", "who": "Saoirse", "pr": "she",
   "lines": ["Saoirse rolled her eyes when her nan asked about school.",
             "Her nan smiled and went back to her knitting.",
             "Later, she remembered that her nan had come all the way from Sligo.",
             "She made her nan a cup of tea and sat down beside her."],
   "how": ["act", "effect", "think", "act"],
   "q": ["rolled her eyes", "went back to her knitting", "come all the way from Sligo", "made her nan a cup of tea"],
   "traits": [["rude", 1], ["kind", 4]]},
  {"k": "📖 Story", "who": "Oisín", "pr": "he",
   "lines": ["Oisín spotted the mistake in the teacher's sum before anyone else.",
             "He had glasses held together with tape.",
             "When he got full marks, he put up his hand and owned up to guessing one answer.",
             "Ms Walsh gave him a gold star anyway."],
   "how": ["act", "look", "act", "effect"],
   "q": ["spotted the mistake", "glasses held together with tape", "owned up to guessing", "gave him a gold star"],
   "traits": [["clever", 1], ["honest", 3]]},
  {"k": "🎭 Story", "who": "Róisín", "pr": "she",
   "lines": ["“It should have been me,” Róisín said when the cast list went up.",
             "Her face was pale and her lips were pressed tight.",
             "Grace, who got the lead, said nothing.",
             "That night, lying awake, she thought of a way to help Grace learn her lines."],
   "how": ["say", "look", "effect", "think"],
   "q": ["It should have been me", "her lips were pressed tight", "said nothing", "help Grace learn her lines"],
   "traits": [["jealous", 1], ["kind", 4]]},
  {"k": "⚽ Story", "who": "Seán", "pr": "he",
   "lines": ["Seán pointed at each player and told them exactly where to stand.",
             "Nobody argued; they just shuffled into place.",
             "He wore the captain's armband, although the real captain was off sick.",
             "When the other team's striker went down injured, Seán ran over first to help."],
   "how": ["act", "effect", "look", "act"],
   "q": ["told them exactly where to stand", "shuffled into place", "the captain's armband", "ran over first to help"],
   "traits": [["bossy", 1], ["kind", 4]]},
  {"k": "🤸 Story", "who": "Tadhg", "pr": "he",
   "lines": ["Tadhg spent the whole of PE lying on the crash mat.",
             "“I'm doing the plank, Coach, just very slowly,” Tadhg said.",
             "Even Coach Murphy had to laugh.",
             "His runners were still spotless at the end of the class."],
   "how": ["act", "say", "effect", "look"],
   "q": ["lying on the crash mat", "just very slowly", "had to laugh", "still spotless"],
   "traits": [["lazy", 1], ["funny", 3]]},
  {"k": "🎵 Story", "who": "Éabha", "pr": "she",
   "lines": ["Éabha knew there were only two tickets left for the concert.",
             "She bought both, even though she had promised one to her cousin Kate.",
             "Kate found out from a photo online and cried.",
             "At the concert, Éabha wore Kate's borrowed jacket."],
   "how": ["think", "act", "effect", "look"],
   "q": ["only two tickets left", "bought both", "found out from a photo online and cried", "wore Kate's borrowed jacket"],
   "traits": [["selfish", 2]]}
 ]
}/*END*/;
  var TR={kind:"🤝 Kind",brave:"🦁 Brave",shy:"🙈 Shy",bossy:"📣 Bossy",selfish:"🙅 Selfish",lazy:"🛋️ Lazy",honest:"💯 Honest",jealous:"😒 Jealous",funny:"😂 Funny",clever:"🧠 Clever",rude:"🙄 Rude"};
  var CLOSE={bossy:["rude"],rude:["bossy","selfish"],selfish:["jealous","rude"],jealous:["selfish"]};   /* look-alikes: never offered as wrong */
  var HOW={say:"💬 Speech",think:"💭 Thoughts",effect:"👥 Effect on others",act:"🎬 Actions",look:"👀 Looks"};
  var HOWWHY={say:"Speech: what the character SAYS (the words in “ ”).",think:"Thoughts: what goes on in their head (thought, wondered, wished, knew).",
    effect:"Effect on others: how OTHER people react to them.",act:"Actions: what the character DOES.",look:"Looks: what they look like or wear."};
  var LINES=["Line 1","Line 2","Line 3","Line 4"],HOWS=["say","think","effect","act","look"];
  var FIXED=LINES.concat(HOWS.map(function(k){return HOW[k];}),Object.keys(TR).map(function(k){return TR[k];}));
  function C(en,ans,pool,why,html,data,nw){var seen={},w=[];nw=nw||3;seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<nw){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,nw:nw,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  /* the extract card: numbered lines, an optional highlighted line */
  function card(T,hl){var h='<div class="ch-card"><span class="ch-k">'+T.k+' · '+esc(T.who)+'</span>';
    T.lines.forEach(function(l,i){h+='<p'+(hl===i+1?' class="hl"':'')+'><b>'+(i+1)+'</b>'+esc(l)+'</p>';});
    return h+'</div>';}
  function claim(t){return '<p class="ch-claim">🔎 '+esc(t)+'</p>';}
  function cq(s){return "“"+s+"”";}
  function says(T,tr){return T.who+" is "+TR[tr].split(" ")[1].toLowerCase()+".";}
  /* keep the same extract for 3 questions so players read it once */
  var cur=null,uses=0;
  function text(){if(!cur||uses<=0){var n;do{n=rnd(D.texts);}while(n===cur&&D.texts.length>1);cur=n;uses=3;}uses--;return cur;}
  function idx(T){return D.texts.indexOf(T);}

  /* ================= WHICH LINE SHOWS IT? ================= */
  function qLine(){var T=text(),t=rnd(T.traits),ln=t[1];
    return C("Which line shows it?","Line "+ln,LINES,"Line "+ln+": "+cq(T.q[ln-1]),claim(says(T,t[0]))+card(T),{t:"line",x:idx(T),tr:t[0],rv:says(T,t[0])},3);}
  /* ================= STEAL: how does the writer show it? ================= */
  function qHow(){var T=text(),i=Math.floor(Math.random()*4),m=T.how[i];
    return C("How do we learn about "+T.who+"?",HOW[m],HOWS.map(function(k){return HOW[k];}),HOWWHY[m],card(T,i+1),{t:"how",x:idx(T),ln:i+1,rv:"Line "+(i+1)+": "+T.lines[i]},4);}
  /* ================= WHAT ARE THEY LIKE? ================= */
  function qTrait(){var T=text(),t=rnd(T.traits),bar=T.traits.map(function(x){return x[0];});
    bar.forEach(function(k){bar=bar.concat(CLOSE[k]||[]);});
    var pool=Object.keys(TR).filter(function(k){return bar.indexOf(k)<0;}).map(function(k){return TR[k];});
    return C("🕵️ What is "+T.who+" like?",TR[t[0]],pool,"Clue: Line "+t[1]+" "+cq(T.q[t[1]-1]),card(T,t[1]),{t:"trait",x:idx(T),ln:t[1],rv:T.who+": "+T.lines[t[1]-1]},3);}
  /* ================= BEST QUOTE ================= */
  function qQuote(){var T=text(),t=rnd(T.traits),ln=t[1];
    var pool=T.q.filter(function(s,i){return i!==ln-1;}).map(cq);
    return C("💬 Best quote to prove it?",cq(T.q[ln-1]),pool,"Line "+ln+" shows it: "+T.lines[ln-1],claim(says(T,t[0]))+card(T),{t:"quote",x:idx(T),tr:t[0],rv:"Best proof: "+says(T,t[0])},3);}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    line:[qLine],
    how:[qHow],
    trait:[qTrait],
    quote:[qQuote],
    mixed:[qLine,qHow,qHow,qTrait,qTrait,qQuote]
  };

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=90;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;cur=null;uses=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"start"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<(q.nw||3))&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>14;})?" one":"");
    var opts=shuffle([q.answer].concat(q.wrong)),ORD=FIXED;
    if(opts.every(function(o){return ORD.indexOf(o)>=0;}))opts.sort(function(a,b){return ORD.indexOf(a)-ORD.indexOf(b);}); /* label buttons stay in the same place */
    opts.forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="line"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="line"&&streak%5===0?800:500):3200);
  }
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=20?"Brilliant! You read characters like a detective.":score>=12?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=5){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{D:D,TR:TR,HOW:HOW}};
})();
</script>
