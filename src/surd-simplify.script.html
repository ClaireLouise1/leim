<script>
(function(){
  /* ---------- helpers ---------- */
  function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
  var M="−";
  function n_(x){return x<0?M+(-x):String(x);}
  /* n = s² × t with t square-free: returns [s,t] */
  function simp(n){var s=1,t=n;for(var k=2;k*k<=t;k++){while(t%(k*k)===0){t/=k*k;s*=k;}}return [s,t];}
  function sqf(n){return n>1&&simp(n)[0]===1;}
  function isSq(n){var r=Math.round(Math.sqrt(n));return r*r===n;}
  var SQF=[2,3,5,6,7,10,11,13,14,15];
  /* a√b as text (b square-free or 1) */
  function S(a,b){if(a===0)return "0";if(b===1)return n_(a);var c=Math.abs(a)===1?"":String(Math.abs(a));return (a<0?M:"")+c+"√"+b;}
  function SV(a,b){return a*Math.sqrt(b);}
  function R(n){var p=simp(n);return [S(p[0],p[1]),Math.sqrt(n)];}            /* √n fully simplified */
  function K(a,b){var p=simp(b);return [S(a*p[0],p[1]),a*Math.sqrt(b)];}        /* a√b fully simplified */
  /* term written for a question: a√n (n not simplified) */
  function W(a,n){return (a===1?"":String(a))+"√"+n;}
  /* c + d√b */
  function F(c,d,b){if(d===0)return [n_(c),c];if(c===0)return [S(d,b),SV(d,b)];
    if(c<0&&d>0)return [S(d,b)+" "+M+" "+(-c),c+SV(d,b)];
    return [n_(c)+(d<0?" "+M+" ":" + ")+S(Math.abs(d),b),c+SV(d,b)];}
  function EQ(s){return '<div class="eqs"><p class="e" data-e="1">'+s+'</p></div>';}
  /* choice question from [text,value] options: wrong ones must have a different value */
  function CV(en,ans,pool,why,html,data){var seen={},w=[];seen[ans[0]]=1;
    shuffle(pool.slice()).forEach(function(o){if(!o||o[0]==null)return;var s=String(o[0]);if(/NaN|undefined|Infinity/.test(s))return;
      if(o[1]!=null&&Math.abs(o[1]-ans[1])<1e-9)return;if(!seen[s]&&w.length<3){seen[s]=1;w.push(s);}});
    return {en:en,frame:"",html:html||"",answer:ans[0],wrong:w,why:why,review:(data&&data.rv?data.rv:en)+" → "+ans[0],data:data||{}};}
  function C(en,ans,pool,why,html,data){var seen={},w=[];seen[ans]=1;
    shuffle(pool.slice()).forEach(function(x){if(x==null)return;x=String(x);if(!seen[x]&&w.length<3){seen[x]=1;w.push(x);}});
    return {en:en,frame:"",html:html||"",answer:String(ans),wrong:w,why:why,review:(data&&data.rv?data.rv:en)+" → "+ans,data:data||{}};}
  /* plausible near-miss versions of a√b */
  function near(a,b){var o=[[S(a+1,b),SV(a+1,b)],[S(2*a,b),SV(2*a,b)],[S(a+2,b),SV(a+2,b)]];if(a>1)o.push([S(a-1,b),SV(a-1,b)]);
    if(b>1)o.push([n_(a*b),a*b]);
    return o;}

  /* ================= SURD SIMPLIFY ================= */
  function qSimp(){var b,a,n;do{b=rnd(SQF);a=ri(2,b<=3?10:6);n=a*a*b;}while(n>300);
    var ans=K(1,n),pool=near(a,b);
    if(sqf(a)&&a!==b)pool.push([S(b,a),SV(b,a)]);
    pool.push([S(a*a,b),SV(a*a,b)]);
    return CV("Simplify.",ans,pool,n+" = "+(a*a)+" × "+b+", and √"+(a*a)+" = "+a+". So √"+n+" = "+ans[0]+".",EQ("√"+n),{t:"simp",rv:"√"+n});}
  function qBack(){var b=rnd(SQF.slice(0,6)),a=ri(2,6),N=a*a*b,ans=["√"+N,a*Math.sqrt(b)];
    var pool=[a*b,a+b,a*a+b,2*a*b,a*b*b,a*a*b*b].map(function(m){return ["√"+m,Math.sqrt(m)];});
    return CV("Write as one square root.",ans,pool,a+" = √"+(a*a)+", so "+S(a,b)+" = √("+(a*a)+" × "+b+") = √"+N+".",EQ(S(a,b)),{t:"back",rv:S(a,b)});}
  function qSurd(){var not=Math.random()<0.4,sq=shuffle([4,9,16,25,36,49,64,81,100,121,144]).slice(0,3),ns=[],k;
    while(ns.length<3){k=ri(2,60);if(!isSq(k)&&ns.indexOf(k)<0)ns.push(k);}
    if(!not)return C("Which one is a surd?","√"+ns[0],sq.map(function(v){return "√"+v;}),"√"+ns[0]+" is not a whole number (or a fraction). "+sq.map(function(v){return "√"+v+" = "+Math.sqrt(v);}).join(", ")+".","",{t:"surd"});
    return C("Which one is NOT a surd?","√"+sq[0],ns.map(function(v){return "√"+v;}),"√"+sq[0]+" = "+Math.sqrt(sq[0])+", a whole number. The others never come out exact.","",{t:"notsurd"});}
  function qBetween(){var n;do{n=ri(5,150);}while(isSq(n));var k=Math.floor(Math.sqrt(n)),h=Math.floor(n/2);
    var pool=[(k-1)+" and "+k,(k+1)+" and "+(k+2)];if(h!==k&&h!==k-1&&h!==k+1)pool.push(h+" and "+(h+1));pool.push((k+2)+" and "+(k+3));
    return C("Between which two whole numbers?",k+" and "+(k+1),pool,k+"² = "+(k*k)+" and "+(k+1)+"² = "+((k+1)*(k+1))+". "+n+" is in between.",EQ("√"+n),{t:"between",rv:"√"+n});}

  /* ================= ADD & SUBTRACT ================= */
  function qLike(){var b=rnd(SQF.slice(0,7)),p=ri(2,9),q=ri(1,8),minus=Math.random()<0.4;if(minus&&q>=p){var t=p;p=q+1;q=t;if(q===p)q=p-1;}
    var r=minus?p-q:p+q,ans=[S(r,b),SV(r,b)],e=S(p,b)+(minus?" "+M+" ":" + ")+S(q,b),r2=minus?p+q:p-q;
    var pool=near(r,b).concat([[S(p*q,b),SV(p*q,b)],[S(r2,b),SV(r2,b)],[n_(r),r]]);if(sqf(2*b))pool.push([S(r,2*b),SV(r,2*b)]);
    return CV("Simplify.",ans,pool,"Like surds: add or take the numbers in front. "+p+(minus?" "+M+" ":" + ")+q+" = "+r+", so "+ans[0]+".",EQ(e),{t:"like",rv:e});}
  function qAddSimp(){var b=rnd([2,3,5,6,7]),p,q;do{p=ri(1,5);q=ri(1,5);}while(p===q||(p*p*b>200||q*q*b>200));
    var minus=Math.random()<0.35;if(minus&&q>p){var t=p;p=q;q=t;}
    var r=minus?p-q:p+q,ans=[S(r,b),SV(r,b)],e=(p===1?"√"+b:"√"+(p*p*b))+(minus?" "+M+" ":" + ")+(q===1?"√"+b:"√"+(q*q*b));
    var tot=minus?p*p*b-q*q*b:p*p*b+q*q*b,pool=near(r,b).concat([R(tot),[S(p*q,b),SV(p*q,b)]]);
    if(Math.random()<0.4)pool=["Can't simplify"].map(function(s){return [s,NaN];}).concat(pool.slice(0,3));
    var parts=[p,q].map(function(k){return k===1?"√"+b:"√"+(k*k*b)+" = "+S(k,b);}).join(", ");
    return CV("Simplify.",ans,pool,parts+". Then "+p+(minus?" "+M+" ":" + ")+q+" = "+r+": "+ans[0]+".",EQ(e),{t:"addsimp",rv:e});}
  function qCant(){var x=rnd([2,3,5,6,7]),y;do{y=rnd([2,3,5,6,7,10,11]);}while(y===x);if(y<x){var t=x;x=y;y=t;}
    var e="√"+x+" + √"+y,pool=[R(x+y),R(x*y),K(2,x+y),[S(2,x),SV(2,x)]];
    return CV("Simplify.",["Can't simplify",NaN],pool,"√"+x+" and √"+y+" are not like surds, so they can't be added. (√"+x+" + √"+y+" is NOT √"+(x+y)+".)",EQ(e),{t:"cant",rv:e});}

  /* ================= MULTIPLY & DIVIDE ================= */
  var NS=[2,3,5,6,7,8,10,12,15,18,20,24,27,32,50];
  function qMul(){var x,y;do{x=rnd(NS);y=rnd(NS);}while(x===y&&Math.random()<0.6||x*y>600);
    var ans=R(x*y),p=simp(x*y),e="√"+x+" × √"+y,pool=near(p[0],p[1]).concat([R(x+y),K(2,x*y)]);
    return CV("Work out.",ans,pool,"√"+x+" × √"+y+" = √"+(x*y)+(ans[0]!=="√"+(x*y)?" = "+ans[0]:"")+".",EQ(e),{t:"mul",rv:e});}
  function qCoef(){var x=rnd([2,3,5,6,7]),y=rnd([2,3,5,6,7,10]),p=ri(2,5),q=ri(2,5),ans=K(p*q,x*y),s=simp(x*y);
    var e=S(p,x)+" × "+S(q,y),pool=near(s[0]*p*q,s[1]).concat([K(p+q,x*y),[n_(p*q*x*y),p*q*x*y],K(p*q,x+y)]);
    return CV("Work out.",ans,pool,"Numbers: "+p+" × "+q+" = "+(p*q)+". Roots: √"+x+" × √"+y+" = "+R(x*y)[0]+". Answer "+ans[0]+".",EQ(e),{t:"coef",rv:e});}
  function qSqr(){var b=rnd(SQF.slice(0,7)),p=rnd([1,1,2,3,4,5]),v=p*p*b,e="("+S(p,b)+")²";
    var pool=[[n_(p*b),p*b],[n_(v*b),v*b],[S(p*p,b),SV(p*p,b)],[S(2*p,b),SV(2*p,b)],[n_(v+1),v+1]];
    return CV("Work out.",[n_(v),v],pool,(p>1?p+"² × ":"")+"(√"+b+")² = "+(p>1?(p*p)+" × ":"")+b+" = "+v+". Squaring removes the root.",EQ(e),{t:"sqr",rv:e});}
  function qDiv(){var y,k,x;do{y=rnd([2,3,5,6,7]);k=rnd([4,9,16,25,2,3,5,6,7,8,12]);x=y*k;}while(isSq(x));var ans=R(k),e="√"+x+" ÷ √"+y,s=simp(k);
    var pre="";if(Math.random()<0.35){var q=rnd([2,3]),p=q*ri(2,5);e=S(p,x)+" ÷ "+S(q,y);ans=K(p/q,k);s=[s[0]*p/q,s[1]];pre="Numbers: "+p+" ÷ "+q+" = "+(p/q)+". ";}
    var pool=near(s[0],s[1]).concat([[n_(k),k],R(x-y),R(x*y),[S(3*s[0],s[1]),SV(3*s[0],s[1])]]);
    return CV("Work out.",ans,pool,pre+"Roots: √("+x+" ÷ "+y+") = √"+k+(R(k)[0]!=="√"+k?" = "+R(k)[0]:"")+". Answer "+ans[0]+".",EQ(e),{t:"div",rv:e});}

  /* ================= HIGHER LEVEL: BRACKETS ================= */
  function qExp1(){var b=rnd([2,3,5,6,7]),p=ri(1,6),q=ri(1,4),minus=Math.random()<0.4,sg=minus?-1:1;
    var e="√"+b+"("+p+(minus?" "+M+" ":" + ")+S(q,b)+")",ans=F(sg*q*b,p,b);
    var pool=[F(sg*q,p,b),F(sg*q*b,p+q,b),[n_(p+sg*q*b),p+sg*q*b],F(sg*q*b*b,p,b),F(-sg*q*b,p,b)];
    return CV("Expand.",ans,pool,"√"+b+" × "+p+" = "+S(p,b)+". √"+b+" × "+(minus?M:"")+S(q,b)+" = "+(minus?M:"")+(q*b)+". Answer "+ans[0]+".",EQ(e),{t:"exp1",rv:e});}
  function qConj(){var b=rnd([2,3,5,6,7,10,11]),p=ri(1,6),v=p*p-b,e="("+p+" + √"+b+")("+p+" "+M+" √"+b+")";
    var pool=[[n_(p*p+b),p*p+b],[n_(p-b),p-b],[n_(p*p-b*b),p*p-b*b],F(v,2*p,b),[n_(v+2),v+2],[n_(2*p-b),2*p-b]];
    return CV("Expand.",[n_(v),v],pool,p+"² "+M+" (√"+b+")² = "+(p*p)+" "+M+" "+b+" = "+n_(v)+". The middle terms cancel.",EQ(e),{t:"conj",rv:e});}
  function qSq(){var b=rnd([2,3,5,6,7]),p=ri(1,5),e="("+p+" + √"+b+")²",ans=F(p*p+b,2*p,b);
    var pool=[[n_(p*p+b),p*p+b],F(p*p+b,p,b),F(p*p,2*p,b),F(p*p+b*b,2*p,b),F(p*p+b,4*p,b)];
    return CV("Expand.",ans,pool,"("+p+" + √"+b+")("+p+" + √"+b+") = "+(p*p)+" + "+S(p,b)+" + "+S(p,b)+" + "+b+" = "+ans[0]+".",EQ(e),{t:"sq",rv:e});}
  function qExp2(){var b=rnd([2,3,5,7]),p=ri(1,5),q;do{q=ri(1,5);}while(q===p);var e="("+p+" + √"+b+")("+q+" + √"+b+")",ans=F(p*q+b,p+q,b);
    var pool=[[n_(p*q+b),p*q+b],F(p*q,p+q,b),F(p*q+b,p*q,b),F(p*q+b*b,p+q,b),F(p+q,p*q+b,b)];
    return CV("Expand.",ans,pool,(p*q)+" + "+S(p,b)+" + "+S(q,b)+" + "+b+" = "+ans[0]+".",EQ(e),{t:"exp2",rv:e});}

  /* ---------- makers by mode ---------- */
  var MAKERS={
    simp:[qSimp,qSimp,qSimp,qBack,qSurd,qBetween],
    add:[qLike,qAddSimp,qAddSimp,qCant],
    mul:[qMul,qMul,qCoef,qSqr,qDiv],
    hl:[qExp1,qConj,qSq,qExp2],
    mixed:[]
  };
  ["simp","add","mul","hl"].forEach(function(m){MAKERS[m].forEach(function(f){if(MAKERS.mixed.indexOf(f)<0)MAKERS.mixed.push(f);});});

  /* ---------- Game loop ---------- */
  var $=function(id){return document.getElementById(id);};
  var mode,score,streak,best,left,timer,current,locked,mistakes,asked_,last="",DUR=60;
  function show(id){["start","play","end"].forEach(function(x){$(x).hidden=(x!==id);});}
  function start(m){
    mode=m;DUR=m==="simp"?60:90;score=0;streak=0;best=0;left=DUR;mistakes=[];asked_=0;
    $("score").textContent=0;$("streak").textContent=0;$("time").textContent=DUR+"s";
    $("bar").style.width="100%";$("bar").className="";
    show("play");next();$("play").scrollIntoView({behavior:"smooth",block:"center"});
    clearInterval(timer);
    timer=setInterval(function(){
      left--;$("time").textContent=left+"s";
      $("bar").style.width=Math.min(100,left/DUR*100)+"%";
      $("bar").className=left<=10?"low":"";
      if(left<=0)finish();
    },1000);
  }
  function next(){
    locked=false;var q,tries=0;
    do{q=rnd(MAKERS[mode])();tries++;}while((q.review===last||q.wrong.length<3)&&tries<20);
    last=q.review;current=q;$("hint").textContent="";
    $("en").textContent=q.en;
    $("frame").innerHTML=q.html||"";
    $("frame").className="frame";
    var box=$("choices");box.innerHTML="";
    box.className="choices"+([q.answer].concat(q.wrong).some(function(x){return x.length>14;})?" one":"");
    shuffle([q.answer].concat(q.wrong)).forEach(function(t,i){
      var b=document.createElement("button");b.className="choice";b.textContent=t;b.setAttribute("aria-label","Option "+(i+1)+": "+t);
      b.onclick=function(){choose(b,t);};box.appendChild(b);
    });
  }
  function choose(btn,t){
    if(locked||left<=0)return;locked=true;asked_++;
    var ok=t===current.answer;
    if(ok){score++;streak++;if(streak>best)best=streak;btn.classList.add("right");
      if(mode==="simp"&&streak%5===0){left+=3;$("time").textContent=left+"s";$("hint").textContent="+3 seconds! "+streak+" in a row.";}}
    else{
      streak=0;btn.classList.add("wrong");
      [].forEach.call($("choices").children,function(c){if(c.textContent===current.answer)c.classList.add("right");});
      mistakes.push({review:current.review,said:t,why:current.why||""});
      if(current.why)$("hint").textContent=current.why;
    }
    $("score").textContent=score;$("streak").textContent=streak;
    setTimeout(function(){if(left>0)next();},ok?(mode==="simp"&&streak%5===0?700:350):3200);
  }
  function esc2(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
  function finish(){
    clearInterval(timer);locked=true;
    $("final").textContent=score;
    var msg=score>=18?"Brilliant! That's exam-ready speed.":score>=11?"Great work!":score>=5?"Good! Keep going and you'll get faster.":"Good start. Try again and beat your score!";
    $("summary").textContent=msg+" Best streak: "+best+" in a row. ("+asked_+" answered)";
    var r=$("review");
    if(mistakes.length){
      var seen={},html="<h3 style='font-size:18px'>Go back over these</h3><ul>";
      mistakes.forEach(function(m){if(seen[m.review])return;seen[m.review]=1;
        html+="<li><span class='fix'>"+esc2(m.review)+"</span> <span style='color:var(--muted)'>(not "+esc2(m.said)+")</span>"+(m.why?"<br><span style='font-size:14px;color:var(--muted)'>"+esc2(m.why)+"</span>":"")+"</li>";});
      r.innerHTML=html+"</ul>";
    } else r.innerHTML=asked_?"<p style='text-align:center'>No mistakes at all. Perfect!</p>":"";
    show("end");
  }
  [].forEach.call(document.querySelectorAll(".mode"),function(b){b.onclick=function(){start(b.dataset.mode);};});
  $("again").onclick=function(){start(mode);};
  $("menu").onclick=function(){show("start");};
  document.addEventListener("keydown",function(e){
    if($("play").hidden)return;
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4){var b=$("choices").children[n-1];if(b)b.click();}
  });
  window.__leimFinish=finish;
  window.__leimTest={MAKERS:MAKERS,kit:{simp:simp,S:S,F:F}};
})();
</script>
